<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小工具箱</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#1a1d21;--sub:#6b7280;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--sub);font-size:13px}
a.tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(16,24,40,.05)}
a.tool:active{background:#f2f4f7}
a.tool b{display:block;font-size:15.5px;margin-bottom:2px}
a.tool span{font-size:12.5px;color:var(--sub)}
footer{margin-top:26px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>小工具箱</h1>
  <p class="sub">全部都是單一網頁、純本機處理，資料不會傳到任何伺服器。</p>

  <a class="tool" href="sign.html">
    <b>✍️ 手寫去背貼章工具</b>
    <span>拍下紙上的手寫 → 自動去背 → 貼到 PDF／圖片 → 下載上傳</span>
  </a>

</div>
<footer>個人工具，非商業用途</footer>
</body>
</html>
