<style>
/* Layout: a toy shelf — big title sign, then a grid of chunky game cards (1 col phone, 3 col wide); a game opens full-screen with a close bar on top. Deliberately single bright theme, matching the games. */
:root{
  --ink:#4A4552; --bg:#F6F0E4; --dot:#E9DFC8; --white:#FFFFFF;
  --red:#D8796E; --blue:#6E91C7; --yellow:#E9C46A; --green:#7FB08A; --sky:#C9E1EA; --orange:#E3A06B;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:radial-gradient(circle,var(--dot) 18%,transparent 20%) 0 0/34px 34px,var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
.sign{align-self:center;display:flex;align-items:center;gap:12px;background:var(--white);border:5px solid var(--ink);border-radius:24px;padding:10px 24px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg)}
.sign svg{width:clamp(40px,10vw,60px);height:auto;flex:none}
h1{margin:0;font-size:clamp(30px,8vw,52px);font-weight:900;letter-spacing:.06em;line-height:1.1;text-wrap:balance}
h1 span:nth-child(4n+1){color:var(--red)}h1 span:nth-child(4n+2){color:var(--blue)}h1 span:nth-child(4n+3){color:var(--green)}h1 span:nth-child(4n+4){color:var(--orange)}
.offline{margin:-12px 0 0;align-self:center;font-weight:700;font-size:15px;color:#5E7A64;background:#E3EEDF;border:2px solid #A9C4A8;border-radius:999px;padding:4px 14px}
.sub{margin:0;text-align:center;font-weight:700;font-size:clamp(16px,4vw,20px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--white);border:5px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:9px 10px 0 var(--ink)}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.card:focus-visible{outline:5px dashed var(--ink);outline-offset:5px}
.pic{aspect-ratio:4/3;max-width:100%;border-bottom:5px solid var(--ink);display:grid;place-items:center}
.pic svg{width:86%;height:86%}
.c1 .pic{background:var(--yellow)}.c4 .pic{background:#CFE5D8}.c5 .pic{background:#F1DAE2}.c6 .pic{background:#D4E1F0}.c7 .pic{background:#F1DDB5}.c8 .pic{background:#D3E4C9}.c9 .pic{background:#F3ECE0}.c10 .pic{background:#E3E6E2}.c11 .pic{background:#E8D2A6}.c12 .pic{background:#E3EEDF}.c2 .pic{background:var(--sky)}.c3 .pic{background:#EFCBA6}
.info{display:flex;align-items:center;gap:12px;padding:14px 16px}
.info .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-size:clamp(24px,6vw,30px);font-weight:900}
.desc{font-size:16px;font-weight:700;color:#4A4A56}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;background:var(--green);box-shadow:3px 3px 0 var(--ink)}
.play svg{width:26px;height:26px;margin-left:4px}

/* full-screen player */
.player{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--ink)}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--yellow);border-bottom:5px solid var(--ink)}
.bar .title{flex:1;min-width:0;font-weight:900;font-size:clamp(20px,5vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--red);color:var(--white);border:4px solid var(--ink);border-radius:999px;padding:6px 18px 6px 10px;font-weight:900;font-size:22px;box-shadow:3px 3px 0 var(--ink);text-shadow:2px 2px 0 var(--ink)}
.close svg{width:30px;height:30px}
.close:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.close:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.player iframe{flex:1;width:100%;border:0;background:var(--white);display:block}
body.playing{overflow:hidden}
.player[hidden]{display:none}
/* 我的最愛 */
.cw{position:relative;display:flex;flex-direction:column}
.cw>.card{flex:1}
.fav{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;right:10px;top:10px;z-index:2;width:56px;height:56px;border-radius:50%;background:var(--white);border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.fav svg{width:30px;height:30px}
.fav path{fill:#FFFFFF;stroke:var(--ink);stroke-width:2.2;transition:fill .2s}
.fav.on path{fill:var(--red)}
.fav:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fav:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.fav.pop{animation:favpop .45s}
@keyframes favpop{40%{transform:scale(1.35)}}
.sec{margin:6px 0 -8px;display:flex;align-items:center;gap:8px;font-size:clamp(22px,5.5vw,28px);font-weight:900}
.sec svg{width:30px;height:30px}
#favGrid:empty{display:none}
@media (prefers-reduced-motion:reduce){.card,.sign{transition:none;transform:none}}
</style>
</head>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="bar">
    <button class="close" id="close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>關閉</button>
    <span class="title" id="ptitle"></span>
  </div>
</div>

<script>
const player=document.getElementById('player'),ptitle=document.getElementById('ptitle'),closeBtn=document.getElementById('close');
let frame=null,opener=null;
function openGame(card){
  opener=card;ptitle.textContent=card.dataset.name;
  frame=document.createElement('iframe');frame.src=card.dataset.src;frame.title=card.dataset.name;frame.allow='autoplay';
  player.appendChild(frame);player.hidden=false;document.body.classList.add('playing');
  try{history.pushState({game:1},'')}catch(e){}
  closeBtn.focus();
}
function closeGame(fromHistory){
  if(player.hidden)return;
  // 移除遊戲畫面,音樂和音效也會一起停掉
  if(frame){frame.remove();frame=null}
  player.hidden=true;document.body.classList.remove('playing');
  if(!fromHistory){try{if(history.state&&history.state.game)history.back()}catch(e){}}
  opener&&opener.focus();
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openGame(c)));
// 我的最愛:每張卡右上角一顆愛心,點了就移到最上面
(function(){const favG=document.getElementById('favGrid'),allG=document.getElementById('allGrid');let fav=[];
  try{fav=JSON.parse(localStorage.getItem('kidFav')||'[]')}catch(e){}if(!Array.isArray(fav))fav=[];
  const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C4 15 2 11 2 8a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 3-2 7-10 13z"/></svg>';
  const wraps=[...allG.querySelectorAll('.card')].map((c,i)=>{const w=document.createElement('div');w.className='cw';w.dataset.i=i;c.replaceWith(w);w.appendChild(c);
    const b=document.createElement('button');b.type='button';b.className='fav';b.innerHTML=HEART;b.onclick=e=>{e.stopPropagation();toggle(c.dataset.src,b)};w.appendChild(b);return w});
  function save(){try{localStorage.setItem('kidFav',JSON.stringify(fav))}catch(e){}}
  function layout(){fav=fav.filter(src=>wraps.some(w=>w.firstChild.dataset.src===src));
    wraps.forEach(w=>{const src=w.firstChild.dataset.src,on=fav.includes(src),b=w.querySelector('.fav');b.classList.toggle('on',on);b.setAttribute('aria-label',(on?'取消我的最愛:':'加入我的最愛:')+w.firstChild.dataset.name)});
    fav.forEach(src=>{const w=wraps.find(x=>x.firstChild.dataset.src===src);favG.appendChild(w)});
    wraps.filter(w=>!fav.includes(w.firstChild.dataset.src)).sort((a,b)=>a.dataset.i-b.dataset.i).forEach(w=>allG.appendChild(w));
    document.getElementById('favH').hidden=!fav.length;document.getElementById('allH').hidden=!fav.length}
  function toggle(src,b){const i=fav.indexOf(src);if(i<0)fav.push(src);else fav.splice(i,1);save();layout();b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(i<0)b.closest('.cw').scrollIntoView({behavior:'smooth',block:'nearest'})}
  layout()})();
closeBtn.addEventListener('click',()=>closeGame(false));
addEventListener('keydown',e=>{if(e.key==='Escape')closeGame(false)});
addEventListener('popstate',()=>closeGame(true));
// 離線:註冊快取,全部遊戲都存好後顯示提示
const offEl=document.getElementById('offline');
const GAMES=[...document.querySelectorAll('.card')].map(c=>c.dataset.src);
async function checkOffline(){try{if(!('caches' in window))return;const keys=await caches.keys();const k=keys.find(x=>x.startsWith('kids-v'));if(!k)return;const c=await caches.open(k);
  const ok=(await Promise.all(GAMES.map(g=>c.match(g)))).every(Boolean);if(ok){offEl.textContent='✓ 已存到這台裝置,沒有網路也可以玩 · 10/18k 版';offEl.hidden=false}}catch(e){}}
if('serviceWorker' in navigator){let hadCtl=!!navigator.serviceWorker.controller,reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update()}catch(e){}return navigator.serviceWorker.ready}).then(()=>setTimeout(checkOffline,500)).catch(()=>{})});checkOffline()}
</script>
