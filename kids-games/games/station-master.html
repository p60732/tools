<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>小小站長</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: one screen — header (stage chips, stars, music) / fixed-ratio scene (platform or train car) / one huge action button. Deliberately single bright theme. */
:root{
  --ink:#4A4552; --sky:#C9E1EA; --wall:#F6F0E4; --wall-tile:#F5E2B4;
  --track:#5B4A40; --rail:#AEB6C0; --plat:#DCE1E8; --plat-dark:#C3CAD4;
  --yellow:#E9C46A; --red:#D8796E; --blue:#6E91C7; --green:#7FB08A; --orange:#E3A06B; --white:#FFFFFF;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px;box-sizing:border-box;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.steps{display:flex;gap:4px;margin-left:auto}
.step{font-weight:900;font-size:clamp(12px,3.2vw,16px);padding:3px 9px;border:3px solid var(--ink);border-radius:999px;background:var(--white);opacity:.45;white-space:nowrap}
.step.on{opacity:1;background:var(--yellow)}
.count{display:flex;align-items:center;gap:4px;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:clamp(16px,4vw,22px);font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}
.count svg{width:1.1em;height:1.1em}
.music{flex:none;width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:5px;cursor:pointer}
.music svg{width:100%;height:100%}.music .x{display:none}.music.off{background:var(--white)}.music.off .x{display:inline}
.music:focus-visible,.action:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
@media (max-width:480px){.steps{display:none}.tools{margin-left:auto}}
.tools{display:flex;gap:8px;align-items:center}

.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:calc(var(--u)*400);height:calc(var(--u)*500);border:5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:var(--wall);cursor:pointer}
.scene{position:absolute;inset:0}
.abs{position:absolute}

/* platform */
.wall{left:0;top:0;width:100%;height:calc(var(--u)*110);background:repeating-linear-gradient(90deg,var(--wall) 0 calc(var(--u)*38),var(--wall-tile) calc(var(--u)*38) calc(var(--u)*40))}
.sign{left:calc(var(--u)*24);top:calc(var(--u)*14);padding:calc(var(--u)*5) calc(var(--u)*14);background:var(--blue);color:var(--white);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*8);font-weight:900;font-size:calc(var(--u)*22);letter-spacing:.1em}
.clock{right:calc(var(--u)*24);top:calc(var(--u)*10);width:calc(var(--u)*54);height:calc(var(--u)*54)}
.track{left:0;top:calc(var(--u)*110);width:100%;height:calc(var(--u)*92);background:var(--track)}
.rail{left:0;width:100%;height:calc(var(--u)*6);background:var(--rail);border-block:calc(var(--u)*2) solid var(--ink)}
.sleepers{left:0;top:calc(var(--u)*176);width:100%;height:calc(var(--u)*26);background:repeating-linear-gradient(90deg,transparent 0 calc(var(--u)*16),#3B2F29 calc(var(--u)*16) calc(var(--u)*28))}
.edge{left:0;top:calc(var(--u)*202);width:100%;height:calc(var(--u)*10);background:var(--white);border-block:calc(var(--u)*2) solid var(--ink)}
.danger{left:0;top:calc(var(--u)*212);width:100%;height:calc(var(--u)*28);background:var(--plat);transition:background .3s}
.danger.alert{background:#F1D1CD;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{background:#E8B5AE}}
.yline{left:0;top:calc(var(--u)*240);width:100%;height:calc(var(--u)*16);background:radial-gradient(circle,#C9A75A 22%,transparent 26%) 0 0/calc(var(--u)*10) calc(var(--u)*8),var(--yellow);border-block:calc(var(--u)*2) solid var(--ink)}
.floor{left:0;top:calc(var(--u)*256);width:100%;height:calc(var(--u)*244);background:repeating-linear-gradient(90deg,var(--plat) 0 calc(var(--u)*48),var(--plat-dark) calc(var(--u)*48) calc(var(--u)*50))}
.train{top:calc(var(--u)*98);width:calc(var(--u)*520);height:calc(var(--u)*108);z-index:5;left:calc(var(--u)*-600)}
.train svg{width:100%;height:100%;display:block}
.leaf{transition:transform .5s ease}
.train.open .leafL{transform:translateX(-22px)}
.train.open .leafR{transform:translateX(22px)}

/* people */
.p{position:absolute;width:calc(var(--u)*48);height:calc(var(--u)*66);transition-property:left,top,opacity,transform;transition-timing-function:linear}
.p svg{width:100%;height:100%;display:block;overflow:visible}
.p.walk svg{animation:bob .28s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%) rotate(3deg)}}
.p.in{opacity:0;transform:scale(.5)}
.p .alarm{position:absolute;left:50%;top:-38%;transform:translateX(-50%);width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;background:var(--red);color:var(--white);border:calc(var(--u)*3) solid var(--ink);font-weight:900;font-size:calc(var(--u)*18);display:grid;place-items:center;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.25)}}
.say{position:absolute;left:50%;bottom:105%;transform:translateX(-50%);background:var(--white);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*10);padding:calc(var(--u)*2) calc(var(--u)*7);font-weight:900;font-size:calc(var(--u)*14);white-space:nowrap}

/* train car */
.car{background:#EEF2F7}
.cwall{left:0;top:0;width:100%;height:calc(var(--u)*150);background:#DEE6F2;border-bottom:calc(var(--u)*4) solid var(--ink)}
.win{top:calc(var(--u)*30);width:calc(var(--u)*86);height:calc(var(--u)*76);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*12);
  background:radial-gradient(ellipse 60% 40% at 30% 100%,#8EBE96 98%,transparent) 0 0/calc(var(--u)*120) 100% repeat-x,radial-gradient(ellipse 50% 30% at 70% 100%,#7AAD83 98%,transparent) 0 0/calc(var(--u)*90) 100% repeat-x,linear-gradient(var(--sky),#DCEBF1);
  animation:scroll 2.4s linear infinite}
@keyframes scroll{to{background-position:calc(var(--u)*-120) 0,calc(var(--u)*-90) 0,0 0}}
.rail2{left:calc(var(--u)*10);top:calc(var(--u)*120);width:calc(var(--u)*380);height:calc(var(--u)*6);background:var(--rail);border:calc(var(--u)*2) solid var(--ink);border-radius:9px}
.bench{left:calc(var(--u)*14);width:calc(var(--u)*372);height:calc(var(--u)*44);background:var(--red);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*12)}
.aisle{left:0;top:calc(var(--u)*250);width:100%;height:calc(var(--u)*130);background:repeating-linear-gradient(90deg,#C9CED6 0 calc(var(--u)*30),#BCC2CC calc(var(--u)*30) calc(var(--u)*32))}
.ticket{position:absolute;width:calc(var(--u)*92);height:calc(var(--u)*56);z-index:900;animation:tpop .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes tpop{from{transform:scale(.2) translateY(30%)}}
.ticket.fly{transition:transform .5s,opacity .5s;transform:translateY(-60%) scale(.6);opacity:0}
.badge{position:absolute;right:-8%;top:-8%;width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;background:var(--green);border:calc(var(--u)*3) solid var(--ink);color:var(--white);font-weight:900;font-size:calc(var(--u)*14);display:grid;place-items:center}
.target{position:absolute;width:calc(var(--u)*64);height:calc(var(--u)*20);border-radius:50%;border:calc(var(--u)*4) dashed var(--orange);animation:spin 1.6s linear infinite;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.zzz{position:absolute;right:-30%;top:-40%;font-weight:900;font-size:calc(var(--u)*18);color:var(--blue);-webkit-text-stroke:1px var(--ink);animation:float 1.2s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-30%)}}

/* overlays */
.banner{flex:none;display:flex;align-items:center;justify-content:center;min-height:2.7em;box-sizing:border-box;text-align:center;background:var(--white);border:4px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:900;font-size:clamp(16px,4.2vw,22px);line-height:1.3;box-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.bar{position:absolute;left:4%;right:4%;bottom:calc(var(--u)*12);height:calc(var(--u)*22);border:calc(var(--u)*3) solid var(--ink);border-radius:999px;background:var(--white);z-index:940;overflow:hidden}
.bar i{position:absolute;inset:0;width:0;background:var(--green);transition:width .25s linear}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*13)}
.done{position:absolute;inset:0;z-index:999;background:rgba(255,243,214,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14);text-align:center;padding:0 16px;cursor:default}
.done h2{margin:0;font-size:calc(var(--u)*42);font-weight:900;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.done p{margin:0;font-size:calc(var(--u)*20);font-weight:700}
.burst{position:fixed;pointer-events:none;width:26px;height:26px;z-index:2000;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}

.action{flex:none;align-self:center;display:flex;align-items:center;justify-content:center;gap:12px;min-width:min(100%,340px);
  font:inherit;font-weight:900;font-size:clamp(26px,7vw,38px);padding:10px 30px;border:5px solid var(--ink);border-radius:999px;color:var(--ink);background:var(--yellow);box-shadow:6px 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .3s}
.action svg{width:1.4em;height:1.4em;flex:none}
.action:active,.action.press{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.action.go{background:var(--green);color:var(--white)}
.action.tk{background:var(--orange);color:var(--white)}
.action.wait{background:var(--white);color:#6B6B78}
.action .lbl{-webkit-text-stroke:0}
.action.go .lbl,.action.tk .lbl{text-shadow:2px 2px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== 平板:字和按鈕放大;橫放時遊戲畫面在左、提示和按鈕在右 ===== */
@media (min-width:700px) and (min-height:600px){
  h1{font-size:36px}
  .count{font-size:26px;padding:4px 14px}
  .music{width:56px;height:56px}
  .banner{font-size:26px;border-radius:18px;padding:8px 16px}
  .tab{font-size:28px;padding:8px 30px}
  .action{font-size:42px}
  .controls .big{font-size:34px}
  .controls .big.arrow{font-size:48px}
  .hintline{font-size:26px}
  .lv,.step{font-size:20px}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .app{max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,34%);grid-template-rows:auto 1fr auto auto auto 1fr;column-gap:24px;row-gap:18px}
  .app>header{grid-column:1/-1;grid-row:1}
  .app>.main{grid-column:1;grid-row:2/-1}
  .app>.banner{grid-column:2;grid-row:3;min-height:5.5em}
  .app>.tabs{grid-column:2;grid-row:4}
  .app>.tabs .tab{flex:1;min-width:0}
  .app>.controls,.app>.action{grid-column:2;grid-row:5}
  .app>.controls{flex-direction:column;align-items:stretch;min-height:0}
  .app>.controls:has(.arrow){flex-direction:row;justify-content:center}
  .app>.controls .big{max-width:none;flex:none;padding-block:14px}
  .app>.controls .big.arrow{flex:1}
  .app>.action{width:100%;min-width:0;padding-block:18px}
}

/* ===== 底部多留空間,避開手機底部的手勢列 ===== */
.app{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))!important}
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>小小站長</h1>
    <div class="steps"><span class="step" id="s1">① 黃線</span><span class="step" id="s2">② 上車</span><span class="step" id="s3">③ 驗票</span></div>
    <div class="tools">
      <div class="count" aria-live="polite"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#E9C46A" stroke="#4A4552" stroke-width="2" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
      <button class="music" id="music" type="button" aria-label="背景音樂"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#4A4552" stroke-width="2.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#D8796E" stroke="#4A4552" stroke-width="2"/><circle cx="17.5" cy="16" r="3" fill="#6E91C7" stroke="#4A4552" stroke-width="2"/><path class="x" d="M3 3L21 21" stroke="#4A4552" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div class="banner" id="banner" aria-live="polite"></div>
  <div class="main" id="main"><div class="stage" id="stage"></div></div>
  <button class="action" id="action" type="button"><span id="aIcon"></span><span class="lbl" id="aLbl">吹哨子</span></button>
</div>

<script>
/* ================= 音效(即時合成) ================= */
let ctx=null,musicGain=null,sfx=null,musicOn=true,bgm=null,nextT=0,stepN=0;
try{musicOn=localStorage.getItem('stationMusic')!=='off'}catch(e){}
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();musicGain=ctx.createGain();musicGain.gain.value=.065;musicGain.connect(ctx.destination);sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
const hz=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,v,d,a=.012){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function note(f,t,d,{type='sine',v=.25,to=null,bus=null,vib=0}={}){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=vib;lg.gain.value=f*.06;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d)}
  env(g,t,v,d);o.connect(g).connect(bus||sfx);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(t,d,{v=.3,f=1000,q=1,type='bandpass',bus=null}={}){try{const c=ac(),b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;env(g,t,v,d,.005);s.connect(fl).connect(g).connect(bus||sfx);s.start(t)}catch(e){}}
const T=()=>ac().currentTime;
const S={
  whistle(){const t=T();[0,.32].forEach(o=>{note(2500,t+o,.26,{v:.18,vib:28});noise(t+o,.26,{v:.08,f:2600,q:4})})},
  bell(){const t=T();for(let i=0;i<4;i++){note(1760,t+i*.16,.3,{type:'triangle',v:.2});note(2640,t+i*.16,.15,{v:.05})}},
  horn(){const t=T();try{const c=ac(),fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.frequency.value=1400;env(g,t,.18,1,.05);fl.connect(g).connect(sfx);
    [233,294,349].forEach(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(fl);o.start(t);o.stop(t+1.05)})}catch(e){}},
  rumble(d=2.5){const t=T();noise(t,d,{v:.22,f:180,type:'lowpass'});for(let i=0;i<d/.3;i++)noise(t+i*.3,.08,{v:.12,f:900,q:2})},
  chime(){const t=T();note(659,t,.7,{v:.3});note(523,t+.45,.9,{v:.3})},
  stamp(){const t=T();noise(t,.07,{v:.6,f:3200,q:1.5});note(200,t,.1,{v:.3,to:90})},
  yawn(){const t=T();note(520,t,.7,{type:'triangle',to:210,v:.16})},
  hop(){const t=T();note(420,t,.14,{to:950,v:.16})},
  yay(){const t=T();[84,88,91].forEach((m,i)=>note(hz(m),t+i*.08,.35,{type:'triangle',v:.2}))},
  win(){const t=T();[72,76,79,84,79,84].forEach((m,i)=>note(hz(m),t+i*.13,.3,{type:'square',v:.07}));[72,76,79,84].forEach(m=>note(hz(m),t+.8,1.2,{type:'triangle',v:.12}))}
};
// 背景音樂:原創輕快小調,144 BPM,4 小節循環
const MEL=[72,74,76,0,79,0,76,0, 77,76,74,0,72,0,0,0, 74,76,77,0,81,0,79,77, 76,74,72,74,72,0,0,0];
const BASS=[48,55,52,55, 53,48,50,55, 50,57,55,50, 48,55,48,0];
const EI=60/144/2;
function sched(){while(nextT<ctx.currentTime+.15){const i=stepN%32,m=MEL[i];
  if(m){note(hz(m),nextT,.3,{type:'triangle',v:.5,bus:musicGain});note(hz(m+12),nextT,.16,{v:.1,bus:musicGain})}
  if(i%2===0&&BASS[i/2])note(hz(BASS[i/2]),nextT,.26,{v:.45,bus:musicGain});
  if(i%4===2)noise(nextT,.05,{v:.05,f:4000,q:1,bus:musicGain});
  nextT+=EI;stepN++}}
function startMusic(){if(bgm||!musicOn)return;ac();nextT=ctx.currentTime+.1;stepN=0;musicGain.gain.setValueAtTime(.065,ctx.currentTime);bgm=setInterval(sched,25)}
function stopMusic(){clearInterval(bgm);bgm=null;if(musicGain)musicGain.gain.setTargetAtTime(.0001,ctx.currentTime,.05)}
const musicBtn=document.getElementById('music');
function paintMusic(){musicBtn.classList.toggle('off',!musicOn);musicBtn.setAttribute('aria-pressed',musicOn)}
musicBtn.addEventListener('click',e=>{e.stopPropagation();musicOn=!musicOn;try{localStorage.setItem('stationMusic',musicOn?'on':'off')}catch(err){}paintMusic();musicOn?startMusic():stopMusic()});
paintMusic();
addEventListener('pointerdown',()=>{ac();startMusic()});

/* ================= 畫面工具 ================= */
const stage=document.getElementById('stage'),main=document.getElementById('main');
const U=v=>`calc(var(--u)*${v})`;
function fit(){const w=main.clientWidth,h=main.clientHeight;const u=Math.max(.5,Math.min(w/410,h/510));document.documentElement.style.setProperty('--u',u+'px')}
addEventListener('resize',fit);fit();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(cls,css={},html=''){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css);d.innerHTML=html;return d}
const INK='#4A4552';
const SHIRTS=['#D8796E','#6E91C7','#7FB08A','#A08CC8','#E3A06B','#6FB3B8','#E2A0B8','#E9C46A'];
const HAIR=['#4A4552','#6B3E1F','#D9D9D9','#C46A1B'];
function personSVG(i,sleep=false){const shirt=SHIRTS[i%SHIRTS.length],hair=HAIR[(i*3)%HAIR.length],kind=i%4;
  const eyes=sleep?`<path d="M16 22q3 3 6 0M26 22q3 3 6 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`:`<circle cx="19" cy="22" r="2.6" fill="${INK}"/><circle cx="29" cy="22" r="2.6" fill="${INK}"/>`;
  const mouth=sleep?`<circle cx="24" cy="30" r="2" fill="${INK}"/>`:`<path d="M19 29q5 5 10 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const top=kind===0?`<path d="M9 18q0-14 15-14t15 14z" fill="${shirt}" stroke="${INK}" stroke-width="3"/><path d="M34 15h10" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`
    :kind===1?`<circle cx="24" cy="5" r="6" fill="${hair}" stroke="${INK}" stroke-width="3"/><path d="M10 20q0-14 14-14t14 14q-6-5-14-5t-14 5z" fill="${hair}" stroke="${INK}" stroke-width="3"/>`
    :kind===2?`<path d="M10 22q-2-16 14-17t14 17q-4-8-14-9t-14 9z" fill="${hair}" stroke="${INK}" stroke-width="3"/><circle cx="8" cy="22" r="5" fill="${hair}" stroke="${INK}" stroke-width="3"/><circle cx="40" cy="22" r="5" fill="${hair}" stroke="${INK}" stroke-width="3"/>`
    :`<path d="M10 18q2-13 14-13t14 13q-8-4-14-4t-14 4z" fill="${hair}" stroke="${INK}" stroke-width="3"/>`;
  const bag=kind===3?`<rect x="36" y="38" width="10" height="16" rx="3" fill="#E9C46A" stroke="${INK}" stroke-width="3"/>`:'';
  return `<svg viewBox="0 0 48 66"><ellipse cx="24" cy="64" rx="15" ry="3" fill="rgba(0,0,0,.18)"/>${bag}<path d="M8 64v-16q0-12 16-12t16 12v16z" fill="${shirt}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="22" r="14" fill="#FFD8B0" stroke="${INK}" stroke-width="3"/>${top}${eyes}${mouth}<circle cx="15" cy="28" r="2.5" fill="#EDB9BF"/><circle cx="33" cy="28" r="2.5" fill="#EDB9BF"/></svg>`}
const ICONS={
  whistle:`<svg viewBox="0 0 48 48"><path d="M6 20a12 12 0 1 0 24 6h12v-12H18" fill="#C9CED6" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><circle cx="18" cy="26" r="4" fill="${INK}"/><path d="M40 6l-4 6M46 12l-6 3" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></svg>`,
  board:`<svg viewBox="0 0 48 48"><rect x="8" y="6" width="32" height="38" rx="5" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M24 6v38" stroke="${INK}" stroke-width="4"/><path d="M14 26h6m0 0l-3-3m3 3l-3 3M34 26h-6m0 0l3-3m-3 3l3 3" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></svg>`,
  go:`<svg viewBox="0 0 48 48"><path d="M10 8l30 16-30 16z" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></svg>`,
  punch:`<svg viewBox="0 0 48 48"><rect x="4" y="12" width="40" height="24" rx="5" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="34" cy="24" r="5" fill="${INK}"/><path d="M10 20h14M10 28h10" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></svg>`,
  hourglass:`<svg viewBox="0 0 48 48"><path d="M12 6h24M12 42h24M14 6q0 14 10 18q10-4 10-18M14 42q0-14 10-18q10 4 10 18" fill="none" stroke="#6B6B78" stroke-width="4" stroke-linecap="round"/></svg>`
};
const clockSVG=`<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M27 27V12M27 27l10 6" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="27" r="3" fill="${INK}"/></svg>`;
function trainSVG(){const doors=[110,260,410].map(c=>`<g><rect x="${c-23}" y="20" width="46" height="74" fill="#3A3F4A"/><g class="leaf leafL"><rect x="${c-23}" y="20" width="23" height="74" fill="#E3EAF8" stroke="${INK}" stroke-width="3"/><rect x="${c-18}" y="28" width="13" height="22" rx="3" fill="#D7E7EF" stroke="${INK}" stroke-width="2"/></g><g class="leaf leafR"><rect x="${c}" y="20" width="23" height="74" fill="#E3EAF8" stroke="${INK}" stroke-width="3"/><rect x="${c+5}" y="28" width="13" height="22" rx="3" fill="#D7E7EF" stroke="${INK}" stroke-width="2"/></g></g>`).join('');
  const wins=[[16,62],[150,86],[300,86],[450,40]].map(([x,w])=>`<rect x="${x}" y="26" width="${w}" height="28" rx="6" fill="#D7E7EF" stroke="${INK}" stroke-width="3"/>`).join('');
  const wheels=[40,80,180,220,320,360,460,490].map(x=>`<circle cx="${x}" cy="98" r="8" fill="#3A3F4A" stroke="${INK}" stroke-width="3"/>`).join('');
  return `<svg viewBox="0 0 520 108">${wheels}<path d="M4 18q0-12 12-12h470q30 0 30 40v48H4z" fill="#6E91C7" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="4" y="66" width="512" height="10" fill="#E9C46A"/>${wins}${doors}<circle cx="506" cy="70" r="6" fill="#F3EAC6" stroke="${INK}" stroke-width="3"/></svg>`}
function ticketSVG(from,to){return `<svg viewBox="0 0 92 56"><path d="M4 4h84v18a6 6 0 0 0 0 12v18H4V34a6 6 0 0 0 0-12z" fill="#F1DCA2" stroke="${INK}" stroke-width="3"/><text x="46" y="22" text-anchor="middle" font-size="12" font-weight="900" fill="${INK}" font-family="Noto Sans TC,sans-serif">${from}</text><text x="46" y="38" text-anchor="middle" font-size="12" font-weight="900" fill="${INK}" font-family="Noto Sans TC,sans-serif">▼ ${to}</text><circle class="hole" cx="78" cy="12" r="0" fill="${INK}"/></svg>`}

/* 人物物件 */
function makePerson(i,x,y,sleep=false){const d=el('p');d.innerHTML=personSVG(i,sleep);const P={el:d,i,x,y,state:'safe'};place(P,x,y,0);return P}
function place(P,x,y,dur){P.x=x;P.y=y;const d=P.el;d.style.transitionDuration=dur+'ms';d.style.left=U(x-24);d.style.top=U(y-66);d.style.zIndex=10+Math.round(y)}
async function walk(P,x,y,speed=.16){const dist=Math.hypot(x-P.x,y-P.y);const ms=Math.max(150,dist/speed);P.el.classList.add('walk');place(P,x,y,ms);await wait(ms);P.el.classList.remove('walk')}
function say(P,txt,ms=1400){const s=el('say',{},txt);P.el.appendChild(s);setTimeout(()=>s.remove(),ms)}

/* ================= 遊戲狀態 ================= */
const STATIONS=['小星星站','彩虹站','森林站','海邊站','雲朵站'];
let round=0,stars=0,mode='idle',people=[],busy=false,timers=[];
const starsEl=document.getElementById('stars'),btn=document.getElementById('action'),aIcon=document.getElementById('aIcon'),aLbl=document.getElementById('aLbl');
function addStar(n=1,P){stars+=n;starsEl.textContent=stars;if(P){const r=P.el.getBoundingClientRect();burst(r.left+r.width/2,r.top)}}
function burst(x,y){for(let i=0;i<6;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.classList.add('burst');
  s.innerHTML='<path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#E9C46A" stroke="#4A4552" stroke-width="2"/>';
  const a=Math.PI*2*i/6;s.style.left=x-13+'px';s.style.top=y-13+'px';s.style.setProperty('--dx',Math.cos(a)*70+'px');s.style.setProperty('--dy',Math.sin(a)*70-30+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function setButton(kind,label,icon){btn.className='action '+kind;aLbl.textContent=label;aIcon.innerHTML=ICONS[icon];btn.disabled=false}
function setSteps(n){[1,2,3].forEach(k=>document.getElementById('s'+k).classList.toggle('on',k===n))}
const bannerEl=document.getElementById('banner');let barFill,barText;
function banner(t){bannerEl.textContent=t}
function clearTimers(){timers.forEach(clearInterval);timers=[]}

/* 共用:按大按鈕或點畫面 */
function act(){if(busy)return;btn.classList.add('press');setTimeout(()=>btn.classList.remove('press'),120);
  if(mode==='line')doWhistle();else if(mode==='board')doBoard();else if(mode==='depart')doDepart();else if(mode==='ticket')doTicket()}
btn.addEventListener('click',act);
stage.addEventListener('click',e=>{if(e.target.closest('.done'))return;act()});

/* ================= 第一關:退到黃線後面 ================= */
let train,danger,arriveT,arriveDur;
const SPOTS=[[60,320],[150,305],[250,322],[345,308],[100,400],[205,420],[305,398],[45,465],[160,480],[265,470],[360,455]];
function buildPlatform(){stage.innerHTML='';const sc=el('scene');stage.appendChild(sc);
  sc.append(el('abs wall'),el('abs sign',{},STATIONS[round%STATIONS.length]),el('abs clock',{},clockSVG),el('abs track'),
    el('abs rail',{top:U(178)}),el('abs sleepers'),el('abs rail',{top:U(192)}),el('abs edge'));
  danger=el('abs danger');sc.append(danger,el('abs yline'),el('abs floor'));
  train=el('abs train',{},trainSVG());sc.appendChild(train);
  const bar=el('bar');barFill=document.createElement('i');barText=document.createElement('span');bar.append(barFill,barText);stage.appendChild(bar);
  return sc}
function startLine(){mode='line';busy=false;setSteps(1);clearTimers();
  const sc=buildPlatform();const n=Math.min(5+round,8);
  people=shuffle(SPOTS.slice()).slice(0,n).map(([x,y],k)=>{const P=makePerson(k+round*3,x,y);P.home=[x,y];sc.appendChild(P.el);return P});
  banner('火車快進站了!有人跑到黃線外面,就按「吹哨子」');setButton('','吹哨子','whistle');
  barText.textContent='火車進站中…';arriveDur=16000+round*2000;arriveT=0;
  let nextOut=1500;
  timers.push(setInterval(()=>{arriveT+=250;barFill.style.width=Math.min(100,arriveT/arriveDur*100)+'%';
    const out=people.filter(p=>p.state==='out'||p.state==='going');
    if(arriveT<arriveDur){nextOut-=250;if(nextOut<=0&&out.length<3){const c=people.filter(p=>p.state==='safe');if(c.length){goOut(c[Math.random()*c.length|0])}nextOut=1400+Math.random()*1600-round*150}}
    else{if(out.length)banner('還有人在黃線外面,火車停下來等,快吹哨子!');else trainArrives()}
    danger.classList.toggle('alert',out.length>0)},250))}
async function goOut(P){P.state='going';const tx=Math.max(30,Math.min(370,P.x+(Math.random()*60-30)));await walk(P,tx,234,.12);
  if(P.state!=='going')return;P.state='out';const a=el('alarm',{},'!');P.alarm=a;P.el.appendChild(a)}
async function doWhistle(){S.whistle();const out=people.filter(p=>p.state==='out'||p.state==='going');
  if(!out.length){banner('大家都站在黃線後面,好乖!');return}
  banner('嗶嗶!請退到黃線後面喔!');
  out.forEach(P=>{P.state='back';P.alarm&&P.alarm.remove();P.alarm=null;say(P,'好~',1000);addStar(1,P);
    walk(P,P.home[0],P.home[1],.25).then(()=>{if(P.state==='back')P.state='safe'})});
  S.yay()}
async function trainArrives(){if(mode!=='line')return;mode='arrive';clearTimers();danger.classList.remove('alert');busy=true;
  setButton('wait','火車進站','hourglass');banner('火車進站了!');barText.textContent='到站!';barFill.style.width='100%';
  S.horn();S.rumble(2.6);train.style.transition='left 2.6s cubic-bezier(.2,.7,.3,1)';train.style.left=U(-20);
  await wait(2700);train.classList.add('open');S.chime();await wait(600);busy=false;startBoard()}

/* ================= 第二關:快上車 ================= */
const DOORS=[90,240,390];
let lateLeft,boardT,boardDur;
function startBoard(){mode='board';setSteps(2);people.forEach(p=>p.state='wait');
  lateLeft=1+(round>0?1:0);boardT=0;boardDur=14000;
  banner('快要開車了!按「請上車」叫旅客上車');setButton('go','請上車','board');barText.textContent='開車倒數';barFill.style.width='0%';barFill.style.background='var(--orange)';
  S.bell();
  timers.push(setInterval(()=>{boardT+=250;barFill.style.width=Math.min(100,boardT/boardDur*100)+'%';
    if(boardT===Math.round(boardDur*.6/250)*250)S.bell()},250))}
function spawnLate(delay=0){const sc=stage.querySelector('.scene');const k=people.length;const P=makePerson(k+7,440,340+Math.random()*100);P.state='coming';sc.appendChild(P.el);people.push(P);
  setTimeout(()=>{if(P.state!=='coming')return;say(P,'等等我!',1800);walk(P,280+Math.random()*60,P.y,.22).then(()=>{if(P.state==='coming')P.state='wait'})},delay+30);return P}
async function doBoard(){S.bell();const w=people.filter(p=>p.state==='wait'||p.state==='coming');
  if(!w.length){banner('月台上沒有人了');return}
  banner('嗶嗶!請趕快上車!');
  w.forEach((P,j)=>{P.state='boarding';const door=DOORS.reduce((a,b)=>Math.abs(b-P.x)<Math.abs(a-P.x)?b:a);
    setTimeout(async()=>{await walk(P,door,222,.3);S.hop();P.el.classList.add('in');addStar(1,P);await wait(300);P.state='in';P.el.remove();checkBoarded()},j*120)})}
function checkBoarded(){if(mode!=='board')return;if(people.some(p=>p.state!=='in'))return;
  if(lateLeft>0){const n=lateLeft;lateLeft=0;for(let k=0;k<n;k++)spawnLate(k*800);banner('咦?又有人跑來了!再按「請上車」');return}
  mode='depart';clearTimers();banner('大家都上車了!按「關門出發」');setButton('go','關門出發','go');barFill.style.width='100%'}
async function doDepart(){busy=true;mode='leaving';S.chime();train.classList.remove('open');setButton('wait','出發囉','hourglass');banner('車門關閉,列車出發!');
  await wait(900);S.horn();S.rumble(2.4);train.style.transition='left 2.4s cubic-bezier(.6,0,.9,.6)';train.style.left=U(460);
  await wait(2500);busy=false;startTicket(people.length)}

/* ================= 第三關:車廂驗票 ================= */
const SEATS=[[80,212],[200,212],[320,212],[80,428],[200,428],[320,428]];
let seated=[],master,ticketIdx;
function masterSVG(){return `<svg viewBox="0 0 48 66"><ellipse cx="24" cy="64" rx="15" ry="3" fill="rgba(0,0,0,.18)"/><path d="M8 64v-16q0-12 16-12t16 12v16z" fill="#4F5B7E" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M24 37v27" stroke="#E9C46A" stroke-width="2.5" stroke-dasharray="3 5"/><path d="M18 37l6 7 6-7" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="24" cy="23" r="13" fill="#FFD8B0" stroke="${INK}" stroke-width="3"/><path d="M7 15q0-12 17-12t17 12z" fill="#4F5B7E" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="7" y="12" width="34" height="5" fill="#D8796E" stroke="${INK}" stroke-width="2"/><circle cx="24" cy="8" r="3" fill="#E9C46A" stroke="${INK}" stroke-width="1.5"/><path d="M5 17h38" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="24" r="2.4" fill="${INK}"/><circle cx="29" cy="24" r="2.4" fill="${INK}"/><path d="M19 30q5 4 10 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="14" cy="29" r="2.4" fill="#EDB9BF"/><circle cx="34" cy="29" r="2.4" fill="#EDB9BF"/></svg>`}
// 站長走到旅客面前(上排旅客站在他下面的走道,下排站在上面的走道)
async function goTo(P){const ty=P.y<300?292:368;if(Math.abs(master.x-P.x)<2&&master.y===ty)return;
  const steps=setInterval(()=>note(900,T(),.05,{type:'triangle',v:.08}),180);
  await walk(master,P.x,ty,.24);clearInterval(steps)}
function startTicket(n){mode='ticket';setSteps(3);clearTimers();stage.innerHTML='';const sc=el('scene car');stage.appendChild(sc);
  sc.append(el('abs cwall'));[18,114,210,306].forEach((x,k)=>sc.appendChild(el('abs win',{left:U(x),animationDelay:(-k*.3)+'s'})));
  sc.append(el('abs rail2'),el('abs bench',{top:U(188)}),el('abs aisle'),el('abs bench',{top:U(398)}));
  const count=Math.min(Math.max(n,3),6);const sleepers=new Set(shuffle([...Array(count).keys()]).slice(0,round>0?2:1));
  seated=shuffle(SEATS.slice()).slice(0,count).sort((a,b)=>a[1]-b[1]||a[0]-b[0]).map(([x,y],k)=>{const sl=sleepers.has(k);const P=makePerson(k+round*2,x,y,sl);P.sleep=sl;P.done=false;
    if(sl){P.z=el('zzz',{},'Zz');P.el.appendChild(P.z)}sc.appendChild(P.el);return P});
  // 站長本人:從車門那邊走進來
  master={el:el('p master'),x:400,y:330};master.el.innerHTML=masterSVG();sc.appendChild(master.el);place(master,430,330,0);
  ticketIdx=0;requestAnimationFrame(()=>walk(master,350,330,.2));
  banner('車上驗票囉!按「驗票」檢查車票');setButton('tk','驗票','punch')}
async function doTicket(){const P=seated[ticketIdx];if(!P)return;
  busy=true;await goTo(P);
  if(P.sleep){P.sleep=false;P.z.remove();say(master,'先生您好~',1000);await wait(500);S.yawn();P.el.innerHTML=personSVG(P.i,false);say(P,'啊~我醒了',1300);banner('旅客睡著了,站長叫醒他!再按一次驗票');busy=false;return}
  say(master,'請給我車票',900);await wait(450);
  const from=STATIONS[round%STATIONS.length],to=STATIONS[(round+1)%STATIONS.length];
  const t=el('ticket',{left:U(Math.min(300,Math.max(4,P.x-46))),top:U(master.y-62)},ticketSVG(from,to));stage.querySelector('.scene').appendChild(t);
  await wait(350);S.stamp();t.querySelector('.hole').setAttribute('r','6');await wait(350);
  P.el.appendChild(el('badge',{},'✓'));say(P,'謝謝站長!',1100);addStar(1,P);S.yay();
  t.classList.add('fly');setTimeout(()=>t.remove(),500);
  ticketIdx++;await wait(300);busy=false;
  if(ticketIdx>=seated.length)finish();else banner('好棒!還有 '+(seated.length-ticketIdx)+' 位旅客')}
async function finish(){mode='idle';busy=true;setSteps(0);S.win();
  setButton('wait','到站了','hourglass');banner('驗票完成!');await wait(600);
  const d=el('done',{},`<h2>辛苦了,站長!</h2><p>${STATIONS[(round+1)%STATIONS.length]}到了,你已經拿到 ${stars} 顆星星</p>`);
  const b=document.createElement('button');b.className='action go';b.type='button';b.innerHTML=`<span>${ICONS.go}</span><span class="lbl">開下一班</span>`;
  b.addEventListener('click',e=>{e.stopPropagation();round++;busy=false;startLine()});d.appendChild(b);stage.appendChild(d);busy=false}

startLine();
</script>
