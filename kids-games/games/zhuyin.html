<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ㄅㄆㄇ 注音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: header / instruction strip / mode tabs (配對・寫寫看) / fixed-ratio stage. Single bright theme like the other games. */
:root{
  --ink:#4A4552; --bg:#F1DDB5; --tray:#FAF5EA; --white:#FFFFFF; --paper:#FFFDF5; --guide:#CFC6B0;
  --red:#D8796E; --blue:#6E91C7; --yellow:#E9C46A; --green:#7FB08A; --accent:#D8796E;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --glyph:"Noto Sans TC","PingFang TC",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px;box-sizing:border-box;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.count{display:flex;align-items:center;gap:4px;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:clamp(16px,4vw,22px);font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}
.count svg{width:1.1em;height:1.1em}
.music{flex:none;width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:5px;cursor:pointer}
.music svg{width:100%;height:100%}.music .x{display:none}.music.off{background:var(--white)}.music.off .x{display:inline}
.banner{flex:none;display:flex;align-items:center;justify-content:center;min-height:2.6em;box-sizing:border-box;text-align:center;background:var(--white);border:4px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:900;font-size:clamp(16px,4.2vw,22px);line-height:1.3;box-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.tabs{flex:none;display:flex;gap:10px;justify-content:center}
.tab{font:inherit;font-weight:900;font-size:clamp(18px,4.8vw,24px);padding:6px 22px;border:4px solid var(--ink);border-radius:999px;background:var(--white);box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:7em}
.tab[aria-selected="true"]{background:var(--accent);color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.tab:focus-visible,.music:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:calc(var(--u)*400);height:calc(var(--u)*500);border:5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:var(--tray)}
.board{position:absolute;left:0;top:0;width:100%;height:calc(var(--u)*270);background:linear-gradient(#F8F2E6,#F3E6CC);border-bottom:calc(var(--u)*5) solid var(--ink)}
.trayline{position:absolute;left:4%;right:4%;top:calc(var(--u)*284);text-align:center;font-weight:900;font-size:calc(var(--u)*15);color:#8A7A5A;letter-spacing:.08em}
.slot,.piece{position:absolute;box-sizing:border-box}
/* 配對卡片 */
.card{background:var(--white);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*16);box-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:transform .2s}
.card .face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.card .big{font-family:var(--glyph);font-weight:700;font-size:calc(var(--u)*60);line-height:1;color:var(--blue)}
.card .pic{font-size:calc(var(--u)*44);line-height:1.1}
.card .word{font-weight:900;font-size:calc(var(--u)*18);line-height:1.2}
.card .pocket{width:78%;aspect-ratio:1;max-width:100%;margin-bottom:calc(var(--u)*8);border:calc(var(--u)*3) dashed #A9A090;border-radius:calc(var(--u)*12);background:#F4EFE2;box-sizing:border-box}
.slot.hover{transform:scale(1.07)}
.slot.hover .pocket{background:#F4ECCB;border-color:var(--ink)}
.slot .tag{position:absolute;left:50%;bottom:calc(var(--u)*-30);transform:translateX(-50%);font-weight:900;font-size:calc(var(--u)*15);background:var(--yellow);border:calc(var(--u)*3) solid var(--ink);border-radius:999px;padding:0 calc(var(--u)*8);white-space:nowrap;animation:pop .35s cubic-bezier(.3,1.7,.5,1);z-index:6}
.slot{overflow:visible}
.tile{background:var(--accent);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*14);display:grid;place-items:center;font-family:var(--glyph);font-weight:700;font-size:calc(var(--u)*48);line-height:1;color:var(--white);-webkit-text-stroke:calc(var(--u)*1.5) var(--ink);paint-order:stroke fill}
.piece{z-index:10;cursor:grab;touch-action:none;filter:drop-shadow(calc(var(--u)*3) calc(var(--u)*4) 0 rgba(74,69,82,.3));transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1),transform .2s}
.piece.drag{z-index:50;cursor:grabbing;transition:none;transform:scale(1.12) rotate(0deg)!important}
.piece.placed{z-index:5;cursor:default;filter:none;transform:none!important}
.piece.shake{animation:shake .4s}
@keyframes shake{25%{translate:calc(var(--u)*-8) 0}75%{translate:calc(var(--u)*8) 0}}
@keyframes pop{from{transform:translateX(-50%) scale(.2)}}
/* 寫寫看 */
.paper{position:absolute;left:calc(var(--u)*40);top:calc(var(--u)*40);width:calc(var(--u)*320);height:calc(var(--u)*320);background:var(--paper);border:calc(var(--u)*5) solid var(--ink);border-radius:calc(var(--u)*18);box-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 var(--ink);overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wbar{position:absolute;left:0;right:0;top:calc(var(--u)*372);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*12)}
.nav{width:calc(var(--u)*62);height:calc(var(--u)*62);border:calc(var(--u)*4) solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.nav svg{width:55%;height:55%}
.nav:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cur{min-width:calc(var(--u)*120);text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.cur b{font-family:var(--glyph);font-size:calc(var(--u)*40);line-height:1;color:var(--blue)}
.cur span{font-weight:900;font-size:calc(var(--u)*15)}
.wbtns{position:absolute;left:0;right:0;top:calc(var(--u)*446);display:flex;justify-content:center;gap:calc(var(--u)*10);flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*19);padding:calc(var(--u)*6) calc(var(--u)*16);border:calc(var(--u)*4) solid var(--ink);border-radius:999px;background:var(--white);color:var(--ink);box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.3em;white-space:nowrap}
.btn.go{background:var(--green);color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.meter{position:absolute;left:calc(var(--u)*40);right:calc(var(--u)*40);top:calc(var(--u)*13);height:calc(var(--u)*14);border:calc(var(--u)*3) solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden;z-index:3;pointer-events:none}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);transition:width .2s}
.done{position:absolute;inset:0;z-index:100;background:rgba(255,247,224,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*16);text-align:center;padding:0 16px}
.done h2{margin:0;font-size:calc(var(--u)*44);font-weight:900;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.done p{margin:0;font-size:calc(var(--u)*20);font-weight:700}
.done .btn{font-size:calc(var(--u)*28);padding:calc(var(--u)*10) calc(var(--u)*32)}
.burst{position:fixed;pointer-events:none;width:26px;height:26px;z-index:2000;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 平板:字和按鈕放大;橫放時遊戲畫面在左、提示和按鈕在右 ===== */
@media (min-width:700px) and (min-height:600px){
  h1{font-size:36px}
  .count{font-size:26px;padding:4px 14px}
  .music{width:56px;height:56px}
  .banner{font-size:26px;border-radius:18px;padding:8px 16px}
  .tab{font-size:28px;padding:8px 30px}
  .action{font-size:42px}
  .controls .big{font-size:34px}
  .controls .big.arrow{font-size:48px}
  .hintline{font-size:26px}
  .lv,.step{font-size:20px}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .app{max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,34%);grid-template-rows:auto 1fr auto auto auto 1fr;column-gap:24px;row-gap:18px}
  .app>header{grid-column:1/-1;grid-row:1}
  .app>.main{grid-column:1;grid-row:2/-1}
  .app>.banner{grid-column:2;grid-row:3;min-height:5.5em}
  .app>.tabs{grid-column:2;grid-row:4}
  .app>.tabs .tab{flex:1;min-width:0}
  .app>.controls,.app>.action{grid-column:2;grid-row:5}
  .app>.controls{flex-direction:column;align-items:stretch;min-height:0}
  .app>.controls:has(.arrow){flex-direction:row;justify-content:center}
  .app>.controls .big{max-width:none;flex:none;padding-block:14px}
  .app>.controls .big.arrow{flex:1}
  .app>.action{width:100%;min-width:0;padding-block:18px}
}

/* ===== 底部多留空間,避開手機底部的手勢列 ===== */
.app{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ㄅㄆㄇ 注音</h1>
    <div class="tools">
      <div class="count" aria-live="polite"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#E9C46A" stroke="#4A4552" stroke-width="2" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
      <button class="music" id="music" type="button" aria-label="背景音樂"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#4A4552" stroke-width="2.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#D8796E" stroke="#4A4552" stroke-width="2"/><circle cx="17.5" cy="16" r="3" fill="#6E91C7" stroke="#4A4552" stroke-width="2"/><path class="x" d="M3 3L21 21" stroke="#4A4552" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div class="banner" id="banner" aria-live="polite"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabMatch" role="tab" aria-selected="true" type="button">配對</button>
    <button class="tab" id="tabWrite" role="tab" aria-selected="false" type="button">寫寫看</button>
  </div>
  <div class="main" id="main"><div class="stage" id="stage"></div></div>
</div>
<script>
/* ================= 聲音 ================= */
let ctx=null,musicGain=null,sfx=null,musicOn=true,bgm=null,nextT=0,stepN=0;
const KEY='zhuyinMusic';
try{musicOn=localStorage.getItem(KEY)!=='off'}catch(e){}
function ac(){if(!ctx){ctx=((()=>{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}})(),new (window.AudioContext||window.webkitAudioContext)());musicGain=ctx.createGain();musicGain.gain.value=.058;musicGain.connect(ctx.destination);sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(f,t,d,{type='sine',v=.25,to=null,bus=null}={}){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus||sfx);o.start(t);o.stop(t+d+.03)}catch(e){}}
const T=()=>ac().currentTime;
const S={
  pick(){note(420,T(),.14,{to:900,v:.18})},
  snap(k=0){const t=T();note(1100,t,.08,{to:350,v:.28});[84,88,91].forEach((m,i)=>note(hz(m+k),t+.07+i*.08,.35,{type:'triangle',v:.2}))},
  nope(){const t=T();note(330,t,.18,{type:'triangle',to:180,v:.22});note(260,t+.16,.25,{type:'triangle',to:140,v:.18})},
  back(){note(500,T(),.12,{to:300,v:.1})},
  scratch(){note(1800+Math.random()*600,T(),.03,{type:'triangle',v:.025})},
  erase(){note(700,T(),.2,{to:200,v:.12})},
  win(){const t=T();[72,76,79,84,79,84].forEach((m,i)=>note(hz(m),t+i*.13,.3,{type:'square',v:.07}));[72,76,79,84].forEach(m=>note(hz(m),t+.8,1.2,{type:'triangle',v:.12}))}
};
const MEL=[69,0,72,74,76,0,74,72, 74,0,76,0,72,0,0,0, 69,0,72,74,76,0,79,76, 74,72,69,0,72,0,0,0],BASS=[45,52,48,52, 50,57,45,52, 45,52,48,52, 50,52,45,0],EI=60/120/2;
function sched(){while(nextT<ctx.currentTime+.15){const i=stepN%32,m=MEL[i];
  if(m){note(hz(m),nextT,.3,{type:'triangle',v:.5,bus:musicGain});note(hz(m+12),nextT,.16,{v:.1,bus:musicGain})}
  if(i%2===0&&BASS[i/2])note(hz(BASS[i/2]),nextT,.26,{v:.45,bus:musicGain});nextT+=EI;stepN++}}
function startMusic(){if(bgm||!musicOn)return;ac();nextT=ctx.currentTime+.1;stepN=0;musicGain.gain.setValueAtTime(.058,ctx.currentTime);bgm=setInterval(sched,25)}
function stopMusic(){clearInterval(bgm);bgm=null;if(musicGain)musicGain.gain.setTargetAtTime(.0001,ctx.currentTime,.05)}
const musicBtn=document.getElementById('music');
function paintMusic(){musicBtn.classList.toggle('off',!musicOn);musicBtn.setAttribute('aria-pressed',musicOn)}
musicBtn.addEventListener('click',e=>{e.stopPropagation();musicOn=!musicOn;try{localStorage.setItem(KEY,musicOn?'on':'off')}catch(err){}paintMusic();musicOn?startMusic():stopMusic()});
paintMusic();addEventListener('pointerdown',()=>{ac();startMusic()});

/* ================= 共用 ================= */
const INK='#4A4552';
const stage=document.getElementById('stage'),main=document.getElementById('main'),bannerEl=document.getElementById('banner'),starsEl=document.getElementById('stars');
const U=v=>`calc(var(--u)*${v})`;
function fit(){const u=Math.max(.5,Math.min(main.clientWidth/410,main.clientHeight/510));document.documentElement.style.setProperty('--u',u+'px');return u}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(cls,html=''){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
function put(n,x,y,w,h){n.style.left=U(x);n.style.top=U(y);n.style.width=U(w);n.style.height=U(h)}
const banner=t=>bannerEl.textContent=t;
let stars=0;const addStar=()=>{stars++;starsEl.textContent=stars};
function toStage(e){const r=stage.getBoundingClientRect(),k=stage.clientWidth/400;return{x:(e.clientX-r.left-stage.clientLeft)/k,y:(e.clientY-r.top-stage.clientTop)/k}}
function burstAt(x,y){for(let i=0;i<7;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.classList.add('burst');
  s.innerHTML='<path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#E9C46A" stroke="#4A4552" stroke-width="2"/>';
  const a=Math.PI*2*i/7;s.style.left=x-13+'px';s.style.top=y-13+'px';s.style.setProperty('--dx',Math.cos(a)*75+'px');s.style.setProperty('--dy',Math.sin(a)*75-30+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function burst(cx,cy){const r=stage.getBoundingClientRect(),k=stage.clientWidth/400;burstAt(r.left+stage.clientLeft+cx*k,r.top+stage.clientTop+cy*k)}

/* ================= 資料 ================= */
// 配對用:注音 + 第一個音是它的圖
const PAIRS=[['ㄅ','🍦','冰淇淋','ㄅㄧㄥ'],['ㄆ','🍇','葡萄','ㄆㄨˊ'],['ㄇ','🐱','貓','ㄇㄠ'],['ㄈ','✈️','飛機','ㄈㄟ'],['ㄉ','🥚','蛋','ㄉㄢˋ'],['ㄊ','🐰','兔子','ㄊㄨˋ'],['ㄋ','🐮','牛','ㄋㄧㄡˊ'],['ㄌ','🐯','老虎','ㄌㄠˇ'],['ㄍ','🐶','狗','ㄍㄡˇ'],['ㄎ','👖','褲子','ㄎㄨˋ'],['ㄏ','🌸','花','ㄏㄨㄚ'],['ㄐ','🐔','雞','ㄐㄧ'],['ㄑ','🐸','青蛙','ㄑㄧㄥ'],['ㄒ','🍉','西瓜','ㄒㄧ'],['ㄓ','🐷','豬','ㄓㄨ'],['ㄔ','🚗','車','ㄔㄜ'],['ㄕ','🦁','獅子','ㄕ'],['ㄖ','🍖','肉','ㄖㄡˋ'],['ㄗ','👄','嘴巴','ㄗㄨㄟˇ'],['ㄘ','🍓','草莓','ㄘㄠˇ'],['ㄙ','☂️','傘','ㄙㄢˇ'],['ㄚ','👴','阿公','ㄚ'],['ㄛ','🐓','喔喔叫','ㄛ'],['ㄞ','❤️','愛心','ㄞˋ'],['ㄦ','👂','耳朵','ㄦˇ'],['ㄧ','👕','衣服','ㄧ'],['ㄨ','🐢','烏龜','ㄨ'],['ㄩ','🐟','魚','ㄩˊ']];
const ITEMS=PAIRS.map(([z,e,w,f])=>({key:z,z,pic:e,word:w,full:f,tag:w+' '+f}));
const SLOT_HTML=it=>`<div class="face"><span class="pic">${it.pic}</span><span class="word">${it.word}</span></div><div class="pocket"></div>`;
const PIECE_LABEL=it=>it.z;
const RIGHT=it=>`對了!「${it.word}」${it.full},第一個音是 ${it.z}`;
const WRONG=(p,s)=>`「${s.item.word}」不是 ${p.label} 開頭喔,唸唸看再找`;
const MATCH_ASK='唸唸看圖片,把注音放到第一個音一樣的圖下面';
const TRAY_LABEL='▼ 注音符號 ▼';
const MATCH_WIN='注音都找到自己的圖了';
// 寫寫看:37 個注音,筆畫數依教育部《國語注音符號手冊》
const ZY='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄧㄨㄩ'.split('');
const STROKES=[1,2,2,2,2,3,1,2,2,2,2,2,1,2,4,3,3,4,2,2,2,3,2,2,3,3,1,3,2,2,1,3,1,2,1,2,2];
const WRITE_LIST=ZY.map((g,i)=>({g,sub:STROKES[i]+' 畫'}));
const WRITE_ASK=it=>`用手指沿著虛線,把「${it.g}」塗滿(${it.sub})`;
const WRITE_DONE=it=>`寫得好棒!${it.g} 寫好了,按 ▶ 寫下一個`;
const STROKE_LINK='<a class="btn" href="https://stroke-order.learningweb.moe.edu.tw/phonetic.jsp" target="_blank" rel="noopener">看筆順動畫 ↗</a>';
const GLYPH_FAMILY='"Noto Sans TC","PingFang TC",sans-serif';
const FONT_SCALE=.72,BRUSH=.09;
function LAYOUT(it,m,w,h){const gw=m.actualBoundingBoxRight+m.actualBoundingBoxLeft,gh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  return{x:w/2-gw/2+m.actualBoundingBoxLeft,y:h/2+gh/2-m.actualBoundingBoxDescent}}
function GUIDES(g,w,h){g.fillStyle='#FFFDF5';g.fillRect(0,0,w,h);g.lineWidth=Math.max(2,w*.006);g.strokeStyle='#F2B8B8';g.setLineDash([w*.025,w*.02]);
  g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();g.setLineDash([])}

const STEM={ch:'ㄧ',axis:'h'};


/* ================= 配對模式 ================= */
let mode='match',level=0,slots=[],pieces=[],drag=null,busy=false,recent=[];
function addSlot(s){s.el=el('slot card',s.html);put(s.el,s.x,s.y,s.w,s.h);stage.appendChild(s.el);slots.push(s);return s}
function addPiece(p){p.el=el('piece tile',p.label);put(p.el,p.x,p.y,p.w,p.h);p.el.style.transform=`rotate(${p.rot||0}deg)`;stage.appendChild(p.el);pieces.push(p);p.el.addEventListener('pointerdown',e=>startDrag(p,e));return p}
function slotAt(cx,cy){return slots.find(s=>!s.filled&&cx>s.x-6&&cx<s.x+s.w+6&&cy>s.y-6&&cy<s.y+s.h+6)}
function startDrag(p,e){e.preventDefault();if(drag||p.placed||busy)return;const q=toStage(e);drag={p,id:e.pointerId,dx:q.x-p.x,dy:q.y-p.y,over:null};p.el.classList.add('drag');S.pick()}
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const q=toStage(e),p=drag.p;
  const x=Math.max(-p.w*.3,Math.min(400-p.w*.7,q.x-drag.dx)),y=Math.max(-p.h*.3,Math.min(500-p.h*.7,q.y-drag.dy));
  p.el.style.left=U(x);p.el.style.top=U(y);const cx=x+p.w/2,cy=y+p.h/2;
  const s=slotAt(cx,cy);if(s!==drag.over){drag.over&&drag.over.el.classList.remove('hover');drag.over=s;s&&s.el.classList.add('hover')}});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const {p,over}=drag;drag=null;p.el.classList.remove('drag');over&&over.el.classList.remove('hover');
  if(over&&over.key===p.key)place(p,over);
  else{p.el.style.left=U(p.x);p.el.style.top=U(p.y);if(over){S.nope();banner(WRONG(p,over));setTimeout(()=>{p.el.classList.remove('shake');void p.el.offsetWidth;p.el.classList.add('shake')},350)}else S.back()}}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
function place(p,s){p.placed=true;s.filled=true;const pk=s.el.querySelector('.pocket').getBoundingClientRect(),r=stage.getBoundingClientRect(),k=stage.clientWidth/400;
  const px=(pk.left-r.left-stage.clientLeft)/k,py=(pk.top-r.top-stage.clientTop)/k,pw=pk.width/k;
  p.el.classList.add('placed');put(p.el,px,py,pw,pw);
  S.snap(pieces.filter(q=>q.placed).length%4*2);addStar();burst(s.x+s.w/2,s.y+s.h/2);s.el.appendChild(el('tag',s.item.tag));banner(RIGHT(s.item));
  if(pieces.every(q=>q.placed))setTimeout(finishMatch,800)}
function finishMatch(){busy=true;S.win();const d=el('done',`<h2>全部配對好了!</h2><p>${MATCH_WIN}</p>`);
  const b=document.createElement('button');b.className='btn go';b.type='button';b.textContent='下一關';b.addEventListener('click',()=>{level++;startMatch()});d.appendChild(b);stage.appendChild(d);b.focus()}
function startMatch(){busy=false;drag=null;slots=[];pieces=[];stage.innerHTML='';
  stage.appendChild(el('board'));stage.appendChild(el('trayline',TRAY_LABEL));
  const n=Math.min(3+Math.floor(level/2),5);
  let pool=ITEMS.filter(it=>!recent.includes(it.key));if(pool.length<n)pool=ITEMS.slice();
  const pick=shuffle(pool.slice()).slice(0,n);recent=recent.concat(pick.map(p=>p.key)).slice(-12);
  const gap=n>=5?8:14,W=Math.min(108,(380-gap*(n-1))/n),H=Math.min(200,W*1.75);
  let x=(400-(W*n+gap*(n-1)))/2;const y=(250-H)/2;
  pick.forEach(it=>{addSlot({key:it.key,item:it,html:SLOT_HTML(it),x,y,w:W,h:H});x+=W+gap});
  const PS=Math.min(80,W*.78),order=shuffle(pick.slice()),pg=(400-PS*n)/(n+1);
  order.forEach((it,i)=>addPiece({key:it.key,label:PIECE_LABEL(it),x:pg+(PS+pg)*i,y:330+(i%2)*56+(Math.random()-.5)*10,w:PS,h:PS,rot:(Math.random()-.5)*24}));
  banner(MATCH_ASK)}

/* ================= 寫寫看模式 =================
   用字型畫出字的樣子,孩子用手指塗滿字的筆畫就完成。
   墨水只會留在字的範圍附近,塗到 80% 以上就算寫好。 */
let W={idx:0,canvas:null,ink:null,allow:null,pts:[],done:false,last:null,id:null};
function startWrite(){busy=false;drag=null;stage.innerHTML='';
  const paper=el('paper');stage.appendChild(paper);
  const cv=document.createElement('canvas');paper.appendChild(cv);W.canvas=cv;
  const meter=el('meter','<i></i>');stage.appendChild(meter);W.meter=meter.firstChild;
  const bar=el('wbar',`<button class="nav" id="prev" type="button" aria-label="上一個"><svg viewBox="0 0 24 24"><path d="M15 4L7 12l8 8" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="cur"><b id="curG"></b><span id="curT"></span></div><button class="nav" id="next" type="button" aria-label="下一個"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`);
  stage.appendChild(bar);
  const btns=el('wbtns',`<button class="btn" id="clear" type="button">擦掉重寫</button>${STROKE_LINK}`);stage.appendChild(btns);
  bar.querySelector('#prev').onclick=()=>goWrite(-1);bar.querySelector('#next').onclick=()=>goWrite(1);
  btns.querySelector('#clear').onclick=()=>{S.erase();setupGlyph()};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();if(W.id!==null||W.done)return;W.id=e.pointerId;W.last=pos(e);dot(W.last)});
  setupGlyph()}
function goWrite(d){S.back();W.idx=(W.idx+d+WRITE_LIST.length)%WRITE_LIST.length;setupGlyph()}
function pos(e){const r=W.canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W.k,y:(e.clientY-r.top)*W.k}}
addEventListener('pointermove',e=>{if(W.id===null||e.pointerId!==W.id)return;const p=pos(e);line(W.last,p);W.last=p});
const endW=e=>{if(W.id===null||e.pointerId!==W.id)return;W.id=null;check()};
addEventListener('pointerup',endW);addEventListener('pointercancel',endW);
function line(a,b){const g=W.ink.getContext('2d');g.lineCap='round';g.lineJoin='round';g.lineWidth=W.brush;g.strokeStyle=W.color;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  if(Math.random()<.35)S.scratch();render();if(Math.random()<.15)check(true)}
function dot(a){const g=W.ink.getContext('2d');g.fillStyle=W.color;g.beginPath();g.arc(a.x,a.y,W.brush/2,0,7);g.fill();render()}
function render(){const g=W.canvas.getContext('2d'),w=W.canvas.width,h=W.canvas.height;g.clearRect(0,0,w,h);g.drawImage(W.guide,0,0);
  const t=W.tmp.getContext('2d');t.globalCompositeOperation='source-over';t.clearRect(0,0,w,h);t.drawImage(W.ink,0,0);t.globalCompositeOperation='destination-in';t.drawImage(W.allow,0,0);g.drawImage(W.tmp,0,0)}
function check(quiet){const w=W.ink.width,d=W.ink.getContext('2d').getImageData(0,0,w,W.ink.height).data;
  let hit=0,worst=1;const cov={};
  for(const i of W.pts){if(d[i*4+3]>40)hit++}
  for(const id in W.cells){const list=W.cells[id];let c=0;for(const i of list)if(d[i*4+3]>40)c++;worst=Math.min(worst,c/list.length)}
  const all=hit/W.pts.length;W.meter.style.width=Math.min(100,all/.9*100)+'%';
  if(!quiet&&all>=.9&&!W.done){W.done=true;S.win();addStar();const r=W.canvas.getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2);
    // 寫好了:字變成彩色
    const g=W.ink.getContext('2d');g.globalCompositeOperation='source-over';g.fillStyle=W.color;g.fillRect(0,0,w,W.ink.height);render();
    banner(WRITE_DONE(WRITE_LIST[W.idx]))}
  else if(!quiet&&!W.done&&all>=.6)banner('快好了!把灰色的地方也塗滿')}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
async function setupGlyph(){const cv=W.canvas,r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(50,Math.round(r.width*dpr)),h=Math.max(50,Math.round(r.height*dpr));cv.width=w;cv.height=h;W.k=w/r.width;
  const it=WRITE_LIST[W.idx];document.getElementById('curG').textContent=it.g;document.getElementById('curT').textContent=it.sub;
  W.done=false;W.id=null;W.color=['#D8796E','#6E91C7','#7FB08A','#E3A06B','#A08CC8'][W.idx%5];W.meter.style.width='0';
  try{await document.fonts.load(`700 100px ${GLYPH_FAMILY}`,it.g)}catch(e){}
  const fs=Math.round(w*FONT_SCALE);const font=`700 ${fs}px ${GLYPH_FAMILY}`;
  // 字的位置
  const meas=mk(4,4).getContext('2d');meas.font=font;const m=meas.measureText(it.g);
  const lay=LAYOUT(it,m,w,h,fs,meas);
  // 參考線
  const gd=mk(w,h),gg=gd.getContext('2d');W.guide=gd;GUIDES(gg,w,h,lay);
  gg.font=font;gg.textBaseline='alphabetic';gg.fillStyle='#E4DCC8';gg.fillText(it.g,lay.x,lay.y);
  gg.setLineDash([w*.012,w*.012]);gg.lineWidth=Math.max(2,w*.006);gg.strokeStyle='#A99E84';gg.strokeText(it.g,lay.x,lay.y);gg.setLineDash([]);
  // 允許墨水的範圍(字再外擴一點)
  const al=mk(w,h),ag=al.getContext('2d');W.allow=al;ag.font=font;ag.textBaseline='alphabetic';ag.fillStyle='#000';ag.strokeStyle='#000';ag.lineJoin='round';ag.lineWidth=w*.05;ag.fillText(it.g,lay.x,lay.y);ag.strokeText(it.g,lay.x,lay.y);
  // 要塗滿的點
  const fg=mk(w,h),fx=fg.getContext('2d');fx.font=font;fx.textBaseline='alphabetic';fx.fillStyle='#000';fx.fillText(it.g,lay.x,lay.y);
  const fd=fx.getImageData(0,0,w,h).data,step=Math.max(2,Math.round(w/110));W.pts=[];const cells={};
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){const i=y*w+x;if(fd[i*4+3]>128){W.pts.push(i);const id=Math.floor(x/w*5)+','+Math.floor(y/h*5);(cells[id]=cells[id]||[]).push(i)}}
  // 太小的區塊併掉,避免只差一兩點卡住
  W.cells={};for(const id in cells)if(cells[id].length>=8)W.cells[id]=cells[id];
  const sm=meas.measureText(STEM.ch),stem=STEM.axis==='w'?sm.actualBoundingBoxRight+sm.actualBoundingBoxLeft:sm.actualBoundingBoxAscent+sm.actualBoundingBoxDescent;
  W.brush=Math.max(w*.035,Math.min(w*BRUSH,stem*1.15));
  W.ink=mk(w,h);W.tmp=mk(w,h);render();
  banner(WRITE_ASK(it))}

/* ================= 模式切換 ================= */
const tabM=document.getElementById('tabMatch'),tabW=document.getElementById('tabWrite');
function setMode(m){mode=m;tabM.setAttribute('aria-selected',m==='match');tabW.setAttribute('aria-selected',m==='write');S.back();m==='match'?startMatch():startWrite()}
tabM.onclick=()=>setMode('match');tabW.onclick=()=>setMode('write');
let rt;addEventListener('resize',()=>{fit();clearTimeout(rt);rt=setTimeout(()=>{if(mode==='write')setupGlyph()},250)});
fit();startMatch();
</script>
</body>
</html>
