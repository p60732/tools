<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>挖寶沙坑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: header (back, title, collection) / row of silhouettes to find / big sand field filling the rest. Landscape tablet: silhouettes become a column on the right.
   Flat shapes, no outlines, soft low-stimulation palette like the other games. */
:root{
  --ink:#4A4552; --bg:#EFE6D8; --white:#FFFFFF; --sand:#E8D2A6; --sand-d:#D9BE8C; --wet:#CDB07E;
  --sea:#A9CFDC; --sea-d:#8FBCCB; --rock:#D3AE84; --rock-d:#B98C63; --ok:#7FB08A; --gold:#E9C46A;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(44px + env(safe-area-inset-bottom,0px));max-width:1300px;margin:0 auto}
header{display:flex;align-items:center;gap:10px}
.ib{all:unset;cursor:pointer;flex:none;width:48px;height:48px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 3px 0 rgba(74,69,82,.15)}
.ib svg{width:26px;height:26px}
.ib:active,.pill:active,.big:active{transform:translateY(2px)}
h1{margin:0;font-size:clamp(22px,5.5vw,32px);font-weight:900;white-space:nowrap}
.pill{all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 16px 8px 10px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(74,69,82,.15);white-space:nowrap}
.pill svg{width:26px;height:26px}
.ib:focus-visible,.pill:focus-visible,.big:focus-visible,.mode:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.tip{text-align:center;font-weight:700;font-size:clamp(15px,4vw,19px);color:#6E6876;min-height:1.4em}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
/* 要找的東西 */
.tray{flex:none;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.slot{width:clamp(52px,14vw,76px);aspect-ratio:1;max-width:100%;border-radius:18px;background:rgba(255,255,255,.6);display:grid;place-items:center;transition:background .3s,transform .3s}
.slot svg{width:82%;height:82%;filter:brightness(0) opacity(.18);transition:filter .5s}
.slot.got{background:var(--white);transform:scale(1.06)}
.slot.got svg{filter:none}
/* 沙地 */
.field{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:var(--wet);touch-action:none}
.deep{position:absolute;inset:0}
.item{position:absolute;transition:transform .4s cubic-bezier(.3,1.6,.5,1),filter .3s}
.item svg{width:100%;height:100%;display:block;overflow:visible}
.item.found{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 6px 0 rgba(74,69,82,.18))}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.field{cursor:pointer}
#layers,#layers canvas{pointer-events:none}
.tool{position:absolute;z-index:6;pointer-events:none;width:var(--ts,96px);height:var(--ts,96px);margin:calc(var(--ts,96px)*-.86) 0 0 calc(var(--ts,96px)*-.14);opacity:0;transition:opacity .15s;filter:drop-shadow(0 5px 0 rgba(74,69,82,.16))}
.tool svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:14% 86%}
.tool.on{opacity:1}
.tool.on svg{animation:scoop .32s ease-in-out infinite alternate}
@keyframes scoop{from{transform:rotate(-14deg) translate(4px,-6px)}to{transform:rotate(12deg) translate(-2px,4px)}}
.fly{position:fixed;z-index:30;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(74,69,82,.18))}
.fly svg{width:100%;height:100%;display:block;overflow:visible}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
.plus{position:fixed;z-index:31;pointer-events:none;font-weight:900;font-size:22px;color:#5E8F69;animation:plus 1.1s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
canvas.fx{pointer-events:none}
.label{position:absolute;transform:translate(-50%,-100%);background:var(--white);border-radius:999px;padding:4px 14px;font-weight:900;font-size:clamp(16px,4vw,22px);white-space:nowrap;box-shadow:0 3px 0 rgba(74,69,82,.12);pointer-events:none;animation:lab 1.6s ease-out forwards;z-index:5}
@keyframes lab{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-16px}}
.twinkle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;z-index:4;animation:tw 1.4s ease-in-out 2}
.twinkle svg{width:100%;height:100%}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}
/* 背景:海邊、化石場 */
.beach .field{background:var(--wet)}
.sky{flex:none;height:clamp(40px,8vh,70px);border-radius:22px;position:relative;overflow:hidden}
.beach .sky{background:linear-gradient(#DCEBF0 0 45%,var(--sea) 45%)}
.beach .sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-8px;height:22px;background:radial-gradient(circle at 20px 0,transparent 16px,#F4EEE2 17px) 0 0/40px 22px repeat-x;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(40px)}}
.fossil .sky{background:linear-gradient(#EEE3CF 0 40%,#D9B48A 40% 60%,#C99B6D 60% 80%,#B98C63 80%)}
.garden .sky{background:linear-gradient(#E3EEDF 0 55%,#A9C49A 55%)}
.garden .sky::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:30px;background:radial-gradient(ellipse 9px 15px at 12px 15px,#8FB283 96%,transparent) 0 0/46px 30px repeat-x,radial-gradient(ellipse 9px 15px at 30px 17px,#7FA676 96%,transparent) 0 0/46px 30px repeat-x}
.snow .sky{background:linear-gradient(#E6EEF3 0 50%,#F7F8FA 50%)}
.snow .sky::before{content:"";position:absolute;left:0;right:0;bottom:30%;height:60%;background:radial-gradient(ellipse 120px 40px at 80px 100%,#FFFFFF 98%,transparent) 0 0/260px 100% repeat-x}
.snow .sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle 2.5px,#fff 96%,transparent) 0 0/34px 26px,radial-gradient(circle 2px,#fff 96%,transparent) 17px 13px/34px 26px;animation:snowf 5s linear infinite;opacity:.9}
@keyframes snowf{to{background-position:0 26px,17px 39px}}
/* 選單 */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow-y:auto;touch-action:pan-y}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;width:min(100%,1000px)}
@media (max-width:700px){.modes{grid-template-columns:1fr 1fr}.mode .t{padding:8px 12px 12px}.mode small{font-size:13px}}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--white);border-radius:26px;overflow:hidden;box-shadow:0 5px 0 rgba(74,69,82,.14);display:flex;flex-direction:column;touch-action:manipulation}
.mode .pic{aspect-ratio:16/10;max-width:100%;display:grid;place-items:center}
.mode .pic svg{width:100%;height:100%}
.mode .t{padding:12px 18px 16px;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:clamp(19px,4.6vw,26px)}
.mode small{font-size:15px;font-weight:700;color:#6E6876}
.mode:active{transform:translateY(3px)}
/* 完成、收藏館 */
.over{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(239,230,216,.96);text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(44px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow-y:auto;touch-action:pan-y}
.over h2{margin:0;font-size:clamp(30px,8vw,46px);font-weight:900}
.over p{margin:0;font-weight:700;color:#6E6876;font-size:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{all:unset;cursor:pointer;font-weight:900;font-size:22px;padding:12px 28px;border-radius:999px;background:var(--ok);color:var(--white);box-shadow:0 5px 0 #5E8F69}
.big.w{background:var(--white);color:var(--ink);box-shadow:0 5px 0 #D9D2C6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;width:min(100%,760px)}
.card{all:unset;cursor:pointer;background:var(--white);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px}
.card svg{width:80%;aspect-ratio:1;max-width:100%}
.card.no{cursor:default;color:#B5ADA2;background:rgba(255,255,255,.5)}
.card.no svg{filter:brightness(0) opacity(.12)}
.card.wig svg{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
.found-big{width:min(40vw,180px);aspect-ratio:1;max-width:100%}
.found-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.found-row div{width:70px;aspect-ratio:1;background:var(--white);border-radius:18px;display:grid;place-items:center}
.found-row svg{width:80%;height:80%}
@media (orientation:landscape) and (min-width:800px){
  .body{flex-direction:row}
  .tray{flex-direction:column;justify-content:center;order:2}
  .slot{width:80px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="ib" id="back" type="button" aria-label="回到選單" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#4A4552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 id="title">挖寶沙坑</h1>
    <button class="pill" id="museum" type="button" hidden><svg viewBox="0 0 26 26"><path d="M3 10L13 3l10 7z" fill="#C99B6D"/><rect x="5" y="11" width="3" height="10" fill="#D9BE8C"/><rect x="11.5" y="11" width="3" height="10" fill="#D9BE8C"/><rect x="18" y="11" width="3" height="10" fill="#D9BE8C"/><rect x="3" y="21" width="20" height="3" rx="1" fill="#C99B6D"/></svg><span id="mcount">收藏館</span></button>
  </header>
  <div class="tip" id="tip"></div>
  <div class="menu" id="menu"></div>
  <div class="sky" id="sky" hidden></div>
  <div class="body" id="body" hidden>
    <div class="tray" id="tray"></div>
    <div class="field" id="field">
      <div class="deep" id="deep"></div>
      <div id="items"></div>
      <div id="layers"></div>
      <div class="tool" id="tool"></div>
      <canvas class="fx" id="fx"></canvas>
    </div>
  </div>
</div>
<div class="over" id="over" hidden></div>

<script>
/* ================= 聲音 ================= */
let ctx=null,out=null;
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();out.gain.value=.7;out.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,t,d,{type='sine',v=.15,to=null}={}){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(t,d,{v=.1,f=900,q=1,type='bandpass'}={}){try{const c=ac(),b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(out);s.start(t)}catch(e){}}
const T=()=>ac().currentTime;
const S={
  dig(){const t=T();noise(t,.14,{v:.12,f:700+Math.random()*500,q:.8});noise(t+.03,.08,{v:.05,f:2400,q:2})},
  brush(){const t=T();noise(t,.16,{v:.07,f:3200+Math.random()*800,q:.6,type:'highpass'})},
  find(){const t=T();[76,79,84].forEach((m,i)=>tone(440*Math.pow(2,(m-69)/12),t+i*.1,.5,{type:'triangle',v:.13}))},
  win(){const t=T();[72,76,79,84,88].forEach((m,i)=>tone(440*Math.pow(2,(m-69)/12),t+i*.13,.6,{type:'triangle',v:.12}))},
  soil(){const t=T();noise(t,.16,{v:.13,f:380+Math.random()*250,q:.9});noise(t+.04,.06,{v:.04,f:1500,q:2})},
  snow(){const t=T();noise(t,.09,{v:.09,f:2600+Math.random()*900,q:1.5});noise(t+.05,.07,{v:.06,f:1900+Math.random()*600,q:1.5})},
  tap(){tone(520,T(),.08,{type:'triangle',v:.1})},
  ding(){const t=T();tone(1568,t,.35,{type:'sine',v:.12});tone(2093,t+.07,.45,{type:'sine',v:.09})}
};
function talk(txt){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';u.rate=1;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}

/* ================= 寶物圖案(原創扁平風) ================= */
const K='#4A4552';
const BEACH=[
 ['scallop','扇貝',`<path d="M50 90L12 44Q50 -2 88 44Z" fill="#EBA9A2"/>${[-30,-15,0,15,30].map(a=>`<path d="M50 88L${50+Math.sin(a*Math.PI/180)*44} ${48-Math.cos(a*Math.PI/180)*30}" stroke="#D88E87" stroke-width="4"/>`).join('')}<path d="M38 84h24l-4 10H42z" fill="#D88E87"/>`],
 ['conch','海螺',`<path d="M24 74Q20 40 50 18Q74 6 84 30Q90 50 70 70Q52 86 24 74Z" fill="#F1DAB8"/><path d="M40 30Q60 26 70 40M32 46Q56 42 74 56M30 62Q48 60 60 70" stroke="#E3A06B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M24 74Q14 86 10 92Q26 88 34 80Z" fill="#E7C7A0"/><ellipse cx="60" cy="56" rx="10" ry="14" fill="#F4C9C2" transform="rotate(30 60 56)"/>`],
 ['starfish','海星',`<path d="M50 8Q56 34 92 38Q64 52 74 88Q50 66 26 88Q36 52 8 38Q44 34 50 8Z" fill="#E3A06B" stroke="#E3A06B" stroke-width="8" stroke-linejoin="round"/>${[[50,30],[66,42],[60,62],[40,62],[34,42],[50,48]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#F1C79A"/>`).join('')}`],
 ['crab','小螃蟹',`<path d="M20 70l-12 8M22 78l-10 12M80 70l12 8M78 78l10 12" stroke="#C9665B" stroke-width="5" stroke-linecap="round"/><path d="M26 46Q14 30 20 22Q30 28 30 40M74 46Q86 30 80 22Q70 28 70 40" fill="#D8796E"/><circle cx="18" cy="24" r="9" fill="#D8796E"/><circle cx="82" cy="24" r="9" fill="#D8796E"/><ellipse cx="50" cy="66" rx="32" ry="22" fill="#D8796E"/><path d="M42 46V36M58 46V36" stroke="#D8796E" stroke-width="4"/><circle cx="42" cy="34" r="6" fill="#fff"/><circle cx="58" cy="34" r="6" fill="#fff"/><circle cx="42" cy="35" r="3" fill="${K}"/><circle cx="58" cy="35" r="3" fill="${K}"/><path d="M42 72q8 6 16 0" stroke="${K}" stroke-width="3" fill="none" stroke-linecap="round"/>`],
 ['pearl','珍珠',`<path d="M10 58Q50 98 90 58Z" fill="#B9B4C0"/><path d="M14 56Q50 4 86 56Z" fill="#C9C4CE"/><path d="M16 58Q50 84 84 58Z" fill="#EDE8EF"/><circle cx="50" cy="60" r="13" fill="#FFFFFF"/><circle cx="45" cy="55" r="4" fill="#F4EFF6"/>`],
 ['sanddollar','沙錢',`<circle cx="50" cy="50" r="40" fill="#E9DCC2"/><circle cx="50" cy="50" r="40" fill="none" stroke="#D9C8A6" stroke-width="3"/>${[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="32" rx="5" ry="13" fill="#D3BF98" transform="rotate(${a} 50 50)"/>`).join('')}<circle cx="50" cy="50" r="4" fill="#D3BF98"/>`],
 ['bottle','漂流瓶',`<g transform="rotate(-30 50 50)"><rect x="30" y="26" width="40" height="64" rx="14" fill="#A9CFDC" opacity=".85"/><rect x="40" y="10" width="20" height="20" rx="4" fill="#A9CFDC" opacity=".85"/><rect x="41" y="4" width="18" height="10" rx="3" fill="#A98467"/><rect x="38" y="40" width="24" height="34" rx="4" fill="#F4EEE2"/><path d="M42 48h16M42 56h16M42 64h10" stroke="#C9B9A0" stroke-width="2.5"/><rect x="34" y="32" width="5" height="40" rx="2.5" fill="#fff" opacity=".6"/></g>`],
 ['nautilus','鸚鵡螺',`<circle cx="50" cy="52" r="38" fill="#F4E6D2"/><path d="M50 52m-30 0a30 30 0 1 0 30-30a22 22 0 1 1-22 22a14 14 0 1 0 14-14" fill="none" stroke="#D9A57A" stroke-width="6" stroke-linecap="round"/>${[0,40,80,120,160].map(a=>`<path d="M50 14Q${50+10} 30 ${50} 52" stroke="#E7B88E" stroke-width="5" fill="none" transform="rotate(${a} 50 52)"/>`).join('')}`]
];
const FOSSIL=[
 ['skull','恐龍頭骨',`<path d="M10 54Q12 26 44 22Q70 18 90 34Q94 44 84 50L80 62Q60 66 40 64L28 74Q16 72 10 54Z" fill="#EFE3CC"/><circle cx="62" cy="36" r="8" fill="#B98C63"/><ellipse cx="34" cy="44" rx="10" ry="7" fill="#D9C8A6"/>${[44,52,60,68,76].map(x=>`<path d="M${x} 62l3 9 3-9z" fill="#FFFFFF"/>`).join('')}<path d="M28 74Q44 82 60 76l18-12" stroke="#E2D2B4" stroke-width="7" fill="none" stroke-linecap="round"/>`],
 ['ammonite','菊石',`<circle cx="50" cy="50" r="40" fill="#C9AF8C"/><path d="M50 50m-34 0a34 34 0 1 0 34-34a25 25 0 1 1-25 25a16 16 0 1 0 16-16a8 8 0 1 1-8 8" fill="none" stroke="#A88B67" stroke-width="5" stroke-linecap="round"/>${Array.from({length:14},(_,i)=>`<path d="M50 12v12" stroke="#B89C78" stroke-width="3" transform="rotate(${i*26} 50 50)"/>`).join('')}`],
 ['trilobite','三葉蟲',`<ellipse cx="50" cy="52" rx="28" ry="40" fill="#A99E92"/><path d="M24 30Q50 8 76 30Q64 36 50 36Q36 36 24 30Z" fill="#BDB3A6"/>${[42,50,58,66,74].map(y=>`<path d="M24 ${y}Q50 ${y+6} 76 ${y}" stroke="#8E8478" stroke-width="3" fill="none"/>`).join('')}<path d="M40 22v66M60 22v66" stroke="#8E8478" stroke-width="3"/><circle cx="38" cy="26" r="3" fill="#6E655B"/><circle cx="62" cy="26" r="3" fill="#6E655B"/>`],
 ['footprint','恐龍腳印',`<circle cx="50" cy="50" r="44" fill="#C9AA84"/><path d="M50 82Q34 76 38 58L26 26Q30 20 36 26L46 48L48 18Q52 12 56 18L56 48L66 26Q72 20 76 26L64 58Q68 76 50 82Z" fill="#A6865F"/>`],

    else{for(let i=0;i<W*H/9000;i++){g.fillStyle=dot[0];const x=Math.random()*W,y=Math.random()*H;g.beginPath();g.ellipse(x,y,6+Math.random()*8,4+Math.random()*5,Math.random()*3,0,7);g.fill()}}
    layersEl.appendChild(c);layers[k]={c,g,col:[base,...dot]}}
  tipEl.textContent=MODES[mode].tip+' 這次有 '+NL+' 層'+(MODES[mode].unit||'沙')+'喔';
  // 藏 5 個寶物,不重疊
  const M=MODES[mode],pick=(()=>{let l=shuffle(M.list.slice()).slice(0,5);if(M.must&&!l.some(i=>i[0]===M.must))l[0]=M.list.find(i=>i[0]===M.must);return shuffle(l)})(),size=Math.max(70,Math.min(140,Math.min(W,H)*.24));R=Math.max(26,size*.36);CELL=R*.7;GW=Math.ceil(W/CELL)+1;depth=new Uint8Array(GW*(Math.ceil(H/CELL)+1));dugT=new Float64Array(depth.length);
  itemsEl.innerHTML='';items=[];found=0;tray.innerHTML='';
  pick.forEach(it=>{let x,y,ok=false;for(let t=0;t<300&&!ok;t++){x=size*.15+Math.random()*(W-size*1.3);y=size*.15+Math.random()*(H-size*1.3);ok=items.every(o=>Math.hypot(o.x-x,o.y-y)>size*1.05)}
    const el=document.createElement('div');el.className='item';el.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(${Math.random()*40-20}deg)`;el.innerHTML=svgOf(it);itemsEl.appendChild(el);
    const sl=document.createElement('div');sl.className='slot';sl.innerHTML=svgOf(it);tray.appendChild(sl);
    items.push({it,x,y,size,el,slot:sl,found:false})})}

/* 挖 */
let digging=null,lastPt=null,lastSnd=0,lastCheck=0;
const parts=[];
function toField(e){const r=field.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
// 每個小區塊記錄挖到第幾層:一次划過只往下挖一層,停在同一處多挖一下才會更深
function digAt(x,y){if(!depth)return;const beach=mode==='beach',now=performance.now();
  const ci=Math.max(0,Math.floor(y/CELL))*GW+Math.max(0,Math.floor(x/CELL));let k;
  if(depth[ci]<NL&&now-dugT[ci]>450){k=depth[ci];depth[ci]++;dugT[ci]=now}else k=Math.min(NL-1,Math.max(0,depth[ci]-1));
  const L=layers[k],g=L.g;g.globalCompositeOperation='destination-out';
  for(let i=0;i<5;i++){const a=Math.random()*7,d=Math.random()*R*.35,rr=R*(.55+Math.random()*.45);g.beginPath();g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rr,0,7);g.fill()}
  // 噴出來的沙(顏色跟著這一層)
  for(let i=0;i<(mode==='fossil'?5:7);i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*7-2,life:1,c:L.col[i%4],s:Math.random()*4+2});
  if(now-lastSnd>90){lastSnd=now;({beach:S.dig,fossil:S.brush,garden:S.soil,snow:S.snow})[mode]()}
  if(now-lastCheck>100){lastCheck=now;check()}}
const toolEl=$('tool');let toolHide=0;
function toolAt(p){toolEl.style.left=p.x+'px';toolEl.style.top=p.y+'px'}
field.addEventListener('pointerdown',e=>{if(digging!==null||!mode||!depth)return;e.preventDefault();ac();digging=e.pointerId;lastPt=toField(e);
  if(toolEl.dataset.m!==mode){toolEl.innerHTML=TOOLS[mode];toolEl.dataset.m=mode}toolEl.style.setProperty('--ts',Math.max(80,Math.min(130,R*2.6))+'px');clearTimeout(toolHide);toolAt(lastPt);toolEl.classList.add('on');digAt(lastPt.x,lastPt.y)});
addEventListener('pointermove',e=>{if(e.pointerId!==digging)return;const p=toField(e);toolAt(p);const d=Math.hypot(p.x-lastPt.x,p.y-lastPt.y),step=R*.45;
  for(let s=step;s<=d;s+=step){const k=s/d;digAt(lastPt.x+(p.x-lastPt.x)*k,lastPt.y+(p.y-lastPt.y)*k)}if(d>=step)lastPt=p});
const endDig=e=>{if(e.pointerId!==digging)return;digging=null;check();toolHide=setTimeout(()=>toolEl.classList.remove('on'),250)};
addEventListener('pointerup',endDig);addEventListener('pointercancel',endDig);

/* 寶物露出一半以上就算找到 */
function check(){if(!mode||!layers.length)return;const cw=layers[0].c.width,chh=layers[0].c.height;items.forEach(o=>{if(o.found)return;
  const x0=Math.max(0,Math.floor((o.x+o.size*.18)*dpr)),y0=Math.max(0,Math.floor((o.y+o.size*.18)*dpr)),sw=Math.max(1,Math.floor(o.size*.64*dpr)),rw=Math.min(sw,cw-x0),rh=Math.min(sw,chh-y0);if(rw<1||rh<1)return;
  const ds=layers.map(L=>L.g.getImageData(x0,y0,rw,rh).data);let clear=0,n=0;
  for(let yy=0;yy<8;yy++)for(let xx=0;xx<8;xx++){const px=Math.floor((xx+.5)/8*rw),py=Math.floor((yy+.5)/8*rh),j=(py*rw+px)*4+3;n++;if(ds.every(d=>d[j]<60))clear++}
  if(clear/n>=.55)reveal(o)})}
function reveal(o){o.found=true;found++;lastFind=performance.now();
  // 把剩下的沙也撥開,寶物整個露出來
  layers.forEach(L=>{L.g.globalCompositeOperation='destination-out';L.g.beginPath();L.g.ellipse(o.x+o.size/2,o.y+o.size/2,o.size*.62,o.size*.62,0,0,7);L.g.fill()});
  o.el.classList.add('found');S.find();talk(o.it[1]);
  const lab=document.createElement('div');lab.className='label';lab.textContent='找到'+o.it[1]+'了!';lab.style.left=Math.max(80,Math.min(W-80,o.x+o.size/2))+'px';lab.style.top=Math.max(44,o.y-4)+'px';field.appendChild(lab);setTimeout(()=>lab.remove(),1700);
  const isNew=!coll[mode].includes(o.it[0]);if(isNew){coll[mode].push(o.it[0]);saveColl()}
  // 先從洞裡跳出來
  try{o.el.animate([{transform:'scale(1) rotate(0)'},{transform:'translateY(-40%) scale(1.35) rotate(-10deg)',offset:.45},{transform:'translateY(-8%) scale(1.2) rotate(6deg)',offset:.75},{transform:'scale(1.18) rotate(-6deg)'}],{duration:700,easing:'ease-out'})}catch(e){}
  setTimeout(()=>flyToMuseum(o,isNew),800);
  if(found===items.length)setTimeout(done,2200)}
// 再飛進收藏館
function flyToMuseum(o,isNew){const m=$('museum'),land=()=>{o.slot.classList.add('got');paintCount();S.ding();m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump');
    if(isNew&&!m.hidden){const pr=m.getBoundingClientRect(),p=document.createElement('div');p.className='plus';p.textContent='+1';p.style.left=(pr.right-28)+'px';p.style.top=(pr.bottom+2)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}};
  if(!mode||m.hidden||!o.el.isConnected){land();return}
  const a=o.el.getBoundingClientRect(),b=m.getBoundingClientRect(),sz=o.size,f=document.createElement('div');f.className='fly';f.innerHTML=svgOf(o.it);
  f.style.cssText=`left:${a.left+a.width/2-sz/2}px;top:${a.top+a.height/2-sz/2}px;width:${sz}px;height:${sz}px`;document.body.appendChild(f);o.el.style.visibility='hidden';
  const dx=b.left+22-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),sc=Math.max(.2,30/sz),lift=Math.min(160,Math.max(80,Math.abs(dy)*.5));
  let fin=false;const end=()=>{if(fin)return;fin=true;f.remove();land()};
  try{const an=f.animate([{transform:'translate(0,0) scale(1.18) rotate(0)'},{transform:`translate(${dx*.45}px,${dy*.45-lift}px) scale(.9) rotate(200deg)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(360deg)`}],{duration:850,easing:'cubic-bezier(.45,0,.55,1)'});an.onfinish=end}catch(e){end()}
  setTimeout(end,1100)}
function done(){clearInterval(hintT);S.win();const M=MODES[mode];
  over.innerHTML=`<h2>${M.done}</h2><div class="found-row">${items.map(o=>`<div>${svgOf(o.it)}</div>`).join('')}</div><p>收藏館 ${coll[mode].length} / ${M.list.length}</p><div class="row"><button class="big w" type="button" id="toMuseum">看收藏館</button><button class="big" type="button" id="again">再挖一次</button></div>`;
  over.hidden=false;$('again').onclick=()=>{S.tap();start(mode)};$('toMuseum').onclick=()=>{S.tap();museum()}}
function museum(){const M=MODES[mode];over.innerHTML=`<h2>${M.room||M.name.slice(-2)}收藏館</h2><p>已經收集 ${coll[mode].length} / ${M.list.length} 種${coll[mode].length===M.list.length?',全部找齊了!':''}</p><div class="grid" id="mg"></div><div class="row"><button class="big" type="button" id="closeM">回去挖寶</button></div>`;
  over.hidden=false;const g=$('mg');M.list.forEach(it=>{const has=coll[mode].includes(it[0]),b=document.createElement('button');b.type='button';b.className='card'+(has?'':' no');b.innerHTML=svgOf(it)+'<span>'+(has?it[1]:'還沒找到')+'</span>';
    if(has)b.onclick=()=>{b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');S.tap();talk(it[1])};g.appendChild(b)});
  $('closeM').onclick=()=>{S.tap();over.hidden=true;if(found===items.length)start(mode)}}
// 太久沒找到,在寶物上方閃一下提示
function hint(){if(!mode||over.hidden===false)return;if(performance.now()-lastFind<12000)return;const left=items.filter(o=>!o.found);if(!left.length)return;
  const o=left[Math.floor(Math.random()*left.length)],tw=document.createElement('div');tw.className='twinkle';tw.style.left=(o.x+o.size/2)+'px';tw.style.top=(o.y+o.size/2)+'px';
  tw.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z" fill="#FFFFFF"/></svg>';field.appendChild(tw);setTimeout(()=>tw.remove(),2900);lastFind=performance.now()-6000}

/* 沙粒動畫 */
function loop(){if(fctx){fctx.clearRect(0,0,W,H);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.life-=.035;if(p.life<=0){parts.splice(i,1);continue}
  fctx.globalAlpha=p.life;fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.s,0,7);fctx.fill()}fctx.globalAlpha=1}requestAnimationFrame(loop)}
requestAnimationFrame(loop);

$('back').onclick=()=>{S.tap();showMenu()};
$('museum').onclick=()=>{S.tap();museum()};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(mode&&found===0)setupField()},300)});
showMenu();
</script>
</body>
