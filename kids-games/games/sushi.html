<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迴轉壽司</title>
<style>
/* 迴轉壽司:點輸送帶上的壽司拿到座位,點一下吃掉,空盤疊起來,拖進送盤口,集滿五個抽一次扭蛋。 */
:root{--ink:#4A4552;--bg:#EFE6D8;--white:#FFFFFF;--mute:#6E6876;--ok:#7FB08A;--ok-d:#5E8F69;--wood:#C9A97A;--wood-d:#A88A60;--wall:#F1E6D2;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--pw:clamp(92px,min(15vw,20vh),190px);color-scheme:light}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(44px + env(safe-area-inset-bottom,0px));max-width:1300px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,5vw,28px);font-weight:900;white-space:nowrap}
.pill{all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 14px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(74,69,82,.15);white-space:nowrap}
.pill:active{transform:translateY(2px)}
.pill b{background:#E9C46A;border-radius:999px;padding:0 8px;font-size:14px}
.tip{text-align:center;font-weight:900;font-size:clamp(15px,4vw,19px);color:var(--mute);min-height:1.3em}
.shop{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--wall);position:relative}
/* 廚房與輸送帶 */
.kitchen{flex:none;position:relative;padding-top:clamp(26px,5vh,54px);background:linear-gradient(#F1E6D2,#EADCC4)}
.noren{position:absolute;left:0;right:0;top:0;height:clamp(22px,4vh,44px);display:flex;justify-content:center;gap:4px}
.noren i{width:clamp(40px,8vw,90px);background:#6F9FC0;border-radius:0 0 8px 8px;opacity:.85}
.noren i:nth-child(2n){background:#5E87A8}
.chef{position:absolute;right:3%;bottom:calc(var(--pw)*.62);width:clamp(60px,9vw,110px);z-index:1}
.belt{position:relative;height:calc(var(--pw)*.72 + 18px);background:#B9BEC5;border-top:7px solid #9EA4AC;border-bottom:9px solid #8E949C;overflow:hidden;z-index:2}
.belt .track{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#D3D7DC 0 46px,#C3C8CE 46px 50px)}
.lane{position:absolute;inset:0}
.bp{position:absolute;top:6px;left:0;width:var(--pw);height:calc(var(--pw)*.7);cursor:pointer;will-change:transform}
.bp svg{width:100%;height:100%;display:block;pointer-events:none}
/* 桌面 */
.counter{flex:1;min-height:0;position:relative;background:linear-gradient(#D9BE92,#C9A97A);border-top:10px solid #B49A7E;display:grid;grid-template-columns:1fr 2.2fr 1.3fr 1.5fr;grid-template-areas:"tea seat stack slot";align-items:center;gap:6px;padding:8px 12px 12px}
.tea{grid-area:tea;justify-self:center;width:min(100%,calc(var(--pw)*.75));cursor:pointer}
.seat{grid-area:seat;justify-self:center;position:relative;width:min(100%,calc(var(--pw)*2.1));aspect-ratio:2/1.2;display:flex;align-items:flex-end;justify-content:center}
.mat{position:absolute;inset:auto 0 0 0;height:62%;background:#EFE3CC;border-radius:16px;box-shadow:inset 0 0 0 5px #E3D3B4}
.dish{position:relative;width:78%;cursor:pointer;margin-bottom:4%;z-index:1}
.dish svg{width:100%;display:block}
.stack{grid-area:stack;justify-self:center;align-self:stretch;position:relative;width:min(100%,calc(var(--pw)*1.1));min-height:0;touch-action:none}
.stack .sp{position:absolute;left:0;right:0;bottom:0}
.stack .sp svg{width:100%;display:block}
.stack .sp.top{cursor:grab;animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-5px)}}
.stack .n{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;background:var(--white);border-radius:999px;padding:1px 10px;font-weight:900;font-size:15px;box-shadow:0 2px 0 rgba(74,69,82,.15);z-index:30;white-space:nowrap}
.slot{grid-area:slot;justify-self:center;width:min(100%,calc(var(--pw)*1.25));cursor:pointer;position:relative}
.slot svg{width:100%;display:block;overflow:visible}
.slot.ready svg{animation:wig 1.2s ease-in-out infinite}
.slot.hot .mouth{fill:#6E6876}
.arrow{position:absolute;pointer-events:none;font-size:clamp(30px,5vw,46px);z-index:20;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(12px)}}
.fly{position:fixed;z-index:40;pointer-events:none;left:0;top:0}
.fly svg{width:100%;display:block}
.bubble{position:absolute;left:50%;top:-8%;transform:translateX(-50%);background:var(--white);border-radius:999px;padding:4px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(74,69,82,.15);z-index:5;pointer-events:none;white-space:nowrap}
.food{transform-box:fill-box;transform-origin:50% 100%}
.chomp .food{animation:chomp 1.1s ease-in forwards}
@keyframes chomp{0%{transform:scale(1)}20%{transform:scale(1.08,.9)}35%{transform:scale(.8);clip-path:inset(0 0 0 0)}55%{transform:scale(.85,.75);opacity:.85}75%{transform:scale(.45);opacity:.6}100%{transform:scale(.05);opacity:0}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-16px)}}
.sip{animation:sip .8s ease-in-out 1}
@keyframes sip{50%{transform:rotate(-14deg) translateY(-8px)}}
/* 扭蛋與收藏冊 */
.over{position:fixed;inset:0;z-index:60;background:rgba(239,230,216,.96);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(44px + env(safe-area-inset-bottom,0px));overflow-y:auto;text-align:center}
.over h2{margin:0;font-size:clamp(26px,6.5vw,38px);font-weight:900}
.over p{margin:0;font-weight:900;color:var(--mute);font-size:18px}
.machine{width:min(70vw,300px,46vh);cursor:pointer}
.machine svg{width:100%;display:block;overflow:visible}
.handle{transform-box:fill-box;transform-origin:50% 50%}
.turn .handle{animation:turn 1s ease-in-out}
@keyframes turn{to{transform:rotate(360deg)}}
.cap{transform-box:fill-box;transform-origin:50% 50%}
.cap.drop{animation:drop .9s cubic-bezier(.3,1.4,.6,1) both}
@keyframes drop{0%{transform:translateY(-70px);opacity:0}30%{opacity:1}100%{transform:translateY(0)}}
.cap.shake{animation:cshake .5s ease-in-out infinite}
@keyframes cshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.capbig{width:min(52vw,220px,34vh);cursor:pointer}
.capbig svg{width:100%;display:block;overflow:visible}
.capbig .ct{transition:transform .6s cubic-bezier(.3,1.3,.6,1)}
.capbig.open .ct{transform:translate(-30px,-70px) rotate(-30deg)}
.capbig .cb{transition:transform .6s cubic-bezier(.3,1.3,.6,1)}
.capbig.open .cb{transform:translate(20px,40px) rotate(18deg);opacity:.0;transition:transform .6s,opacity .6s .3s}
.prize{width:min(46vw,190px,30vh);animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.2) translateY(40px);opacity:0}}
.prize svg{width:100%;display:block}
.rare{color:#C9A44A}
.big{all:unset;cursor:pointer;font-weight:900;font-size:21px;padding:12px 28px;border-radius:999px;background:var(--ok);color:var(--white);box-shadow:0 5px 0 var(--ok-d)}
.big:active{transform:translateY(3px)}
.big.alt{background:var(--white);color:var(--ink);box-shadow:0 5px 0 rgba(74,69,82,.15)}
.spark{position:fixed;z-index:70;pointer-events:none;width:12px;height:12px;border-radius:3px}
.book{width:min(100%,900px);display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;background:var(--white);border-radius:999px;padding:8px 16px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(74,69,82,.12)}
.tab.on{background:var(--ink);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,120px),1fr));gap:10px}
.it{background:var(--white);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px;position:relative}
.it svg{width:80%;display:block}
.it.no svg{filter:brightness(0);opacity:.13}
.it .c{position:absolute;right:8px;top:6px;background:#E9C46A;border-radius:999px;padding:0 7px;font-size:13px}
.it.gold{box-shadow:inset 0 0 0 3px #E9C46A}
@media (orientation:portrait){
  :root{--pw:clamp(96px,27vw,170px)}
  .counter{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"seat seat seat" "tea stack slot";grid-template-rows:1.15fr 1fr}
  .seat{width:min(100%,calc(var(--pw)*2.4))}
  .stack{width:min(100%,calc(var(--pw)*1.15))}}
@media (orientation:landscape) and (max-height:520px){.app{gap:3px}.kitchen{padding-top:12px}.noren{height:10px}.tip{font-size:14px;min-height:0}:root{--pw:clamp(70px,min(10vw,22vh),110px)}.chef{display:none}.counter{padding:4px 10px 6px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1>迴轉壽司</h1><button class="pill" id="bookBtn" type="button">📒 收藏冊 <b id="bookN">0</b></button></header>
  <div class="tip" id="tip"></div>
  <div class="shop" id="shop">
    <div class="kitchen">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="chef" id="chef"></div>
      <div class="belt" id="belt"><div class="track" id="track"></div><div class="lane" id="lane"></div></div>
    </div>
    <div class="counter" id="counter">
      <div class="tea" id="tea" role="button" aria-label="喝茶"></div>
      <div class="seat" id="seat"><div class="mat"></div><div class="dish" id="dish" role="button" aria-label="吃壽司"></div></div>
      <div class="stack" id="stack" aria-label="空盤子"></div>
      <div class="slot" id="slot" role="button" aria-label="送盤口"></div>
    </div>
  </div>
</div>
<div class="over" id="over" hidden></div>
<script src="voice.js"></script>
<script>
/* ================= 聲音 ================= */
let ac=null;
function A(){if(!ac){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,{type='triangle',v=.12,at=0,to=null}={}){const c=A();if(!c)return;try{const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,{at=0,v=.1,f=900,q=1}={}){const c=A();if(!c)return;try{const t=c.currentTime+at,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(c.destination);s.start(t)}catch(e){}}
const S={
  pick(){tone(600,.15,{to:1000,v:.1});noise(.25,{at:.05,v:.05,f:2500})},
  land(){tone(1400,.12,{type:'sine',v:.08});tone(1900,.18,{at:.04,type:'sine',v:.05})},
  chomp(){[0,.3,.6].forEach(a=>{noise(.12,{at:a,v:.18,f:500,q:.7});tone(180,.08,{at:a,type:'sine',v:.08})})},
  yum(){[659,784,1046].forEach((f,i)=>tone(f,.25,{at:i*.09,v:.08}))},
  clink(){tone(2100,.2,{type:'sine',v:.08});tone(2800,.15,{at:.03,type:'sine',v:.05})},
  slot(){noise(.2,{v:.15,f:700});tone(300,.25,{at:.08,type:'square',v:.05,to:150});tone(1046,.2,{at:.3,v:.08})},
  no(){tone(260,.2,{type:'sine',v:.1})},
  sip(){noise(.5,{v:.06,f:1200,q:.5});tone(400,.2,{at:.5,type:'sine',v:.06,to:300})},
  ratchet(){for(let i=0;i<8;i++)tone(900,.04,{at:i*.11,type:'square',v:.05})},
  drop(){tone(500,.3,{to:200,v:.1});[0,.35,.6].forEach((a,i)=>tone(700-i*120,.08,{at:.6+a,type:'sine',v:.1}))},
  open(){noise(.15,{v:.15,f:3000});tone(500,.25,{at:.05,to:1400,v:.1})},
  win(){[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.45,{at:i*.1}))},
  rare(){[784,988,1175,1568,1976].forEach((f,i)=>{tone(f,.6,{at:i*.12});tone(f*1.5,.4,{at:i*.12+.05,type:'sine',v:.05})})},
  lose(){[523,494,440].forEach((f,i)=>tone(f,.35,{at:i*.18,v:.08}))},
  tap(){tone(660,.08,{v:.1})}
};
function talk(x){if(window.KV)KV.say(x)}

/* ================= 圖 ================= */
const SUSHI={
  salmon:{n:'鮭魚握壽司'},tuna:{n:'鮪魚握壽司'},tamago:{n:'玉子燒'},ebi:{n:'鮮蝦握壽司'},tako:{n:'章魚握壽司'},unagi:{n:'鰻魚握壽司'},
  ikura:{n:'鮭魚卵軍艦'},corn:{n:'玉米軍艦'},kappa:{n:'小黃瓜捲'},inari:{n:'豆皮壽司'},pudding:{n:'布丁'}};
const KINDS=Object.keys(SUSHI);
const RIMS=['#8FB7CC','#D9958F','#D9BE6A','#97B988'];
const rice=cx=>`<rect x="${cx-20}" y="35" width="40" height="17" rx="8.5" fill="#F3EDE1"/><ellipse cx="${cx}" cy="37" rx="19" ry="6" fill="#FFFFFF"/><path d="M${cx-15} 47 h4M${cx+4} 44 h4M${cx-4} 49 h3" stroke="#E3DCCD" stroke-width="1.5" stroke-linecap="round"/>`;
const topping=(cx,c)=>`<path d="M${cx-24} 41 Q${cx-23} 25 ${cx} 24 Q${cx+23} 25 ${cx+24} 41 Q${cx} 46 ${cx-24} 41Z" fill="${c}"/>`;
function nigiri(cx,k){let s=rice(cx);
  if(k==='salmon')s+=topping(cx,'#EE9E78')+`<path d="M${cx-16} 30 q8 4 16 2M${cx-19} 36 q10 4 22 2M${cx-8} 27 q6 3 14 2" stroke="#FBE3D6" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if(k==='tuna')s+=topping(cx,'#C76B6E')+`<path d="M${cx-12} 30 q10 -3 20 0" stroke="#E29A9A" stroke-width="2" fill="none" opacity=".7"/>`;
  if(k==='tamago')s+=`<rect x="${cx-23}" y="22" width="46" height="20" rx="5" fill="#F1D06C"/><rect x="${cx-23}" y="22" width="46" height="5" rx="3" fill="#E3B54E"/><rect x="${cx-5}" y="20" width="10" height="30" fill="#3E4A44"/>`;
  if(k==='ebi')s+=topping(cx,'#F6E3D4')+`<path d="M${cx-18} 33 q6 -6 12 0M${cx-6} 31 q6 -6 12 0M${cx+6} 33 q6 -6 12 0" stroke="#EE8E62" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M${cx+20} 30 l12 -8 -2 12z" fill="#E07A5F"/>`;
  if(k==='tako')s+=topping(cx,'#F2E4E3')+`<path d="M${cx-22} 34 Q${cx-20} 24 ${cx} 23.5 Q${cx+20} 24 ${cx+22} 34 Q${cx} 28 ${cx-22} 34Z" fill="#B9667A"/>`+[-12,0,12].map(d=>`<circle cx="${cx+d}" cy="36" r="2.4" fill="#E6C9CE"/>`).join('');
  if(k==='unagi')s+=topping(cx,'#9A6440')+`<path d="M${cx-18} 32 q18 -8 36 0" stroke="#C48A5C" stroke-width="2.4" fill="none"/><path d="M${cx-14} 28 q8 -2 14 0" stroke="#E7C3A0" stroke-width="2" fill="none"/><rect x="${cx-4}" y="22" width="8" height="28" fill="#3E4A44"/>`;
  return s}
function gunkan(cx,k){let s=`<rect x="${cx-18}" y="30" width="36" height="23" rx="8" fill="#3E4A44"/><path d="M${cx-12} 34 v15" stroke="#56635C" stroke-width="3" stroke-linecap="round"/><ellipse cx="${cx}" cy="31" rx="18" ry="6" fill="#4D5A53"/>`;
  const pts=[[-9,28],[0,27],[9,28],[-4,24],[5,24],[-12,31],[12,31],[0,21]];
  if(k==='ikura')s+=pts.map(([x,y])=>`<circle cx="${cx+x}" cy="${y}" r="4.6" fill="#E8743B"/><circle cx="${cx+x-1.4}" cy="${y-1.6}" r="1.4" fill="#FCD3B5"/>`).join('');
  else s+=`<ellipse cx="${cx}" cy="28" rx="15" ry="6" fill="#F4E9C8"/>`+pts.map(([x,y])=>`<ellipse cx="${cx+x}" cy="${y}" rx="3.6" ry="3" fill="#F1C94E"/>`).join('');
  return s}
function sushiSVG(k,rim){let food='';
  if(['salmon','tuna','tamago','ebi','tako','unagi'].includes(k))food=nigiri(44,k)+nigiri(78,k);
  else if(k==='ikura'||k==='corn')food=gunkan(44,k)+gunkan(78,k);
  else if(k==='kappa')food=[36,60,84].map(cx=>`<rect x="${cx-12}" y="34" width="24" height="16" rx="4" fill="#3E4A44"/><ellipse cx="${cx}" cy="34" rx="12" ry="9" fill="#3E4A44"/><ellipse cx="${cx}" cy="33.5" rx="9.5" ry="6.8" fill="#F6F1E7"/><circle cx="${cx}" cy="33.5" r="3.4" fill="#8FB283"/>`).join('');
  else if(k==='inari')food=[44,78].map(cx=>`<path d="M${cx-21} 50 Q${cx-23} 30 ${cx} 27 Q${cx+23} 30 ${cx+21} 50 Q${cx} 56 ${cx-21} 50Z" fill="#C9925A"/><path d="M${cx-14} 36 q14 -6 28 0" stroke="#B07C48" stroke-width="2" fill="none"/><ellipse cx="${cx}" cy="30" rx="12" ry="4" fill="#DDAE78"/>`).join('');
  else if(k==='pudding')food=`<path d="M42 52 L47 26 H73 L78 52Z" fill="#F2D79A"/><path d="M47 26 Q60 20 73 26 L72 33 Q60 29 48 33Z" fill="#A8683E"/><ellipse cx="60" cy="21" rx="9" ry="5" fill="#FFFFFF"/><circle cx="60" cy="14" r="5" fill="#D8584E"/><path d="M60 10 q3 -5 7 -6" stroke="#6E9A66" stroke-width="1.6" fill="none"/>`;
  return `<svg viewBox="0 0 120 84"><ellipse cx="60" cy="60" rx="57" ry="18" fill="${rim}"/><ellipse cx="60" cy="58" rx="47" ry="12.5" fill="#FBF8F2"/><ellipse cx="60" cy="72" rx="30" ry="4" fill="rgba(0,0,0,.08)"/><g class="food">${food}</g></svg>`}
const emptyPlate=rim=>`<svg viewBox="0 0 120 84"><ellipse cx="60" cy="60" rx="57" ry="18" fill="${rim}"/><ellipse cx="60" cy="58" rx="47" ry="12.5" fill="#FBF8F2"/><circle cx="48" cy="56" r="1.6" fill="#F0E9DC"/><circle cx="70" cy="59" r="1.4" fill="#F0E9DC"/></svg>`;
const sidePlate=rim=>`<svg viewBox="0 0 120 26"><path d="M4 8 Q60 30 116 8 L108 20 Q60 32 12 20Z" fill="${rim}"/><ellipse cx="60" cy="8" rx="56" ry="7" fill="${rim}"/><ellipse cx="60" cy="8" rx="46" ry="4.6" fill="#FBF8F2"/></svg>`;
const $=id=>document.getElementById(id);
$('tea').innerHTML=`<svg viewBox="0 0 100 110">${[38,50,62].map((x,i)=>`<g class="steam" style="animation-delay:${i*.7}s;transform-box:fill-box"><path d="M${x} 30 q-6 -9 0 -18 q6 -9 0 -18" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/></g>`).join('')}<g id="cup" style="transform-box:fill-box;transform-origin:50% 100%"><path d="M22 40 H78 L72 100 Q50 108 28 100Z" fill="#8FB283"/><ellipse cx="50" cy="40" rx="28" ry="7" fill="#A9C99A"/><ellipse cx="50" cy="41" rx="23" ry="5" fill="#C9B26A"/><path d="M30 62 h40" stroke="#7FA676" stroke-width="3"/><text x="50" y="86" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">茶</text></g></svg>`;

const prizeSVG=p=>`<svg viewBox="0 0 100 100">${p.s}</svg>`;

/* ================= 狀態 ================= */
let st={seat:null,seatRim:RIMS[0],stack:[],slot:0,eaten:{},prizes:{}};
try{const s=JSON.parse(localStorage.getItem('sushiState')||'null');if(s)st={...st,...s}}catch(e){}
function save(){try{localStorage.setItem('sushiState',JSON.stringify(st))}catch(e){}}
const tipEl=$('tip');function tip(t){tipEl.textContent=t}
let busy=false,eating=false;

/* ================= 輸送帶 ================= */
const lane=$('lane'),belt=$('belt');
let slots=[],L=0,off=0,spacing=0,pw=0,lastT=0;
function buildBelt(){const bw=belt.getBoundingClientRect().width;
  const probe=document.createElement('div');probe.className='bp';lane.appendChild(probe);pw=probe.getBoundingClientRect().width||120;probe.remove();
  spacing=pw*1.42;const n=Math.ceil((bw+pw*2)/spacing)+1;L=n*spacing;
  const old=slots;lane.innerHTML='';slots=[];
  for(let i=0;i<n;i++){const o=old[i];const k=o?o.k:(Math.random()<.78?KINDS[Math.floor(Math.random()*KINDS.length)]:null);const rim=o?o.rim:RIMS[i%4];
    const el=document.createElement('div');el.className='bp';el.dataset.i=i;lane.appendChild(el);const s={k,rim,el,x:0};slots.push(s);paintSlot(s);
    el.addEventListener('pointerdown',e=>{e.preventDefault();take(s)})}}
function paintSlot(s){s.el.innerHTML=s.k?sushiSVG(s.k,s.rim):'';s.el.style.visibility=s.k?'visible':'hidden';s.el.setAttribute('aria-label',s.k?SUSHI[s.k].n:'')}
function moveBelt(dt){const sp=pw*.42;off=(off+sp*dt)%L;$('track').style.backgroundPosition=`${off%50}px 0`;
  slots.forEach((s,i)=>{const x=((i*spacing+off)%L)-pw;if(x<s.x-10&&!s.k&&Math.random()<.85){s.k=KINDS[Math.floor(Math.random()*KINDS.length)];paintSlot(s)}s.x=x;s.el.style.transform=`translateX(${x}px)`})}

/* ================= 拿壽司、吃 ================= */
const dishEl=$('dish');
function paintSeat(){dishEl.innerHTML=st.seat?sushiSVG(st.seat,st.seatRim):'';dishEl.style.visibility=st.seat?'visible':'hidden';dishEl.setAttribute('aria-label',st.seat?'吃'+SUSHI[st.seat].n:'')}
function flyEl(html,from,to,{w,dur=650,lift=80,rot=0}){const f=document.createElement('div');f.className='fly';f.style.width=w+'px';f.innerHTML=html;document.body.appendChild(f);
  const fx=from.left+from.width/2-w/2,fy=from.top+from.height/2-w*.35,tx=to.left+to.width/2-w/2,ty=to.top+to.height/2-w*.35;
  const a=f.animate([{transform:`translate(${fx}px,${fy}px)`},{transform:`translate(${(fx+tx)/2}px,${Math.min(fy,ty)-lift}px) rotate(${rot}deg) scale(1.08)`},{transform:`translate(${tx}px,${ty}px)`}],{duration:dur,easing:'cubic-bezier(.35,.1,.3,1)'});
  return a.finished.then(()=>f.remove())}
function take(s){A();if(!s.k||busy)return;
  if(st.seat||eating){S.no();tip('先把桌上的吃完喔');talk('先把桌上的吃完喔');dishEl.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});return}
  busy=true;const k=s.k,rim=s.rim,r=s.el.getBoundingClientRect();s.k=null;paintSlot(s);S.pick();
  const dr=$('seat').getBoundingClientRect();const tw=dishEl.getBoundingClientRect().width||dr.width*.78;
  flyEl(sushiSVG(k,rim),r,{left:dr.left,top:dr.top+dr.height*.18,width:dr.width,height:dr.height*.8},{w:tw}).then(()=>{st.seat=k;st.seatRim=rim;save();paintSeat();S.land();busy=false;tip('點一下壽司,吃掉它!');talk(SUSHI[k].n+',請慢用')})}
dishEl.addEventListener('pointerdown',e=>{e.preventDefault();eat()});
function eat(){A();if(!st.seat||eating)return;eating=true;const k=st.seat,rim=st.seatRim;S.chomp();
  dishEl.classList.add('chomp');const b=document.createElement('div');b.className='bubble';b.textContent='啊嗚~';$('seat').appendChild(b);
  setTimeout(()=>{b.textContent='好好吃!';S.yum()},700);
  setTimeout(()=>{b.remove();dishEl.classList.remove('chomp');st.eaten[k]=(st.eaten[k]||0)+1;st.seat=null;st.stack.push(rim);
    dishEl.innerHTML=emptyPlate(rim);dishEl.style.visibility='visible';save();
    setTimeout(()=>{const from=dishEl.getBoundingClientRect();dishEl.style.visibility='hidden';st.stack.pop();const to=topSlotRect();st.stack.push(rim);
      flyEl(sidePlate(rim),{left:from.left,top:from.top+from.height*.4,width:from.width,height:from.height*.3},to,{w:to.width,dur:520,lift:50}).then(()=>{paintStack();S.clink();eating=false;paintSeat();hint()})},350)},1150)}
$('tea').addEventListener('pointerdown',e=>{e.preventDefault();A();const c=$('cup');c.classList.remove('sip');void c.getBoundingClientRect();c.classList.add('sip');S.sip()});

/* ================= 盤子疊 ================= */
const stackEl=$('stack');
function gapFor(n,h,pw2){const ph=pw2*26/120;const g=Math.min(ph*.55,(h-ph-22)/Math.max(1,n-1));return Math.max(3,g)}
function paintStack(){const n=st.stack.length,r=stackEl.getBoundingClientRect(),ph=r.width*26/120,g=gapFor(n,r.height,r.width);
  stackEl.innerHTML=st.stack.map((rim,i)=>`<div class="sp${i===n-1?' top':''}" style="bottom:${18+i*g}px;z-index:${i+1}">${sidePlate(rim)}</div>`).join('')+(n?`<div class="n">${n} 個盤子</div>`:'<div class="n">空盤放這裡</div>');
  const tp=stackEl.querySelector('.top');if(tp)tp.addEventListener('pointerdown',dragStart)}
function topSlotRect(){const r=stackEl.getBoundingClientRect(),n=st.stack.length,g=gapFor(n+1,r.height,r.width),ph=r.width*26/120;return {left:r.left,top:r.bottom-18-n*g-ph,width:r.width,height:ph}}

/* 拖到送盤口 */
let drag=null;
function dragStart(e){e.preventDefault();A();if(drag||st.slot>=5)return;const el=e.currentTarget,r=el.getBoundingClientRect();
  const g=document.createElement('div');g.className='fly';g.style.width=r.width+'px';g.innerHTML=sidePlate(st.stack[st.stack.length-1]);document.body.appendChild(g);
  el.style.visibility='hidden';drag={id:e.pointerId,g,el,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width};
  g.style.transform=`translate(${r.left}px,${r.top}px) scale(1.1)`;
  try{stackEl.setPointerCapture(e.pointerId)}catch(_){}S.tap()}
stackEl.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.g.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) scale(1.1)`;
  $('slot').classList.toggle('hot',over(e.clientX,e.clientY))});
function over(x,y){const r=$('slot').getBoundingClientRect(),m=40;return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m}
function dragEnd(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;$('slot').classList.remove('hot');
  if(e.type!=='pointercancel'&&over(e.clientX,e.clientY)){const sr=$('slot').querySelector('.mouth').getBoundingClientRect();const gr=d.g.getBoundingClientRect();
    d.g.animate([{transform:`translate(${gr.left}px,${gr.top}px) scale(1.1)`},{transform:`translate(${sr.left+sr.width/2-d.w/2}px,${sr.top}px) scale(.6)`,opacity:.2}],{duration:280,easing:'ease-in'}).finished.then(()=>d.g.remove());
    st.stack.pop();st.slot++;save();S.slot();paintStack();paintSlotBox();
    const fl=$('slot').querySelector('#flap');fl&&fl.animate([{transform:'translateY(0)'},{transform:'translateY(10px)'},{transform:'translateY(0)'}],{duration:400});
    if(st.slot>=5){tip('集滿五個盤子了!');talk('集滿五個盤子,扭蛋時間');setTimeout(gacha,900)}else{tip('送盤口 '+st.slot+' / 5');hint()}}
  else{const r=d.el.getBoundingClientRect();d.g.animate([{transform:d.g.style.transform},{transform:`translate(${r.left}px,${r.top}px)`}],{duration:250}).finished.then(()=>{d.g.remove();d.el.style.visibility='visible'});if(e.type!=='pointercancel'){tip('把盤子拖到送盤口喔')}}}
stackEl.addEventListener('pointerup',dragEnd);stackEl.addEventListener('pointercancel',dragEnd);stackEl.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id)dragEnd({type:'pointercancel',pointerId:e.pointerId})});
function paintSlotBox(){const ready=st.slot>=5;$('slot').innerHTML=slotSVG(Math.min(5,st.slot),ready);$('slot').classList.toggle('ready',ready);$('bookN').textContent=Object.keys(st.prizes).length+'/'+PRIZES.length}
$('slot').addEventListener('click',()=>{A();if(st.slot>=5)gacha();else if(st.stack.length){tip('按住盤子,拖進送盤口');talk('按住盤子,拖進送盤口')}else{tip('先吃壽司,空盤子才能送進來')}});
let arrowEl=null;
function hint(){arrowEl&&arrowEl.remove();arrowEl=null;
  if(st.slot>=5){tip('送盤口亮了!點它抽扭蛋');return}
  if(st.stack.length&&!st.seat){const sr=stackEl.getBoundingClientRect(),cr=$('counter').getBoundingClientRect(),lr=$('slot').getBoundingClientRect();
    arrowEl=document.createElement('div');arrowEl.className='arrow';arrowEl.textContent='👉';arrowEl.style.left=(Math.min(sr.right,lr.left-40)-cr.left)+'px';arrowEl.style.top=(lr.top-cr.top+lr.height*.45)+'px';$('counter').appendChild(arrowEl);
    tip('把空盤子拖到送盤口,集滿五個可以抽扭蛋')}
  else if(!st.seat)tip('點一下經過的壽司,拿到桌上吃')}

/* ================= 扭蛋 ================= */
const over_=$('over');const CAPC=['#D88E87','#6F9FC0','#E9C46A','#7FB08A','#C9B6E4'];
function gacha(){if(st.slot<5)return;busy=true;over_.hidden=false;
  over_.innerHTML=`<h2>扭蛋時間!</h2><p>點轉盤,轉一下</p><div class="machine" id="mach">${machineSVG()}</div>`;talk('點轉盤,轉一下');
  let turned=false;$('mach').onclick=()=>{if(turned)return;turned=true;A();S.ratchet();$('mach').classList.add('turn');
    setTimeout(()=>{S.drop();const c=CAPC[Math.floor(Math.random()*CAPC.length)];over_.innerHTML=`<h2>掉出一顆扭蛋!</h2><p>點扭蛋打開看看</p><div class="capbig" id="cap"><div class="cap drop" style="display:block">${capSVG(c)}</div></div>`;
      setTimeout(()=>{const cp=$('cap').querySelector('.cap');cp.classList.remove('drop');cp.classList.add('shake')},950);
      let opened=false;$('cap').onclick=()=>{if(opened)return;opened=true;A();S.open();$('cap').querySelector('.cap').classList.remove('shake');$('cap').classList.add('open');setTimeout(()=>reveal(),650)}},1000)}}
function pickPrize(){const tot=PRIZES.reduce((a,p)=>a+p.w,0);let r=Math.random()*tot;for(const p of PRIZES){r-=p.w;if(r<0)return p}return PRIZES[0]}
function reveal(){st.slot=0;const win=Math.random()<.62;let html;
  if(win){const p=pickPrize(),isNew=!st.prizes[p.id];st.prizes[p.id]=(st.prizes[p.id]||0)+1;
    html=`<h2 class="${p.rare?'rare':''}">${p.rare?'✨ 超稀有!':'中獎了!'}</h2><div class="prize">${prizeSVG(p)}</div><p style="font-size:24px;color:var(--ink)">${p.n}${isNew?' · 新的!':' · 第 '+st.prizes[p.id]+' 個'}</p>`;
    (p.rare?S.rare:S.win)();sparks();talk((p.rare?'哇,超稀有,':'恭喜中獎,')+'得到'+p.n)}
  else{html=`<h2>沒中獎</h2><div class="prize"><svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="34" fill="#F4EEE2"/>${eye(38,46)}${eye(62,46)}<path d="M40 64 q10 -6 20 0" stroke="#4A4552" stroke-width="3" fill="none" stroke-linecap="round"/><text x="50" y="96" text-anchor="middle" font-size="12" font-weight="900" fill="#6E6876">再接再厲</text></svg></div><p>再收集五個盤子,再抽一次!</p>`;S.lose();talk('沒中獎,再接再厲')}
  save();paintSlotBox();
  over_.innerHTML=html+`<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="big" id="goOn" type="button">繼續吃</button><button class="big alt" id="toBook" type="button">📒 收藏冊</button></div>`;
  $('goOn').onclick=()=>{S.tap();closeOver()};$('toBook').onclick=()=>{S.tap();book('prize')}}
function closeOver(){over_.hidden=true;over_.innerHTML='';busy=false;hint()}
function sparks(){const c=['#D88E87','#6F9FC0','#E9C46A','#7FB08A','#C9B6E4'];for(let i=0;i<28;i++){const d=document.createElement('div');d.className='spark';d.style.background=c[i%5];d.style.left=innerWidth/2+'px';d.style.top=innerHeight*.45+'px';document.body.appendChild(d);
  const a=Math.random()*6.28,r=100+Math.random()*Math.min(innerWidth,520)*.5;d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+80}px) rotate(${Math.random()*600}deg)`,opacity:0}],{duration:1200+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>d.remove()}}

/* ================= 收藏冊 ================= */
function book(tab='prize'){busy=true;over_.hidden=false;const got=Object.keys(st.prizes).length,ate=KINDS.filter(k=>st.eaten[k]).length,tot=Object.values(st.eaten).reduce((a,b)=>a+b,0);
  const grid=tab==='prize'?PRIZES.map(p=>{const n=st.prizes[p.id]||0;return `<div class="it${n?'':' no'}${p.rare?' gold':''}">${n>1?`<span class="c">×${n}</span>`:''}${prizeSVG(p)}<span>${n?p.n:'???'}</span></div>`}).join('')
    :KINDS.map(k=>{const n=st.eaten[k]||0;return `<div class="it${n?'':' no'}">${n?`<span class="c">×${n}</span>`:''}${sushiSVG(k,RIMS[KINDS.indexOf(k)%4])}<span>${n?SUSHI[k].n:'還沒吃過'}</span></div>`}).join('');
  over_.innerHTML=`<div class="book"><h2>📒 收藏冊</h2><div class="tabs"><button class="tab${tab==='prize'?' on':''}" data-t="prize" type="button">扭蛋 ${got}/${PRIZES.length}</button><button class="tab${tab==='sushi'?' on':''}" data-t="sushi" type="button">壽司圖鑑 ${ate}/${KINDS.length}</button></div>
    ${tab==='sushi'?`<p>一共吃了 ${tot} 盤</p>`:'<p>集滿五個盤子可以抽一次,金色的是超稀有</p>'}<div class="grid">${grid}</div><div><button class="big" id="bk" type="button">回到座位</button></div></div>`;
  over_.scrollTop=0;over_.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tap();book(b.dataset.t)});$('bk').onclick=()=>{S.tap();closeOver()}}
$('bookBtn').onclick=()=>{A();S.tap();book('prize')};

/* ================= 開始 ================= */
function frame(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;moveBelt(dt);requestAnimationFrame(frame)}
function layout(){buildBelt();paintStack();hint()}
let rt=null;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
paintSeat();paintSlotBox();
requestAnimationFrame(()=>{layout();requestAnimationFrame(frame);if(st.slot>=5)setTimeout(gacha,600)});
talk('歡迎光臨,點一下經過的壽司');
document.addEventListener('visibilitychange',()=>{if(document.hidden&&drag){dragEnd({type:'pointercancel',pointerId:drag.id})}});
</script>
</body>
</html>
