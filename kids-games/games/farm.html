<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快樂農場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* 快樂農場:地圖選區域 → 果菜園(播種、澆水、採收)、牧場(餵草、洗澡、長大擠奶)、雞舍(孵蛋、餵飼料、收蛋)、市場(裝車出貨賺錢)。
   扁平圖形、低刺激配色,按鈕都離底部遠一點。 */
:root{
  --ink:#4A4552; --bg:#EFE6D8; --white:#FFFFFF; --grass:#B9D2A8; --grass-d:#9DBE8A; --soil:#9C7A5B; --soil-d:#8A6A4D;
  --sky:#E3EEDF; --ok:#7FB08A; --ok-d:#5E8F69; --gold:#E9C46A; --mute:#6E6876;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(44px + env(safe-area-inset-bottom,0px));max-width:1300px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
.ib{all:unset;cursor:pointer;flex:none;width:48px;height:48px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 3px 0 rgba(74,69,82,.15)}
.ib svg{width:26px;height:26px}
h1{margin:0;font-size:clamp(20px,5.2vw,30px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pills{margin-left:auto;display:flex;gap:8px;flex:none}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;background:var(--white);border-radius:999px;padding:6px 14px 6px 8px;font-weight:900;font-size:19px;box-shadow:0 3px 0 rgba(74,69,82,.15);white-space:nowrap}
.pill svg{width:30px;height:30px}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.2)}60%{transform:scale(.94)}}
.ib:active,.pill:active,.tbtn:active,.card:active,.big:active{transform:translateY(2px)}
button:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.tip{text-align:center;font-weight:700;font-size:clamp(15px,4vw,19px);color:var(--mute);min-height:1.4em}
.stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px}
/* 地圖 */
.map{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:safe center;overflow-y:auto;touch-action:pan-y;padding:2px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--white);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 rgba(74,69,82,.14);display:flex;flex-direction:column;position:relative}
.card .pic{aspect-ratio:16/10;max-width:100%;display:block}
.card .pic>svg{width:100%;height:100%;display:block}
.card b{padding:8px 14px 12px;font-size:clamp(19px,4.8vw,26px)}
.card .dot{position:absolute;top:10px;right:10px;background:var(--gold);color:var(--ink);font-weight:900;border-radius:999px;padding:2px 10px;font-size:15px;box-shadow:0 2px 0 rgba(74,69,82,.15)}
/* 工具列(放上方,不靠底部) */
.tools{flex:none;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.tbtn{all:unset;box-sizing:border-box;cursor:pointer;min-width:96px;padding:8px 16px;border-radius:20px;background:var(--white);display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(17px,4.4vw,21px);box-shadow:0 4px 0 rgba(74,69,82,.14)}
.tbtn svg{width:40px;height:40px;flex:none}
.tbtn.on{background:#FFF4D6;box-shadow:0 4px 0 #E3CF97}
.tbtn[disabled]{opacity:.4;cursor:default}
.stats{flex:none;display:flex;justify-content:center;gap:16px;font-weight:900;color:var(--mute);font-size:16px;align-items:center;flex-wrap:wrap}
.stats span{display:flex;align-items:center;gap:4px}
.stats svg{width:24px;height:24px}
.stats .off{opacity:.25}
/* 果菜園 */
.plots{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.plot{position:relative;border-radius:24px;background:var(--sky);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;touch-action:manipulation}
.plot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--grass);z-index:0}
.plot svg.pv{position:relative;z-index:1;flex:1;min-height:0;width:100%;display:block}
.plot .nm{position:absolute;left:10px;top:8px;z-index:2;background:rgba(255,255,255,.85);border-radius:999px;padding:2px 12px;font-weight:900;font-size:16px}
.bub{position:absolute;right:8px;top:6px;z-index:3;width:54px;height:54px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 3px 0 rgba(74,69,82,.14);animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.bub svg{width:70%;height:70%}
@keyframes bob{50%{transform:translateY(-5px)}}
.fruit{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:popin .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes popin{from{transform:scale(0)}}
.pv.grow{animation:grow .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{0%{transform:scale(.9,.8);transform-origin:50% 100%}100%{transform:none}}
.act{position:absolute;z-index:4;width:44%;aspect-ratio:1;left:28%;top:6%;pointer-events:none}
.act svg{width:100%;height:100%;overflow:visible}
.act.seed svg{animation:shake .25s ease-in-out 3 alternate}
@keyframes shake{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.act.water svg{transform-origin:70% 60%;animation:pour .9s ease-in-out forwards}
@keyframes pour{0%{transform:rotate(0)}30%,80%{transform:rotate(-32deg)}100%{transform:rotate(0)}}
.drop{position:absolute;z-index:4;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8FBCCB;pointer-events:none;animation:fall .6s ease-in forwards}
@keyframes fall{to{transform:translateY(90px);opacity:0}}
.seedf{position:absolute;z-index:4;width:9px;height:7px;border-radius:50%;background:#B48E5E;pointer-events:none;animation:fall .5s ease-in forwards}
/* 牧場、雞舍 */
.scene{flex:1;min-height:0;position:relative;touch-action:none;border-radius:26px;overflow:hidden;background:linear-gradient(var(--sky) 0 42%,var(--grass) 42%)}
.scene .fence{position:absolute;left:0;right:0;top:30%;height:16%;opacity:.8}
.scene .fence svg{width:100%;height:100%}
.hero{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);touch-action:none;cursor:pointer}
.hero svg{width:100%;height:100%;display:block;overflow:visible}
.cow{width:min(96%,calc(var(--sh,400px)*1.15));aspect-ratio:200/150}
.bird{width:min(60%,calc(var(--sh,400px)*.75));aspect-ratio:1}
.hero.jump{animation:jump .5s}
@keyframes jump{40%{transform:translateX(-50%) translateY(-12%)}}
.hero.wig{animation:wig .4s}
@keyframes wig{25%{transform:translateX(-50%) rotate(-5deg)}75%{transform:translateX(-50%) rotate(5deg)}}
.hero.growup{animation:bigger 1.2s ease-in-out}
@keyframes bigger{30%{transform:translateX(-50%) scale(.85)}60%{transform:translateX(-50%) scale(1.12)}}
.chew .muz{animation:chew .25s ease-in-out 6 alternate}
@keyframes chew{to{transform:translateY(3px)}}
.peck .headg{animation:peck .22s ease-in-out 6 alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes peck{to{transform:rotate(-28deg) translateY(10px)}}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 22%,rgba(255,255,255,.75) 23% 60%,rgba(220,235,242,.85) 61%);box-shadow:inset 0 0 0 2px rgba(169,207,220,.6);pointer-events:none;animation:popin .3s}
.bubble.go{transition:transform .4s,opacity .4s;transform:scale(1.4);opacity:0}
.sponge{position:absolute;z-index:8;width:70px;height:56px;margin:-28px 0 0 -35px;pointer-events:none}
.rain{position:absolute;z-index:7;pointer-events:none;width:6px;height:16px;border-radius:3px;background:#8FBCCB;animation:rain .7s linear forwards}
@keyframes rain{from{transform:translateY(-40px)}to{transform:translateY(260px);opacity:.2}}
.spark{position:absolute;z-index:9;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:none;animation:spark 1s ease-out forwards}
.spark svg{width:100%;height:100%}
@keyframes spark{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.1) rotate(30deg);opacity:1}100%{transform:scale(.6) rotate(60deg);opacity:0}}
.bucket{position:absolute;z-index:5;width:80px;height:80px;margin-left:-40px;pointer-events:auto;cursor:pointer;animation:popin .4s}
.bucket svg{width:100%;height:100%}
.milkd{position:absolute;z-index:6;width:8px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1.5px #DCE2E6;pointer-events:none}
.egg-drop{position:absolute;z-index:5;width:clamp(70px,12vmin,110px);aspect-ratio:1;transform:translate(-50%,-50%);cursor:pointer;animation:eggpop .6s cubic-bezier(.3,1.6,.5,1)}
.egg-drop svg{width:100%;height:100%}
@keyframes eggpop{from{transform:translate(-90%,-120%) scale(.2)}}
.feed{position:absolute;z-index:4;width:12px;height:9px;border-radius:50%;background:#C9A26A;pointer-events:none;transition:transform .5s cubic-bezier(.3,.8,.5,1),opacity .4s}
/* 寫實種植 */
.crops .card .pic{aspect-ratio:13/10}
.steps{flex:none;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.steps span{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.5);font-weight:900;font-size:clamp(13px,3.4vw,16px);color:#B5ADA2}
.steps span.done{background:#fff;color:var(--mute)}
.steps span.now{background:var(--ok);color:#fff}
.gscene{flex:1;min-height:0;position:relative;border-radius:26px;overflow:hidden;background:#E3EEDF;cursor:pointer;touch-action:none}
.gscene svg.plant{position:absolute;inset:4% 0 0 0;width:100%;height:96%;overflow:visible}
.gscene svg.plant.grow{animation:grow .7s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 72%}
.prop{position:absolute;bottom:4%;width:clamp(64px,16vmin,120px);aspect-ratio:1;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 0 rgba(74,69,82,.15))}
.prop svg{width:100%;height:100%;overflow:visible}
.prop.bag{left:5%}.prop.can{right:5%}
.sun{position:absolute;right:4%;top:4%;width:clamp(56px,13vmin,96px);aspect-ratio:1;z-index:1;pointer-events:none}
.sun svg{width:100%;height:100%}
.sun.shine{animation:shine 1.4s ease-in-out}
@keyframes shine{30%,70%{transform:scale(1.5) rotate(30deg)}}
.warm{position:absolute;inset:0;background:radial-gradient(circle at 90% 8%,rgba(244,222,158,.65),transparent 70%);opacity:0;pointer-events:none;z-index:2}
.warm.on{animation:warm 1.4s ease-in-out}
@keyframes warm{40%,70%{opacity:1}}
.bee{position:absolute;left:0;top:0;width:clamp(48px,10vmin,72px);aspect-ratio:9/7;z-index:5;pointer-events:none}
.bee svg{width:100%;height:100%;animation:flap .12s linear infinite alternate}
@keyframes flap{to{transform:translateY(-3px)}}
.gscene .drop{animation-duration:.8s}
.gscene svg.plant.windy{animation:windy .4s ease-in-out 4 alternate;transform-origin:50% 68%}
@keyframes windy{from{transform:skewX(-5deg)}to{transform:skewX(5deg)}}
.gust{position:absolute;left:-30%;width:30%;height:3px;border-radius:2px;background:rgba(255,255,255,.9);pointer-events:none;z-index:4;animation:gust 1s linear forwards}
@keyframes gust{to{transform:translateX(450%)}}
/* 商店 */
.shop{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stockbar{flex:none;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);border-radius:20px;padding:6px 10px;min-height:64px}
.stockbar>b{flex:none;font-size:16px;color:var(--mute);writing-mode:vertical-rl;letter-spacing:2px}
.stock{flex:1;display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;align-items:center}
.sk{all:unset;cursor:pointer;flex:none;background:var(--white);border-radius:16px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:2px;font-weight:900;font-size:18px;box-shadow:0 3px 0 rgba(74,69,82,.12)}
.sk svg{width:46px;height:46px}
.sk:active{transform:translateY(2px)}
.shopscene{flex:1;min-height:0;position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(#F4EEE2 0 58%,#E6DCCB 58%);display:flex;flex-direction:column}
.rack{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px 16px;background:linear-gradient(transparent calc(100% - 12px),#C9A97A calc(100% - 12px))}
.slot2{all:unset;box-sizing:border-box;cursor:pointer;position:relative;aspect-ratio:1/1;max-height:22vh;border-radius:16px;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;overflow:hidden}
.slot2.none{background:transparent;border:3px dashed #D9CDB8}
.slot2 .stack{position:absolute;left:8%;right:8%;top:6%;bottom:24%}
.slot2 .stack i{position:absolute;width:52%;aspect-ratio:1}
.slot2 .stack svg{width:100%;height:100%}
.slot2 .cnt{position:relative;font-weight:900;font-size:clamp(12px,3.2vw,16px);color:var(--mute)}
.slot2.wg{animation:wig .4s}
.floor{flex:1;min-height:0;position:relative}
.counter{position:absolute;left:0;right:0;bottom:0;height:22%;background:#C9A97A;border-top:8px solid #D9BE8C}
.cust{position:absolute;left:12%;bottom:8%;height:80%;max-width:42%;aspect-ratio:2/3;z-index:1;transform-origin:50% 100%}
.cust svg{width:100%;height:100%}
.order{position:absolute;left:calc(14% + min(42%,var(--fh,300px)*.56));top:6%;z-index:3;background:var(--white);border-radius:20px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(74,69,82,.12);max-width:44%}
.order::before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid var(--white)}
.oi{display:flex;align-items:center;gap:4px;font-weight:900;font-size:clamp(16px,4vw,22px)}
.oi svg{width:clamp(34px,8vw,48px);height:clamp(34px,8vw,48px)}
.oi.ok{color:var(--ok-d)}
.oi.ok b::after{content:" ✓"}
.store{position:absolute;right:3%;bottom:30%;width:min(28%,170px);aspect-ratio:1}
.store svg{width:100%;height:100%}
/* 牧場雞舍:道具放下方,點畫面走流程 */
.tapscene{cursor:pointer}
.herd{position:absolute;left:4%;right:4%;top:34%;height:22%;pointer-events:none}
.herd span{position:absolute;width:15%;aspect-ratio:4/3;opacity:.92}
.herd.hen span{width:9%;aspect-ratio:1}
.herd svg{width:100%;height:100%}
.big.toshop{position:absolute;right:10px;top:10px;z-index:6;font-size:17px;padding:8px 16px}
.cntag{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 12px 2px 4px;font-weight:900;font-size:17px}
.cntag svg{width:34px;height:30px}
.tapscene .prop{bottom:3%}
.prop.l{left:4%}.prop.r{right:4%}.prop.r2{right:calc(6% + clamp(64px,16vmin,120px))}
.tapscene .cow{width:min(78%,calc(var(--sh,400px)*1.05));bottom:14%}
.tapscene .bird{width:min(58%,calc(var(--sh,400px)*.7));bottom:12%}
/* 種子店 */
.seedn{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px 2px 4px;font-weight:900;font-size:15px}
.seedn svg{width:24px;height:24px}
.seeds .spk{align-items:center;padding:10px 6px 12px;gap:2px}
.spk .pk{width:min(60%,120px);aspect-ratio:1}
.spk .pk svg{width:100%;height:100%}
.spk b{padding:0;display:flex;flex-direction:column;align-items:center}
.spk b small{font-size:12px;color:var(--mute)}
.spk .price{display:flex;align-items:center;gap:4px;font-weight:900;font-size:20px}
.spk .price svg{width:26px;height:26px}
.spk.wg{animation:wig .4s}
.spk.soldout{opacity:.55}
.spk .price.so{color:#C97C76;font-size:18px}
.big.gotoseed{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:9}
/* 加工坊 */
.wgroups .wg2{align-items:center;padding:12px 10px 14px;gap:4px;text-align:center}
.gpics{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;width:100%}
.gpics i{width:clamp(40px,11vw,64px);aspect-ratio:1}
.gpics svg{width:100%;height:100%}
.wgroups .card b{padding:0;font-size:clamp(19px,4.8vw,26px)}
.wgroups .card small{font-size:clamp(12px,3.2vw,15px);color:var(--mute);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.works,.wgroups{grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr))!important;align-content:start!important;grid-auto-rows:max-content}
.wgroups{grid-template-columns:repeat(auto-fill,minmax(min(46%,230px),1fr))!important}
.works .wcard{align-items:center;padding:12px 8px 14px;gap:6px;text-align:center;min-width:0}
.wpic{width:clamp(60px,18vw,96px);aspect-ratio:1;flex:none}
.wpic svg{width:100%;height:100%}
.works .card b{padding:0;font-size:clamp(18px,4.6vw,24px)}
.need{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(12px,3.2vw,15px);font-weight:900;color:var(--ok-d);width:100%}
.need span{display:flex;align-items:center;gap:1px;background:#F4EEE2;border-radius:999px;padding:1px 8px 1px 2px;white-space:nowrap}
.need svg{width:22px;height:22px;flex:none}
.need em{font-style:normal;color:var(--mute);margin-right:3px}
.need .lack{color:#C97C76}
.mk{flex:1;min-height:0;position:relative;border-radius:26px;overflow:hidden;background:#F4EEE2;cursor:pointer;touch-action:none}
.mk>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mk .tool{transform-box:fill-box}
.fx-chop{animation:fxchop .26s ease-in-out 5 alternate;transform-origin:100% 50%}
@keyframes fxchop{to{transform:translateY(9px) rotate(4deg)}}
.fx-stir{animation:fxstir .5s linear 3;transform-origin:50% 100%}
@keyframes fxstir{0%,100%{transform:translateX(-6px) rotate(-8deg)}50%{transform:translateX(6px) rotate(8deg)}}
.fx-pour{animation:fxpour 1.3s ease-in-out;transform-origin:0% 100%}
@keyframes fxpour{25%,80%{transform:rotate(-55deg)}}
.fx-tilt{animation:fxtilt 1.3s ease-in-out;transform-origin:100% 100%}
@keyframes fxtilt{25%,80%{transform:translate(26px,-44px) rotate(28deg)}}
/**/.fx-tilt4{animation:fxtilt4 1.3s ease-in-out;transform-origin:100% 100%}
@keyframes fxtilt4{25%,80%{transform:rotate(40deg)}}
.fx-tiltHi{animation:fxtiltHi 1.3s ease-in-out;transform-origin:100% 100%}
@keyframes fxtiltHi{25%,80%{transform:translate(30px,-64px) rotate(28deg)}}
.fx-flipcake{animation:fxflip 1.1s ease-in-out;transform-origin:50% 50%}
@keyframes fxflip{25%{transform:translateY(-30px) scaleY(.2)}50%{transform:translateY(-40px) scaleY(-1)}75%{transform:translateY(-20px) scaleY(.2)}100%{transform:none}}
.fx-slide2{animation:fxslide2 1.2s ease-in-out forwards}
@keyframes fxslide2{40%{transform:translate(20px,-30px)}100%{transform:translate(58px,-2px)}}
.fx-knead{animation:fxknead .3s ease-in-out 4 alternate;transform-origin:50% 100%}
@keyframes fxknead{to{transform:scale(1.25,.7)}}
.fx-turnover{animation:fxturnover 1.3s ease-in-out forwards;transform-origin:50% 50%}
@keyframes fxturnover{40%{transform:translate(10px,-34px) rotate(180deg)}100%{transform:translate(40px,-2px) rotate(180deg)}}
.fx-tilt3{animation:fxtilt3 1.3s ease-in-out;transform-origin:100% 100%}
@keyframes fxtilt3{25%,80%{transform:translate(30px,-12px) rotate(40deg)}}
.fx-tilt2{animation:fxtilt2 1.3s ease-in-out;transform-origin:0% 100%}
@keyframes fxtilt2{25%,80%{transform:rotate(-40deg)}}
.fx-shake{animation:fxshake .18s ease-in-out 7 alternate;transform-origin:50% 50%}
@keyframes fxshake{from{transform:rotate(-8deg) translateX(-3px)}to{transform:rotate(8deg) translateX(3px)}}
.fx-press{animation:fxpress .3s ease-in-out 4 alternate}
@keyframes fxpress{to{transform:translateY(10px)}}
.fx-spin{animation:fxspin .45s linear 3;transform-origin:50% 50%}
@keyframes fxspin{to{transform:rotate(360deg)}}

<script>
/* ================= 聲音 ================= */
let ctx=null,out=null;
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();out.gain.value=.7;out.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,t,d,{type='sine',v=.15,to=null}={}){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(t,d,{v=.1,f=900,q=1,type='bandpass'}={}){try{const c=ac(),b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(out);s.start(t)}catch(e){}}
const T=()=>ac().currentTime,N=m=>440*Math.pow(2,(m-69)/12);
const S={
  tap(){tone(520,T(),.08,{type:'triangle',v:.1})},
  plant(){const t=T();noise(t,.12,{v:.1,f:500,q:.8});tone(300,t+.05,.12,{type:'triangle',v:.08,to:200})},
  water(){const t=T();for(let i=0;i<6;i++)noise(t+i*.1,.12,{v:.06,f:1800+Math.random()*900,q:3})},
  grow(){const t=T();[60,64,67,72].forEach((m,i)=>tone(N(m),t+i*.08,.3,{type:'triangle',v:.1}))},
  ripe(){const t=T();[72,76,79,84].forEach((m,i)=>tone(N(m),t+i*.09,.4,{type:'sine',v:.11}))},
  pick(){const t=T();tone(700,t,.1,{type:'sine',v:.14,to:1300})},
  ding(){const t=T();tone(1568,t,.3,{v:.1});tone(2093,t+.07,.4,{v:.08})},
  munch(){const t=T();for(let i=0;i<5;i++)noise(t+i*.16,.08,{v:.1,f:900+Math.random()*400,q:1.2})},
  moo(){const t=T();tone(150,t,.9,{type:'sawtooth',v:.07,to:110});tone(152,t,.9,{type:'triangle',v:.08,to:118})},
  bubble(){tone(600+Math.random()*700,T(),.07,{type:'sine',v:.07,to:1400})},
  shower(){const t=T();noise(t,1.1,{v:.08,f:3000,q:.5,type:'highpass'})},
  squirt(){const t=T();noise(t,.12,{v:.08,f:2400,q:2});tone(900,t,.08,{v:.04,to:500})},
  crack(){const t=T();noise(t,.05,{v:.16,f:2500,q:2});noise(t+.06,.04,{v:.1,f:3200,q:2})},
  peep(){const t=T();tone(2200,t,.08,{v:.08,to:2700});tone(2300,t+.13,.08,{v:.08,to:2800})},
  cluck(){const t=T();[0,.14,.26].forEach(d=>tone(420,t+d,.09,{type:'square',v:.04,to:300}))},
  coin(){const t=T();tone(N(88),t,.12,{type:'square',v:.05});tone(N(93),t+.08,.25,{type:'square',v:.05})},
  truck(){const t=T();tone(330,t,.18,{type:'square',v:.05});tone(330,t+.25,.3,{type:'square',v:.05});noise(t+.3,1,{v:.05,f:160,q:.7})},
  win(){const t=T();[72,76,79,84,88].forEach((m,i)=>tone(N(m),t+i*.12,.5,{type:'triangle',v:.11}))},
  buzz(){const t=T();tone(220,t,1.6,{type:'sawtooth',v:.025,to:260});tone(225,t,1.6,{type:'triangle',v:.04,to:250})},
  sun(){const t=T();[67,71,74,79].forEach((m,i)=>tone(N(m),t+i*.15,.7,{type:'sine',v:.09}))},
  bell(){const t=T();tone(N(88),t,.5,{v:.1});tone(N(84),t+.18,.7,{v:.1})},
  wind(){const t=T();noise(t,1.6,{v:.07,f:600,q:.4,type:'lowpass'})},
  chop(){const t=T();noise(t,.06,{v:.16,f:1800,q:1.5});tone(180,t,.08,{type:'triangle',v:.08})},
  beep(){tone(1760,T(),.12,{type:'square',v:.05})},
  till(){const t=T();tone(N(84),t,.15,{type:'triangle',v:.1});tone(N(91),t+.12,.4,{type:'triangle',v:.1});noise(t+.05,.2,{v:.06,f:3500,q:1})},
  pour(){const t=T();noise(t,.8,{v:.05,f:1200,q:.7})},
  stir(){const t=T();for(let i=0;i<4;i++)noise(t+i*.2,.15,{v:.05,f:700,q:1})},
  sizzle(){const t=T();noise(t,1.2,{v:.05,f:4000,q:.4,type:'highpass'})},
  whir(){const t=T();tone(120,t,1.2,{type:'sawtooth',v:.04,to:240})},
  tick(){const t=T();for(let i=0;i<6;i++)tone(1200,t+i*.2,.04,{type:'square',v:.03})},
  no(){const t=T();tone(300,t,.15,{type:'triangle',v:.08,to:240})}
};

 egg:`<ellipse cx="50" cy="54" rx="28" ry="36" fill="#FBF3E4" stroke="#E6D7BF" stroke-width="3"/><path d="M36 34Q30 42 30 52" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>`
};
Object.assign(ICON,{

function settlePending(){let ch=false;

function showCoop(){const sc=document.createElement('div');sc.className='screen';stage.appendChild(sc);
  sc.innerHTML=`<div class="steps" id="hsteps"></div><div class="scene tapscene" id="scene">${herdRow('hen')}<div class="cntag">${svg(`<g transform="translate(0 -6)">${HEN}</g>`)}×${G.herd.hen}</div><div class="hero bird" id="bird"></div><div class="prop l" id="pFeed">${svg(FEEDBAG)}</div></div>`;
  const H=G.hen,bird=$('bird'),scene=$('scene'),tm=[];let busy=false,eggEl=null;
  const fitSize=()=>scene.style.setProperty('--sh',scene.clientHeight+'px');fitSize();const ro=new ResizeObserver(fitSize);ro.observe(scene);
  function draw(){bird.innerHTML=svg(H.stage==='egg'?eggSVG(H.crack):H.stage==='chick'?CHICK:NEST+`<g transform="translate(0 -6)">${HEN}</g>`);$('pFeed').hidden=H.stage==='egg';
    if(H.stage==='egg')stepChips($('hsteps'),['保暖','保暖','保暖','保暖','孵出來'],H.crack);
    else if(H.stage==='chick')stepChips($('hsteps'),['吃飼料','吃飼料','吃飼料','長大'],H.fed);
    else stepChips($('hsteps'),['吃飼料','生蛋','撿蛋'],eggEl?2:0);
    tipEl.textContent=H.stage==='egg'?'點一點蛋,幫它保暖,小雞快出來!':H.stage==='chick'?'小雞餓了,點一點,撒飼料給牠吃':(eggEl?'母雞生蛋了!點一點,把蛋撿起來':'點一點,撒飼料給母雞吃,牠會生蛋喔')}
  function anim(c){bird.classList.remove('jump','wig','growup');void bird.offsetWidth;bird.classList.add(c)}
  function center(){const r=bird.getBoundingClientRect(),sr=scene.getBoundingClientRect();return{x:r.left-sr.left+r.width/2,y:r.top-sr.top+r.height/2,r,sr}}
  draw();if(H.egg)layEgg(true);
  function warm(){H.crack++;S.crack();anim('wig');save();
    if(H.crack>=5){tm.push(setTimeout(()=>{H.stage='chick';H.crack=0;H.fed=0;save();draw();anim('growup');S.peep();talk('小雞出生了');const c=center();sparkAt(scene,c.x,c.y,6);busy=false},350))}
    else{draw();talk(['好溫暖','蛋動了一下','裂開一點點了','快出來了'][H.crack-1]||'');tm.push(setTimeout(()=>busy=false,400))}}
  function feed(){const c=center();propMove($('pFeed'),scene,c.x-c.r.width*.15,c.r.top-c.sr.top+c.r.height*.2,-60,1500,.7);S.plant();
    for(let j=0;j<14;j++)tm.push(setTimeout(()=>{const f=document.createElement('div');f.className='feed';const bx=c.x+(Math.random()-.5)*c.r.width*.6,by=c.r.bottom-c.sr.top-10-Math.random()*20;f.style.left=c.x+'px';f.style.top=(c.r.top-c.sr.top+c.r.height*.3)+'px';scene.appendChild(f);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${bx-c.x}px,${by-(c.r.top-c.sr.top+c.r.height*.3)}px)`}));setTimeout(()=>{f.style.opacity=0;setTimeout(()=>f.remove(),400)},1600)},450+j*30));
    tm.push(setTimeout(()=>{const s=bird.querySelector('svg');s.classList.add('peck');H.stage==='chick'?S.peep():S.cluck()},1000));
    tm.push(setTimeout(()=>{const s=bird.querySelector('svg');s&&s.classList.remove('peck');
      if(H.stage==='chick'){H.fed++;save();draw();if(H.fed>=3){anim('growup');S.grow();tm.push(setTimeout(()=>{H.stage='hen';H.fed=0;save();draw();S.cluck();talk('小雞長大變母雞了');const c2=center();sparkAt(scene,c2.x,c2.y,6);busy=false},600))}else{talk('好好吃');busy=false}}
      else{H.egg=true;save();layEgg();busy=false}},2400))}
  function collect(){const r=eggEl.getBoundingClientRect();eggEl.remove();eggEl=null;H.egg=false;save();draw();const ne=G.herd.hen||1;toBasket('egg',r,ne);talk(ne>1?ne+'隻母雞,撿到 '+ne+' 顆蛋':'撿到一顆蛋');tm.push(setTimeout(()=>busy=false,500))}
  function layEgg(quiet){const c=center();eggEl=document.createElement('div');eggEl.className='egg-drop';eggEl.innerHTML=svg(ICON.egg);eggEl.style.left=(c.x+c.r.width*.3)+'px';scene.appendChild(eggEl);eggEl.style.top=Math.min(c.r.bottom-c.sr.top-c.r.height*.12,c.sr.height-eggEl.offsetHeight/2-8)+'px';
    if(!quiet){S.cluck();setTimeout(()=>S.pick(),300);talk('咕咕,生蛋了')}draw()}
  scene.addEventListener('pointerdown',e=>{if(e.target.closest('.toshop'))return;e.preventDefault();ac();if(busy)return;busy=true;
    if(H.stage==='egg')warm();else if(H.stage==='hen'&&eggEl)collect();else feed()});
  cleanup=()=>{ro.disconnect();tm.forEach(clearTimeout)}}

 ['小貓',`<rect x="22" y="80" width="56" height="62" rx="24" fill="#F4DE9E"/><path d="M26 44L28 18L46 34ZM74 44L72 18L54 34Z" fill="#C9C4CE"/><path d="M30 38L31 25L40 33ZM70 38L69 25L60 33Z" fill="#F2B9B4"/><circle cx="50" cy="56" r="26" fill="#C9C4CE"/><path d="M30 64l-12-2M30 68l-12 2M70 64l12-2M70 68l12 2" stroke="#8E8791" stroke-width="1.6"/>`],
 ['小狗',`<rect x="22" y="80" width="56" height="62" rx="24" fill="#9DCB9A"/><circle cx="50" cy="56" r="26" fill="#E6D3A0"/><ellipse cx="25" cy="54" rx="9" ry="18" fill="#B89A6C" transform="rotate(15 25 54)"/><ellipse cx="75" cy="54" rx="9" ry="18" fill="#B89A6C" transform="rotate(-15 75 54)"/>`]];
const FACE=`<circle cx="41" cy="54" r="3.5" fill="${K}"/><circle cx="59" cy="54" r="3.5" fill="${K}"/><ellipse cx="50" cy="63" rx="4" ry="3" fill="#8E7468"/><path d="M44 69q6 5 12 0" stroke="${K}" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="34" cy="64" r="4" fill="#F2B9B4" opacity=".7"/><circle cx="66" cy="64" r="4" fill="#F2B9B4" opacity=".7"/>`;
const CBASKET=`<path d="M60 112Q72 98 84 112" stroke="#A98467" stroke-width="3" fill="none"/><path d="M54 112h36l-5 22H59z" fill="#C9A97A"/>`;
const REG=`<rect x="8" y="40" width="84" height="44" rx="8" fill="#D9D2C6"/><rect x="16" y="12" width="56" height="26" rx="5" fill="#6E6876"/><rect x="72" y="22" width="14" height="18" rx="3" fill="#B9BEC5"/>${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${18+c*12}" y="${48+r*9}" width="9" height="6" rx="2" fill="#F4EEE2"/>`).join('')).join('')}<rect x="68" y="50" width="16" height="24" rx="3" fill="#7FB08A"/><rect x="4" y="84" width="92" height="10" rx="3" fill="#B9BEC5"/>`;
const BARCODE=`<rect x="56" y="78" width="38" height="18" rx="3" fill="#FFFFFF" stroke="#E6DCCB"/>${[59,61,63,66,68,71,74,76,79,82,84,87,90].map((x,i)=>`<rect x="${x}" y="81" width="${i%3?1:1.8}" height="12" fill="${K}"/>`).join('')}`;
const GUN=`<path d="M30 30h44q10 0 10 10v6q0 8-10 8H52l-6 34q-1 6-8 6h-4q-6 0-5-6l5-34h-4q-8 0-8-8v-8q0-8 8-8z" fill="#55505C"/><rect x="76" y="34" width="8" height="16" rx="2" fill="#E07A72"/><rect x="40" y="36" width="20" height="5" rx="2.5" fill="#8E8791"/>`;
const bigCode=k=>{let x=8,p='';const seed=ORDER.indexOf(k)*7+3;for(let i=0;i<34;i++){const w=((i*seed+5)%3)+1.2;p+=`<rect x="${x}" y="6" width="${w}" height="40" fill="${K}"/>`;x+=w+((i*seed)%2?2.2:3.4)}return `<rect width="${x+8}" height="64" rx="6" fill="#FFFFFF"/>${p}<text x="${(x+8)/2}" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="${K}" letter-spacing="2">4 710${String(100+ORDER.indexOf(k)*37).padStart(3,'0')} ${PRICE[k]}${PRICE[k]}${PRICE[k]}</text>`};
const BAG=`<path d="M18 30h64l6 64H12z" fill="#E6CBA0"/><path d="M34 30q0-16 16-16t16 16" stroke="#C9A97A" stroke-width="4" fill="none"/>`;
let shopTok=null;
function showShop(){const me={};shopTok=me;const sc=document.createElement('div');sc.className='screen';stage.appendChild(sc);
  sc.innerHTML=`<div class="shop"><div class="stockbar"><b>倉庫</b><div class="stock" id="stock"></div></div>
    <div class="shopscene" id="ss"><div class="rack" id="rack"></div><div class="floor2" id="floor"><div class="cust2" id="cust"></div>
      <div class="checkout" id="co"><div class="tread" id="tread"></div><div class="lane" id="lane"></div><div class="scanwin"></div><div class="gun">${svg(GUN)}</div><div class="bagz" id="bagz">${svg(BAG)}</div><button class="reg" id="reg" type="button" aria-label="收銀機">${svg(REG)}<span class="regn" id="regn">0</span></button></div></div>
      <div class="zoom" id="zoom" hidden></div></div></div>`;
  const tm=[];let cust=null,zooming=false,nextAt=performance.now()+1500;const SLOTS=4,CAP=6;
  function drawStock(){const st=$('stock');st.innerHTML='';const ks=ORDER.filter(k=>G.stock[k]>0);
    if(!ks.length)st.innerHTML='<span class="empty">倉庫空空的,去「出貨」接商店進貨單</span>';
    ks.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='sk';b.innerHTML=`${svg(ICON[k])}<span>×${G.stock[k]}</span>`;b.onclick=()=>{ac();toShelf(k,b)};st.appendChild(b)})}
  function drawRack(){const r=$('rack');r.innerHTML='';
    for(let i=0;i<SLOTS;i++){const s=G.shelf[i],b=document.createElement('button');b.type='button';b.className='slot2'+(s?'':' none');
      b.innerHTML=s?`<span class="stack">${Array.from({length:s.n},(_,j)=>`<i style="left:${(j%3)*24}%;bottom:${Math.floor(j/3)*30}%">${svg(ICON[s.k])}</i>`).join('')}</span><span class="cnt">${NAME[s.k]} ${s.n}</span><span class="tag">${PRICE[s.k]}元</span>`:'<span class="cnt">空的</span>';
      b.onclick=()=>{ac();b.classList.remove('wg');void b.offsetWidth;b.classList.add('wg');S.tap()};r.appendChild(b)}}
  function tip(){tipEl.textContent=!cust?(G.shelf.some(Boolean)?'等客人來買東西…也可以繼續補貨':ORDER.some(k=>G.stock[k])?'點倉庫的商品,擺到貨架上':'倉庫空空的,去「出貨」接商店進貨單'):
    cust.phase==='shop'?cust.name+'在挑東西…':cust.phase==='scan'?'點履帶最前面的商品,用掃碼器嗶一下':cust.phase==='pay'?'刷好了!點收銀機結帳':'謝謝光臨!'}
  drawStock();drawRack();tip();
  function toShelf(k,btn){let i=G.shelf.findIndex(s=>s&&s.k===k&&s.n<CAP);if(i<0)i=G.shelf.findIndex(s=>!s);if(i<0){S.no();tipEl.textContent='貨架滿了,等客人買走一些';return}
    G.stock[k]--;G.shelf[i]=G.shelf[i]||{k,n:0};G.shelf[i].n++;save();S.pick();const r=btn.querySelector('svg').getBoundingClientRect();drawStock();
    fly(ICON[k],r,$('rack').children[i],()=>{drawRack();S.plant();tip()},50)}
  const custEl=$('cust');
  function place(x,dur){const fw=$('floor').clientWidth;return custEl.animate([{transform:`translateX(${cust.x}px)`},{transform:`translateX(${x}px)`}],{duration:dur,easing:'ease-in-out',fill:'forwards'}).finished.then(()=>{cust.x=x})}
  function spawn(){const kinds=[...new Set(G.shelf.filter(Boolean).map(s=>s.k))];if(!kinds.length)return;
    const [name,body]=CUSTS[Math.floor(Math.random()*CUSTS.length)];const fw=$('floor').clientWidth,cw=custEl.clientWidth||100;
    cust={name,phase:'shop',x:-cw-20,items:[],total:0,scanned:0};custEl.innerHTML=svg(body+FACE+CBASKET,'0 0 100 150');S.bell();tip();
    place(fw*.04,900).then(async()=>{talk(name+'來買東西了');
      const want=1+Math.floor(Math.random()*3);
      for(let n=0;n<want;n++){const idx=G.shelf.map((s,i)=>s?i:-1).filter(i=>i>=0);if(!idx.length)break;const i=idx[Math.floor(Math.random()*idx.length)],s=G.shelf[i];
        await new Promise(r=>tm.push(setTimeout(r,700)));if(shopTok!==me)return;
        const rr=$('rack').children[i].getBoundingClientRect();s.n--;const k=s.k;if(!s.n)G.shelf[i]=null;cust.items.push(k);G.sale=cust.items.slice();save();drawRack();S.pick();
        await new Promise(r=>fly(ICON[k],rr,custEl,r,48));if(shopTok!==me)return}
      if(!cust.items.length){leave();return}
      talk('我要買這些');await new Promise(r=>tm.push(setTimeout(r,500)));if(shopTok!==me)return;
      const co=$('co'),fr=$('floor').getBoundingClientRect(),cr=co.getBoundingClientRect();await place(cr.left-fr.left-cw*.7,1000);
      for(const k of cust.items){await new Promise(r=>fly(ICON[k],custEl.getBoundingClientRect(),$('lane'),r,44));if(shopTok!==me)return;const b=document.createElement('button');b.type='button';b.className='bitem';b.dataset.k=k;b.innerHTML=svg(ICON[k]+BARCODE);b.onclick=()=>scan(b);$('lane').appendChild(b);layout();S.plant()}
      cust.phase='scan';run();tip()})}
  // 履帶:第一個商品排在掃描器前面,後面的依序排隊
  function layout(){const items=[...$('lane').querySelectorAll('.bitem')];const w=items[0]?items[0].offsetWidth+8:60;items.forEach((b,i)=>{b.style.right=(i*w)+'px';b.classList.toggle('front',i===0)})}
  function run(){const t=$('tread');t.classList.remove('run');void t.offsetWidth;t.classList.add('run')}
  function scan(b){ac();if(!cust||cust.phase!=='scan'||zooming)return;
    if(!b.classList.contains('front')){S.no();b.classList.remove('wg');void b.offsetWidth;b.classList.add('wg');tipEl.textContent='一個一個來,先刷最前面的';return}
    zooming=true;const k=b.dataset.k,z=$('zoom');S.tap();
    z.innerHTML=`<div class="zcard"><div class="zitem">${svg(ICON[k])}</div><div class="zcode">${svg(bigCode(k),'0 0 '+(8+34*4.5+8)+' 64')}<div class="laser"></div></div><div class="zgun">${svg(GUN)}</div><div class="zprice" hidden>${NAME[k]} ${PRICE[k]} 元</div></div>`;
    z.hidden=false;
    tm.push(setTimeout(()=>{z.querySelector('.laser').classList.add('go');z.querySelector('.zgun').classList.add('go')},350));
    tm.push(setTimeout(()=>{S.beep();cust.total+=PRICE[k];cust.scanned++;$('regn').textContent=cust.total;z.querySelector('.zprice').hidden=false;talk(NAME[k]+' '+PRICE[k]+'元')},900));
    tm.push(setTimeout(()=>{const r=z.querySelector('.zitem').getBoundingClientRect();z.hidden=true;z.innerHTML='';b.remove();layout();run();zooming=false;
      fly(ICON[k],r,$('bagz'),()=>{bump($('bagz'));if(cust&&cust.scanned===cust.items.length){cust.phase='pay';$('reg').classList.add('ready');tip();talk('一共 '+cust.total+' 元')}},60)},1900))}
  $('reg').onclick=()=>{ac();if(!cust||cust.phase!=='pay'){S.tap();return}cust.phase='bye';G.sale=null;$('reg').classList.remove('ready');$('reg').classList.add('open');S.till();tip();
    const earn=cust.total;coinRain(custEl.getBoundingClientRect(),earn,()=>{});talk('收您 '+earn+' 元,謝謝光臨');
    tm.push(setTimeout(()=>{$('reg').classList.remove('open');$('regn').textContent='0';const br=$('bagz').getBoundingClientRect();fly(BAG,br,custEl,()=>leave(),50)},1400))};
  function leave(){const cw=custEl.clientWidth||100;place(-cw-40,1100).then(()=>{custEl.innerHTML='';cust=null;nextAt=performance.now()+1800;tip()})}
  const loop=setInterval(()=>{if(!cust&&performance.now()>nextAt&&G.shelf.some(Boolean))spawn()},400);
  cleanup=()=>{clearInterval(loop);tm.forEach(clearTimeout);settlePending();cust=null;shopTok=null}}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function coinRain(rr,earn,done){const n=Math.min(earn,10);let got=0;const base=G.coins;G.coins+=earn;save();$('coinN').textContent=base;let shown=base;
  for(let j=0;j<n;j++)setTimeout(()=>{const c=document.createElement('div');c.className='coinf';c.innerHTML=svg(COIN,'0 0 30 30');const sx=rr.left+rr.width*(.2+Math.random()*.6),sy=rr.top+rr.height*.3;c.style.left=sx+'px';c.style.top=sy+'px';document.body.appendChild(c);
    const p=$('coinP').getBoundingClientRect();let fin=false;const end=()=>{if(fin)return;fin=true;c.remove();S.coin();bump($('coinP'));got++;const add=got===n?earn-Math.floor(earn/n)*(n-1):Math.floor(earn/n);shown+=add;$('coinN').textContent=Math.min(shown,G.coins);if(got===n){paint();plusAt($('coinP'),'+'+earn);S.win();done()}};
    try{c.animate([{transform:'translate(0,0)'},{transform:`translate(${(p.left+20-sx)*.4}px,${(p.top-sy)*.4-80}px)`,offset:.4},{transform:`translate(${p.left+8-sx}px,${p.top+4-sy}px) scale(.7)`}],{duration:700,easing:'ease-in-out'}).onfinish=end}catch(e){end()}setTimeout(end,900)},j*110)}

settlePending();
go('map');
</script>
