<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>說故事</title>
<style>
/* 說故事:四個經典童話,每頁一個場景,點畫面會動。大人可以每頁錄自己的聲音。 */
:root{--ink:#4A4552;--bg:#EFE6D8;--white:#FFFFFF;--mute:#6E6876;--ok:#7FB08A;--ok-d:#5E8F69;--rec:#D8584E;--rec-d:#B0453D;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(44px + env(safe-area-inset-bottom,0px));max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,5vw,28px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 14px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(74,69,82,.15);white-space:nowrap}
.pill.on{background:var(--ink);color:var(--white)}
.pill.recon{background:var(--rec);color:var(--white)}
.pill:active,.nav button:active,.cover:active,.rb:active{transform:translateY(2px)}
/* 故事列表 */
.list{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));grid-auto-rows:max-content;gap:16px;align-content:safe center;padding:4px}
.cover{all:unset;cursor:pointer;background:var(--white);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 rgba(74,69,82,.13);display:flex;flex-direction:column}
.cover svg{width:100%;aspect-ratio:16/9;display:block}
.cover b{font-size:clamp(20px,5vw,24px);padding:10px 16px 2px}
.cover small{font-size:15px;color:var(--mute);font-weight:700;padding:0 16px 14px}
/* 閱讀 */
.reader{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.scene{width:100%;height:100%;max-height:100%;cursor:pointer;display:block}
.scene .hintg{transform-box:fill-box;transform-origin:50% 50%;animation:hintp 1.4s ease-in-out infinite}
.scene.go .hintg{display:none}
@keyframes hintp{50%{transform:scale(1.08)}}
.side{display:flex;flex-direction:column;gap:8px;flex:none}
.text{background:var(--white);border-radius:20px;padding:12px 18px;font-weight:900;font-size:clamp(19px,4.6vw,26px);line-height:1.55;min-height:2.6em;display:flex;align-items:center;box-shadow:0 3px 0 rgba(74,69,82,.1)}
.recbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#F7E3E0;border-radius:18px;padding:8px 10px}
.recbar .st{font-weight:900;font-size:15px;color:var(--mute);flex:1;min-width:150px}
.rb{all:unset;cursor:pointer;border-radius:999px;padding:9px 16px;font-weight:900;font-size:16px;background:var(--white);box-shadow:0 3px 0 rgba(74,69,82,.15);white-space:nowrap}
.rb.red{background:var(--rec);color:var(--white);box-shadow:0 3px 0 var(--rec-d)}
.rb.red.live{animation:hintp 1s ease-in-out infinite}
.nav{display:flex;gap:10px;align-items:center}
.nav button{all:unset;cursor:pointer;flex:1;text-align:center;border-radius:20px;padding:14px 0;font-weight:900;font-size:clamp(18px,4.5vw,22px);background:var(--ok);color:var(--white);box-shadow:0 5px 0 var(--ok-d)}
.nav button.back{background:var(--white);color:var(--ink);box-shadow:0 5px 0 rgba(74,69,82,.15)}
.nav button[disabled]{opacity:.35}
.nav .pg{font-weight:900;color:var(--mute);min-width:56px;text-align:center}
.endo{position:fixed;inset:0;background:rgba(239,230,216,.95);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;text-align:center;padding:16px;overflow-y:auto}
.endo h2{margin:0;font-size:clamp(28px,7vw,40px);font-weight:900}
.big{all:unset;cursor:pointer;font-weight:900;font-size:21px;padding:12px 26px;border-radius:999px;background:var(--ok);color:var(--white);box-shadow:0 5px 0 var(--ok-d)}
.big.alt{background:var(--white);color:var(--ink);box-shadow:0 5px 0 rgba(74,69,82,.15)}
@media (orientation:portrait){.stage{flex:none;width:100%;aspect-ratio:16/9}.side{flex:1;min-height:0}.text{flex:1;font-size:clamp(21px,5.6vw,28px);align-items:center;overflow-y:auto}}
@media (orientation:landscape) and (max-height:560px){
  .reader{flex-direction:row}.side{width:min(42%,380px);justify-content:center}
  .text{font-size:19px;padding:10px 14px}.nav button{padding:10px 0}}

/* ---- 場景動畫 ---- */
.scene g[class]{transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.sway{animation:sway 3.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}
.steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{to{transform:translateX(120px)}}
.hid{opacity:0}
.grow0{transform:scale(1,0)}
.go .a-show{animation:show .6s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes show{to{opacity:1}}
.go .a-hop{animation:hop .45s ease-in-out 4;animation-delay:var(--d,0s)}
@keyframes hop{50%{transform:translateY(-26px)}}
.go .grow0{animation:grow 1.3s cubic-bezier(.3,1.35,.5,1) forwards;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scale(1,0)}to{transform:scale(1,1)}}
.go .a-grow{animation:grow2 1.8s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes grow2{from{transform:scale(.35)}to{transform:scale(1)}}
.a-grow{transform:scale(.35)}
.go .a-fly{animation:fly 1.6s ease-in forwards;animation-delay:var(--d,.5s)}
@keyframes fly{to{transform:translate(460px,-280px) rotate(80deg);opacity:0}}
.go .a-run{animation:run var(--t,1.6s) ease-in forwards;animation-delay:var(--d,.8s)}
@keyframes run{to{transform:translateX(var(--x,560px))}}
.go .a-crawl{animation:run var(--t,3s) linear forwards;animation-delay:var(--d,0s)}
.go .a-shake{animation:shake .22s 7;animation-delay:var(--d,0s)}
@keyframes shake{25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
.go .a-tug{animation:tug .55s ease-in-out 4}
@keyframes tug{50%{transform:translateX(-9px) rotate(-5deg)}}
.go .a-pop{animation:pop 1s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:.9s}
@keyframes pop{to{transform:translateY(-120px) rotate(-6deg)}}
.go .a-tumble{animation:tumble .7s ease-out forwards;animation-delay:1s}
@keyframes tumble{to{transform:translateX(-26px) rotate(-16deg)}}
.go .a-drop{animation:drop .9s ease-in forwards}
@keyframes drop{to{transform:translateY(80px);opacity:0}}
.go .a-away{animation:away 1.5s ease-out forwards;animation-delay:var(--d,1.1s)}
@keyframes away{0%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(320px,-300px) rotate(220deg)}}
.go .a-break{animation:brk .5s ease-in forwards;animation-delay:var(--d,.4s)}
@keyframes brk{to{transform:rotate(70deg) translateY(6px)}}
.go .a-hide{animation:hide .7s forwards;animation-delay:var(--d,.8s)}
@keyframes hide{to{opacity:0}}
.go .a-eat{animation:eat .6s ease-in-out 4}
@keyframes eat{50%{transform:translate(-16px,12px) rotate(-18deg)}}
.go .a-puff{animation:puff .55s ease-in-out 4}
@keyframes puff{50%{transform:scale(1.1)}}
.wind path{stroke-dasharray:50 250;stroke-dashoffset:300}
.go .wind path{animation:wind .8s linear 4;animation-delay:var(--d,0s)}
@keyframes wind{to{stroke-dashoffset:0}}
.go .a-sit{animation:sit .6s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes sit{to{transform:translateY(18px)}}
.snowf{animation:snowf var(--t,7s) linear infinite;animation-delay:var(--d,0s)}
@keyframes snowf{from{transform:translateY(-40px)}to{transform:translateY(480px)}}
.tw{animation:tw 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes tw{50%{opacity:.25}}
.go .a-up{animation:up 2.6s ease-in forwards;animation-delay:var(--d,.2s)}
@keyframes up{30%{transform:translate(60px,-10px)}to{transform:translate(var(--x,620px),var(--y,-330px))}}
@media (prefers-reduced-motion:reduce){.scene *{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="pill" id="home" type="button" hidden>◀ 故事列表</button>
    <h1 id="title">說故事</h1>
    <button class="pill" id="auto" type="button" hidden>自動翻頁</button>
    <button class="pill" id="recBtn" type="button">🎙 大人錄音</button>
  </header>
  <div class="list" id="list"></div>
  <div class="reader" id="reader" hidden>
    <div class="stage" id="stage"></div>
    <div class="side">
      <div class="text" id="text"></div>
      <div class="recbar" id="recbar" hidden></div>
      <div class="nav"><button class="back" id="prev" type="button">◀ 上一頁</button><span class="pg" id="pg"></span><button id="next" type="button">下一頁 ▶</button></div>
    </div>
  </div>
</div>
<div class="endo" id="endo" hidden></div>
<script src="voice.js"></script>
<script>
/* ================= 聲音效果 ================= */
let ac=null;
function A(){if(!ac){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,{type='triangle',v=.12,at=0,to=null}={}){const c=A();if(!c)return;try{const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,{at=0,v=.12,f=800,q=.8,to=null}={}){const c=A();if(!c)return;try{const t=c.currentTime+at,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(c.destination);s.start(t)}catch(e){}}
const SFX={
  hop(){[0,.45,.9].forEach(a=>tone(520,.2,{at:a,to:900,v:.09}))},
  build(){for(let i=0;i<6;i++)tone(180+i*20,.09,{at:i*.2,type:'square',v:.06})},
  blow(){noise(1.6,{v:.2,f:500,to:1400,q:.6});noise(1.6,{at:1.4,v:.16,f:900,to:400,q:.6})},
  crash(){noise(.8,{at:.5,v:.25,f:300,q:.5});tone(120,.5,{at:.5,type:'sine',v:.15,to:60})},
  strong(){noise(1.8,{v:.2,f:500,to:1400,q:.6});[0,.4,.8].forEach(a=>tone(90,.25,{at:1+a,type:'sine',v:.12}))},
  cheer(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.45,{at:i*.11}))},
  dash(){noise(.7,{v:.15,f:2000,to:600,q:1.2})},
  crawl(){for(let i=0;i<6;i++)tone(300,.08,{at:i*.45,type:'sine',v:.06})},
  snore(){[0,1.2].forEach(a=>{noise(.8,{at:a,v:.08,f:250,q:2});tone(110,.6,{at:a+.1,type:'sine',v:.05})})},
  tug(){[0,.55,1.1,1.65].forEach(a=>tone(160,.3,{at:a,type:'sine',v:.12,to:120}))},
  pop(){tone(300,.25,{at:.9,to:1200,v:.15});noise(.3,{at:.95,v:.12,f:1500});[784,988,1175].forEach((f,i)=>tone(f,.4,{at:1.3+i*.1}))},
  grow(){tone(300,1.6,{to:900,v:.08,type:'sine'})},
  crack(){noise(.15,{at:.4,v:.25,f:2500,q:1});noise(.4,{at:.5,v:.15,f:400})},
  eat(){[0,.6,1.2,1.8].forEach(a=>tone(700,.08,{at:a,type:'sine',v:.07}))},
  ouch(){noise(.6,{v:.15,f:3000,q:.7});tone(900,.6,{at:.3,to:300,type:'sawtooth',v:.05});tone(400,1,{at:1.1,to:1400,v:.08})},
  knock(){[0,.25].forEach(a=>tone(200,.1,{at:a,type:'square',v:.08}))},
  run(){for(let i=0;i<10;i++)tone(400+(i%2)*80,.06,{at:.8+i*.12,type:'sine',v:.06})},
  wonder(){tone(500,.3,{to:800,v:.08});tone(500,.3,{at:.5,to:800,v:.08})},
  heart(){[659,784,988].forEach((f,i)=>tone(f,.5,{at:i*.15,v:.1}))},
  jingle(){for(let i=0;i<8;i++){const a=i*.22+(i>3?.25:0);tone(1568,.25,{at:a,type:'sine',v:.07});tone(2349,.18,{at:a+.01,type:'sine',v:.04})}},
  slide(){tone(700,.9,{to:220,v:.09,type:'sine'});noise(.5,{at:.2,v:.06,f:1500})},
  toys(){[0,.35,.7].forEach((a,i)=>{tone(200,.08,{at:a,type:'square',v:.06});tone(880+i*220,.2,{at:a+.15,v:.08})})}
};

/* ================= 繪圖小工具 ================= */
const W=800,H=450,GY=360;
const P=(x,y,s,inner,cls='',flip=false,style='')=>`<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><g${cls?` class="${cls}"`:''}${style?` style="${style}"`:''}>${inner}</g></g>`;
let gid=0;const grad=(c1,c2)=>{const id='g'+(++gid);return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`};
const sky=(c1='#CFE4EC',c2='#EEF4F0')=>grad(c1,c2);
const cloud=(x,y,s=1)=>P(x,y,s,`<g class="drift"><ellipse cx="0" cy="0" rx="46" ry="18" fill="#FFFFFF" opacity=".9"/><ellipse cx="-20" cy="-12" rx="22" ry="16" fill="#FFFFFF" opacity=".9"/><ellipse cx="16" cy="-14" rx="26" ry="20" fill="#FFFFFF" opacity=".9"/></g>`);
const sun=(x=700,y=70)=>`<circle cx="${x}" cy="${y}" r="34" fill="#F6D58A"/><circle cx="${x}" cy="${y}" r="46" fill="#F6D58A" opacity=".25"/>`;
const hills=()=>`<path d="M0 300 Q120 230 260 280 T540 270 T800 280 V${GY} H0z" fill="#A9C99A"/>`;
const ground=(c='#B9D2A8')=>`<rect y="${GY-6}" width="${W}" height="${H-GY+6}" fill="${c}"/>`;
const tree=(x,y=GY,s=1)=>P(x,y,s,`<g class="sway"><rect x="-9" y="-90" width="18" height="90" rx="6" fill="#8A6A4D"/><circle cx="0" cy="-120" r="48" fill="#7FA676"/><circle cx="-30" cy="-96" r="32" fill="#8FB283"/><circle cx="30" cy="-98" r="34" fill="#6E9A66"/></g>`);
const pine=(x,y=GY,s=1)=>P(x,y,s,`<g class="sway"><rect x="-7" y="-40" width="14" height="40" fill="#8A6A4D"/><path d="M0 -170 L44 -90 H-44z M0 -130 L54 -40 H-54z" fill="#6E9A66"/></g>`);
const flower=(x,y,c='#F2B9B4')=>`<g transform="translate(${x} ${y})"><path d="M0 0v-16" stroke="#7FA676" stroke-width="3"/><circle cy="-20" r="7" fill="${c}"/><circle cy="-20" r="3" fill="#F6D58A"/></g>`;
const flowers=()=>[60,140,330,470,610,740].map((x,i)=>flower(x,GY+30+(i%2)*28,['#F2B9B4','#F6D58A','#C9B6E4'][i%3])).join('');
const outdoor=(extra='')=>sky()+sun()+cloud(140,80)+cloud(470,60,.8)+hills()+ground()+extra;
const room=()=>`<rect width="${W}" height="${H}" fill="#F1E6D2"/><rect y="${GY-20}" width="${W}" height="${H}" fill="#D9C2A0"/><rect y="${GY-26}" width="${W}" height="8" fill="#C9A97A"/>
  <rect x="600" y="70" width="140" height="110" rx="10" fill="#CFE4EC" stroke="#B49A7E" stroke-width="8"/><path d="M670 70v110M600 125h140" stroke="#B49A7E" stroke-width="5"/><circle cx="640" cy="160" r="20" fill="#7FA676"/><circle cx="705" cy="165" r="16" fill="#6E9A66"/>`;
const speech=(x,y,txt,cls='hid a-show',d='.3s')=>`<g transform="translate(${x} ${y})"><g class="${cls}" style="--d:${d}"><rect x="${-txt.length*13-14}" y="-34" width="${txt.length*26+28}" height="46" rx="20" fill="#FFFFFF" stroke="#4A4552" stroke-width="3"/><path d="M-8 12 L0 26 L10 12z" fill="#FFFFFF" stroke="#4A4552" stroke-width="3" stroke-linejoin="round"/><rect x="-10" y="8" width="22" height="6" fill="#FFFFFF"/><text x="0" y="-2" text-anchor="middle" font-size="24" font-weight="900" fill="#4A4552">${txt}</text></g></g>`;
const zz=(x,y)=>`<g transform="translate(${x} ${y})"><g class="zz"><text font-size="28" font-weight="900" fill="#6F9FC0">Z</text></g></g><g transform="translate(${x+20} ${y-24})"><g class="zz" style="animation-delay:.8s"><text font-size="22" font-weight="900" fill="#6F9FC0">z</text></g></g>`;
const confetti=(cx,cy,d='.3s')=>{let s='';const c=['#D88E87','#6F9FC0','#E9C46A','#7FB08A','#C9B6E4'];for(let i=0;i<22;i++){const a=i/22*6.28,r=60+(i%4)*30;s+=`<rect x="${cx+Math.cos(a)*r}" y="${cy+Math.sin(a)*r*.6}" width="12" height="8" rx="2" fill="${c[i%5]}" transform="rotate(${i*37} ${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r*.6})"/>`}return `<g class="hid a-show" style="--d:${d}">${s}</g>`};
const heart=(x,y,s=1,d='.2s')=>P(x,y,s,`<path d="M0 0 C-30 -24 -24 -54 0 -40 C24 -54 30 -24 0 0z" fill="#D88E87"/>`,'hid a-show',false,`--d:${d}`);
const windL=(x,y,s=1,d='0s')=>P(x,y,s,`<g class="wind" style="--d:${d}"><path d="M0 0 Q60 -10 120 0 T240 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M10 34 Q70 24 130 34 T250 34" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M0 -34 Q60 -44 120 -34 T230 -34" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/></g>`);

/* ---- 角色 ---- */
function pig(sc='#E9C46A',o={}){const sk='#F2B9B4',dk='#E8A09A';return `
  <ellipse cx="-15" cy="-6" rx="11" ry="7" fill="${dk}"/><ellipse cx="15" cy="-6" rx="11" ry="7" fill="${dk}"/>
  <ellipse cx="0" cy="-42" rx="34" ry="37" fill="${sk}"/>${o.apron?'<path d="M-22 -60 H22 L26 -10 H-26z" fill="#FFFFFF" opacity=".85"/>':''}
  <ellipse cx="-35" cy="-48" rx="9" ry="15" fill="${sk}" transform="rotate(${o.wave?-60:15} -35 -48)"/><ellipse cx="35" cy="-48" rx="9" ry="15" fill="${sk}" transform="rotate(${o.wave?60:-15} 35 -48)"/>
  <path d="M-27 -76 Q0 -64 27 -76 L23 -64 Q0 -54 -23 -64Z" fill="${sc}"/>
  <path d="M-24 -114 L-31 -138 L-7 -121Z" fill="${dk}"/><path d="M24 -114 L31 -138 L7 -121Z" fill="${dk}"/>
  <circle cx="0" cy="-100" r="29" fill="${sk}"/>
  <ellipse cx="0" cy="-91" rx="13" ry="9" fill="${dk}"/><circle cx="-4.5" cy="-91" r="2.6" fill="#B86F68"/><circle cx="4.5" cy="-91" r="2.6" fill="#B86F68"/>
  ${o.sad?'<path d="M-15 -108 q5 -3 9 0M6 -108 q5 -3 9 0" stroke="#4A4552" stroke-width="3" fill="none" stroke-linecap="round"/>':'<circle cx="-11" cy="-107" r="3.4" fill="#4A4552"/><circle cx="11" cy="-107" r="3.4" fill="#4A4552"/>'}
  <circle cx="-19" cy="-95" r="4.5" fill="#E8A09A" opacity=".6"/><circle cx="19" cy="-95" r="4.5" fill="#E8A09A" opacity=".6"/>
  <path d="M-6 -79 q6 4 12 0" stroke="#B86F68" stroke-width="2.5" fill="none" stroke-linecap="round"/>`}

/* ================= 介面 ================= */
const $=id=>document.getElementById(id);
const stageEl=$('stage'),textEl=$('text'),recbar=$('recbar'),endo=$('endo');
let cur=null,pi=0,played=false,autoOn=false,recMode=false,recLive=false,autoT=null;
try{autoOn=localStorage.getItem('storyAuto')==='1'}catch(e){}
function list(){cur=null;KV.stop();clearTimeout(autoT);$('reader').hidden=true;$('list').hidden=false;$('home').hidden=true;$('auto').hidden=true;$('title').textContent='說故事';
  $('list').innerHTML=STORIES.map((s,i)=>`<button class="cover" type="button" data-i="${i}"><svg viewBox="0 0 800 450">${s.cover()}</svg><b>${s.name}</b><small>${s.sub} · ${s.pages.length} 頁</small></button>`).join('');
  $('list').querySelectorAll('.cover').forEach(b=>b.onclick=()=>{A();open(+b.dataset.i)})}
function open(i){cur=STORIES[i];pi=0;$('list').hidden=true;$('reader').hidden=false;$('home').hidden=false;$('auto').hidden=false;$('title').textContent=cur.name;paintAuto();show()}
function show(){clearTimeout(autoT);if(recLive)stopRec(false);const pg=cur.pages[pi];played=false;
  stageEl.querySelector('svg')?.remove();stageEl.insertAdjacentHTML('afterbegin',`<svg class="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${pg.t}"><clipPath id="clp${++gid}"><rect width="800" height="450" rx="24"/></clipPath><g clip-path="url(#clp${gid})">${pg.d()}</g><g transform="translate(680 412)"><g class="hintg"><rect x="-86" y="-24" width="172" height="44" rx="22" fill="#FFFFFF" opacity=".93"/><text y="7" text-anchor="middle" font-size="22" font-weight="900" fill="#4A4552">點畫面看看</text></g></g></svg>`);
  stageEl.querySelector('svg').onclick=act;
  textEl.textContent=pg.t;$('pg').textContent=(pi+1)+' / '+cur.pages.length;$('prev').disabled=pi===0;$('next').textContent=pi===cur.pages.length-1?'講完了 ✓':'下一頁 ▶';
  paintRec();read()}
function read(){KV.say(cur.pages[pi].t,{onend:()=>{if(autoOn&&!recMode&&cur){if(!played)act();autoT=setTimeout(()=>{if(cur)next()},played?2200:1500)}}})}
function act(){A();if(recLive)return;const sv=stageEl.querySelector('svg');sv.classList.remove('go');void sv.getBoundingClientRect();sv.classList.add('go');const s=cur.pages[pi].s;SFX[s]&&SFX[s]();if(cur.pages[pi].crash)SFX.crash();played=true}
function next(){if(pi<cur.pages.length-1){pi++;show()}else finish()}
function finish(){KV.stop();clearTimeout(autoT);endo.hidden=false;SFX.cheer();
  endo.innerHTML=`<h2>${cur.name} 講完了!</h2><svg viewBox="0 0 800 450" style="width:min(80vw,420px);border-radius:20px">${cur.cover()}</svg><button class="big" id="again" type="button">再聽一次</button><button class="big alt" id="other" type="button">選別的故事</button>`;
  $('again').onclick=()=>{endo.hidden=true;pi=0;show()};$('other').onclick=()=>{endo.hidden=true;list()};KV.say('故事講完了')}
$('next').onclick=()=>{A();next()};
$('prev').onclick=()=>{A();if(pi>0){pi--;show()}};
$('home').onclick=()=>list();
function paintAuto(){$('auto').classList.toggle('on',autoOn);$('auto').textContent=autoOn?'自動翻頁 開':'自動翻頁'}
$('auto').onclick=()=>{autoOn=!autoOn;try{localStorage.setItem('storyAuto',autoOn?'1':'0')}catch(e){}paintAuto();if(autoOn&&cur)read()};

/* ---- 大人錄音 ---- */
$('recBtn').onclick=()=>{recMode=!recMode;$('recBtn').classList.toggle('recon',recMode);$('recBtn').textContent=recMode?'🎙 錄音中(按這裡結束)':'🎙 大人錄音';if(!recMode&&recLive)stopRec(false);
  if(recMode&&!cur){open(0)}else paintRec();if(recMode)KV.stop()};
let recSec=0,recTimer=null;
async function paintRec(){recbar.hidden=!recMode||!cur;if(recbar.hidden)return;const key=cur.pages[pi].t;
  if(!KV.rec.ok()){recbar.innerHTML='<span class="st">這台裝置的瀏覽器不能錄音,請用 Safari 或 Chrome 打開</span>';return}
  if(recLive){recbar.innerHTML=`<button class="rb red live" id="rStop" type="button">■ 錄好了</button><span class="st">正在錄音… <b id="rSec">${recSec}</b> 秒,請唸上面那段</span><button class="rb" id="rCancel" type="button">取消</button>`;
    $('rStop').onclick=()=>stopRec(true);$('rCancel').onclick=()=>stopRec(false);return}
  const has=await KV.rec.has(key);if(!cur||cur.pages[pi].t!==key||recLive)return;
  recbar.innerHTML=has?`<span class="st">✓ 這頁已經有大人的聲音</span><button class="rb" id="rPlay" type="button">▶ 聽聽看</button><button class="rb red" id="rGo" type="button">● 重錄</button><button class="rb" id="rDel" type="button">刪掉</button>`
    :`<span class="st">這頁還沒錄,現在會用電腦的聲音</span><button class="rb red" id="rGo" type="button">● 錄這一頁</button>`;
  $('rGo').onclick=startRec;if(has){$('rPlay').onclick=()=>KV.say(key);$('rDel').onclick=async()=>{await KV.rec.del(key);paintRec()}}}
async function startRec(){KV.stop();try{await KV.rec.start()}catch(e){recbar.innerHTML='<span class="st">沒辦法使用麥克風。請允許這個網頁使用麥克風再試一次。</span>';setTimeout(paintRec,3500);return}
  recLive=true;recSec=0;clearInterval(recTimer);recTimer=setInterval(()=>{recSec++;const e=$('rSec');if(e)e.textContent=recSec;if(recSec>=90)stopRec(true)},1000);paintRec()}
async function stopRec(save){clearInterval(recTimer);const key=cur&&cur.pages[pi].t;recLive=false;
  if(save&&key){try{await KV.rec.finish(key);SFX.heart();paintRec();setTimeout(()=>KV.say(key),300);return}catch(e){recbar.innerHTML='<span class="st">錄得太短了,再試一次</span>';setTimeout(paintRec,1800);return}}
  KV.rec.cancel();paintRec()}

list();
document.addEventListener('visibilitychange',()=>{if(document.hidden){KV.stop();clearTimeout(autoT);if(recLive)stopRec(false)}});
</script>
