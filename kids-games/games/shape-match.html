<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>形狀配對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: header / instruction strip / fixed-ratio play board (targets on top, tray below). Deliberately single bright theme, matching the other games. */
:root{
  --ink:#16161D; --bg:#9BE0C0; --wood:#E3A35B; --wood-dark:#C27F3A; --tray:#FFF7E0; --white:#FFFFFF;
  --red:#E8202A; --blue:#1F55E0; --yellow:#FFC400; --green:#14A84B;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px;box-sizing:border-box;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.lv{font-weight:900;font-size:clamp(14px,3.6vw,18px);background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap}
.count{display:flex;align-items:center;gap:4px;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:clamp(16px,4vw,22px);font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}
.count svg{width:1.1em;height:1.1em}
.music{flex:none;width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:5px;cursor:pointer}
.music svg{width:100%;height:100%}.music .x{display:none}.music.off{background:var(--white)}.music.off .x{display:inline}
.music:focus-visible,.btn:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}
.banner{flex:none;display:flex;align-items:center;justify-content:center;min-height:2.7em;box-sizing:border-box;text-align:center;background:var(--white);border:4px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:900;font-size:clamp(16px,4.2vw,22px);line-height:1.3;box-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:calc(var(--u)*400);height:calc(var(--u)*500);border:5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:var(--tray)}
.board{position:absolute;left:0;top:0;width:100%;height:calc(var(--u)*270);background:repeating-linear-gradient(176deg,#E3A35B 0 calc(var(--u)*14),#D9944B calc(var(--u)*14) calc(var(--u)*17),#E3A35B calc(var(--u)*17) calc(var(--u)*30));border-bottom:calc(var(--u)*5) solid var(--ink)}
.trayline{position:absolute;left:4%;right:4%;top:calc(var(--u)*284);text-align:center;font-weight:900;font-size:calc(var(--u)*15);color:#8A7A5A;letter-spacing:.1em}
.slot,.piece{position:absolute}
.slot svg,.piece svg{width:100%;height:100%;display:block;overflow:visible}
.slot{z-index:2;transition:transform .2s}
.slot.hover{transform:scale(1.08)}
.slot .tag{position:absolute;left:50%;bottom:calc(var(--u)*-26);transform:translateX(-50%);font-weight:900;font-size:calc(var(--u)*15);background:var(--white);border:calc(var(--u)*3) solid var(--ink);border-radius:999px;padding:0 calc(var(--u)*8);white-space:nowrap;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.piece{z-index:10;cursor:grab;touch-action:none;filter:drop-shadow(calc(var(--u)*3) calc(var(--u)*4) 0 rgba(22,22,29,.3));transition:left .35s cubic-bezier(.3,1.5,.5,1),top .35s cubic-bezier(.3,1.5,.5,1),transform .2s}
.piece.drag{z-index:50;cursor:grabbing;transition:none;transform:scale(1.12) rotate(0deg)!important;filter:drop-shadow(calc(var(--u)*6) calc(var(--u)*8) 0 rgba(22,22,29,.3))}
.piece.placed{z-index:5;cursor:default;filter:none;transform:none!important}
.piece.shake{animation:shake .4s}
@keyframes shake{25%{translate:calc(var(--u)*-8) 0}75%{translate:calc(var(--u)*8) 0}}
@keyframes pop{from{transform:translateX(-50%) scale(.2)}}
.done{position:absolute;inset:0;z-index:100;background:rgba(255,247,224,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*16);text-align:center;padding:0 16px}
.done h2{margin:0;font-size:calc(var(--u)*44);font-weight:900;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.done p{margin:0;font-size:calc(var(--u)*20);font-weight:700}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*28);padding:calc(var(--u)*10) calc(var(--u)*32);border:5px solid var(--ink);border-radius:999px;background:var(--green);color:var(--white);text-shadow:2px 2px 0 var(--ink);box-shadow:5px 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.burst{position:fixed;pointer-events:none;width:26px;height:26px;z-index:2000;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>形狀配對</h1>
    <div class="tools">
      <span class="lv" id="lv">第 1 關</span>
      <div class="count" aria-live="polite"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#FFC400" stroke="#16161D" stroke-width="2" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
      <button class="music" id="music" type="button" aria-label="背景音樂"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="#16161D" stroke-width="2.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#E8202A" stroke="#16161D" stroke-width="2"/><circle cx="17.5" cy="16" r="3" fill="#1F55E0" stroke="#16161D" stroke-width="2"/><path class="x" d="M3 3L21 21" stroke="#16161D" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div class="banner" id="banner" aria-live="polite"></div>
  <div class="main" id="main"><div class="stage" id="stage"></div></div>
</div>
<script>
/* ================= 聲音(即時合成) ================= */
let ctx=null,musicGain=null,sfx=null,musicOn=true,bgm=null,nextT=0,stepN=0;
const KEY='shapeMusic';
try{musicOn=localStorage.getItem(KEY)!=='off'}catch(e){}
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();musicGain=ctx.createGain();musicGain.gain.value=.1;musicGain.connect(ctx.destination);sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(f,t,d,{type='sine',v=.25,to=null,bus=null}={}){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus||sfx);o.start(t);o.stop(t+d+.03)}catch(e){}}
const T=()=>ac().currentTime;
const S={
  pick(){note(420,T(),.14,{to:900,v:.18})},
  snap(k=0){const t=T();note(1100,t,.08,{to:350,v:.28});[84,88,91].forEach((m,i)=>note(hz(m+k),t+.07+i*.08,.35,{type:'triangle',v:.2}))},
  nope(){const t=T();note(330,t,.18,{type:'triangle',to:180,v:.22});note(260,t+.16,.25,{type:'triangle',to:140,v:.18})},
  back(){note(500,T(),.12,{to:300,v:.1})},
  win(){const t=T();[72,76,79,84,79,84].forEach((m,i)=>note(hz(m),t+i*.13,.3,{type:'square',v:.07}));[72,76,79,84].forEach(m=>note(hz(m),t+.8,1.2,{type:'triangle',v:.12}))}
};
const MEL=[67,0,71,74,79,0,74,0, 76,0,74,72,71,0,0,0, 69,0,72,76,81,0,79,0, 78,76,74,72,74,0,0,0];
const BASS=[43,50,47,50, 48,55,43,50, 45,52,48,52, 50,57,43,0];
const EI=60/126/2;
function sched(){while(nextT<ctx.currentTime+.15){const i=stepN%32,m=MEL[i];
  if(m){note(hz(m),nextT,.3,{type:'triangle',v:.5,bus:musicGain});note(hz(m+12),nextT,.16,{v:.1,bus:musicGain})}
  if(i%2===0&&BASS[i/2])note(hz(BASS[i/2]),nextT,.26,{v:.45,bus:musicGain});
  nextT+=EI;stepN++}}
function startMusic(){if(bgm||!musicOn)return;ac();nextT=ctx.currentTime+.1;stepN=0;musicGain.gain.setValueAtTime(.1,ctx.currentTime);bgm=setInterval(sched,25)}
function stopMusic(){clearInterval(bgm);bgm=null;if(musicGain)musicGain.gain.setTargetAtTime(.0001,ctx.currentTime,.05)}
const musicBtn=document.getElementById('music');
function paintMusic(){musicBtn.classList.toggle('off',!musicOn);musicBtn.setAttribute('aria-pressed',musicOn)}
musicBtn.addEventListener('click',e=>{e.stopPropagation();musicOn=!musicOn;try{localStorage.setItem(KEY,musicOn?'on':'off')}catch(err){}paintMusic();musicOn?startMusic():stopMusic()});
paintMusic();
addEventListener('pointerdown',()=>{ac();startMusic()});

/* ================= 共用 ================= */
const INK='#16161D';
const stage=document.getElementById('stage'),main=document.getElementById('main'),bannerEl=document.getElementById('banner'),starsEl=document.getElementById('stars'),lvEl=document.getElementById('lv');
const U=v=>`calc(var(--u)*${v})`;
function fit(){const u=Math.max(.5,Math.min(main.clientWidth/410,main.clientHeight/510));document.documentElement.style.setProperty('--u',u+'px')}
addEventListener('resize',fit);fit();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function el(cls,html=''){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
function put(n,x,y,w,h){n.style.left=U(x);n.style.top=U(y);n.style.width=U(w);n.style.height=U(h)}
const banner=t=>bannerEl.textContent=t;
let stars=0,level=0;
function toStage(e){const r=stage.getBoundingClientRect(),k=stage.clientWidth/400;return{x:(e.clientX-r.left-stage.clientLeft)/k,y:(e.clientY-r.top-stage.clientTop)/k}}
function burst(cx,cy){const r=stage.getBoundingClientRect(),k=stage.clientWidth/400,x=r.left+stage.clientLeft+cx*k,y=r.top+stage.clientTop+cy*k;
  for(let i=0;i<7;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.classList.add('burst');
  s.innerHTML='<path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#FFC400" stroke="#16161D" stroke-width="2"/>';
  const a=Math.PI*2*i/7;s.style.left=x-13+'px';s.style.top=y-13+'px';s.style.setProperty('--dx',Math.cos(a)*75+'px');s.style.setProperty('--dy',Math.sin(a)*75-30+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}

/* ================= 拖放引擎 =================
   每個 slot: {key, x,y,w,h, el, filled}
   每個 piece: {key, x,y,w,h (家的位置), el, placed, rot}
   一次只追蹤一根手指;放開事件由整個視窗接收,所以不會卡住 */
let slots=[],pieces=[],drag=null;
function addSlot(s){s.el=el('slot',s.svg);put(s.el,s.x,s.y,s.w,s.h);stage.appendChild(s.el);slots.push(s);return s}
function addPiece(p){p.el=el('piece',p.svg);put(p.el,p.x,p.y,p.w,p.h);p.el.style.transform=`rotate(${p.rot||0}deg)`;stage.appendChild(p.el);pieces.push(p);
  p.el.addEventListener('pointerdown',e=>startDrag(p,e));return p}
function slotAt(cx,cy){return slots.find(s=>!s.filled&&cx>s.x-8&&cx<s.x+s.w+8&&cy>s.y-8&&cy<s.y+s.h+8)}
function startDrag(p,e){e.preventDefault();if(drag||p.placed||busy)return;const q=toStage(e);
  drag={p,id:e.pointerId,dx:q.x-p.x,dy:q.y-p.y,over:null};p.el.classList.add('drag');S.pick()}
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const q=toStage(e),p=drag.p;
  const x=Math.max(-p.w*.3,Math.min(400-p.w*.7,q.x-drag.dx)),y=Math.max(-p.h*.3,Math.min(500-p.h*.7,q.y-drag.dy));
  p.el.style.left=U(x);p.el.style.top=U(y);drag.cx=x+p.w/2;drag.cy=y+p.h/2;
  const s=slotAt(drag.cx,drag.cy);if(s!==drag.over){drag.over&&drag.over.el.classList.remove('hover');drag.over=s;s&&s.el.classList.add('hover')}});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const {p,over}=drag;drag=null;p.el.classList.remove('drag');over&&over.el.classList.remove('hover');
  if(over&&over.key===p.key){place(p,over)}
  else{p.el.style.left=U(p.x);p.el.style.top=U(p.y);if(over){S.nope();GAME.wrong&&GAME.wrong(p,over);setTimeout(()=>{p.el.classList.remove('shake');void p.el.offsetWidth;p.el.classList.add('shake')},350)}else S.back()}}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
function place(p,s){p.placed=true;s.filled=true;const g=GAME.fitInSlot(p,s);p.el.classList.add('placed');put(p.el,g.x,g.y,g.w,g.h);
  S.snap(pieces.filter(q=>q.placed).length%4*2);stars++;starsEl.textContent=stars;burst(s.x+s.w/2,s.y+s.h/2);GAME.right&&GAME.right(p,s);
  if(pieces.every(q=>q.placed))setTimeout(finish,700)}
let busy=false;
function finish(){busy=true;S.win();const d=el('done',`<h2>${GAME.winTitle}</h2><p>${GAME.winText(level)}</p>`);
  const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='下一關';b.addEventListener('click',()=>{level++;start()});d.appendChild(b);stage.appendChild(d);b.focus()}
function start(){busy=false;drag=null;slots=[];pieces=[];stage.innerHTML='';lvEl.textContent='第 '+(level+1)+' 關';
  stage.appendChild(el('board'));stage.appendChild(el('trayline',GAME.trayLabel));GAME.build(level)}

/* ================= 遊戲內容 ================= */
const COLORS=['#E8202A','#1F55E0','#FFC400','#14A84B','#FF7A00','#8B3FD9','#00A6B8','#FF4FA3'];
function starPath(){let d='';for(let i=0;i<10;i++){const r=i%2?20:46,a=-Math.PI/2+i*Math.PI/5;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(52+r*Math.sin(a)).toFixed(1)}return d+'Z'}
function hexPath(){let d='';for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;d+=(i?'L':'M')+(50+46*Math.cos(a)).toFixed(1)+' '+(50+46*Math.sin(a)).toFixed(1)}return d+'Z'}
const SHAPES=[
  {k:'circle',n:'圓形',d:'M50 6a44 44 0 1 0 .01 0Z'},
  {k:'square',n:'正方形',d:'M14 8h72q6 0 6 6v72q0 6-6 6H14q-6 0-6-6V14q0-6 6-6Z'},
  {k:'triangle',n:'三角形',d:'M50 6L95 90H5Z'},
  {k:'star',n:'星星',d:starPath()},
  {k:'heart',n:'愛心',d:'M50 90C22 70 4 52 4 32C4 16 16 6 29 6C39 6 46 12 50 20C54 12 61 6 71 6C84 6 96 16 96 32C96 52 78 70 50 90Z'},
  {k:'rect',n:'長方形',d:'M8 26h84q4 0 4 4v40q0 4-4 4H8q-4 0-4-4V30q0-4 4-4Z'},
  {k:'diamond',n:'菱形',d:'M50 4L90 50L50 96L10 50Z'},
  {k:'hexagon',n:'六邊形',d:hexPath()},
  {k:'moon',n:'月亮',d:'M64 6A45 45 0 1 0 94 72A36 36 0 1 1 64 6Z'},
  {k:'oval',n:'橢圓形',d:'M50 20a46 30 0 1 0 .01 0Z'}
];
const holeSVG=s=>`<svg viewBox="0 0 100 100"><path d="${s.d}" fill="#5A3518" stroke="#3B2412" stroke-width="4" stroke-linejoin="round" transform="translate(2 3)"/><path d="${s.d}" fill="#6E4422" stroke="#2E1A0B" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6"/></svg>`;
const pieceSVG=(s,c)=>`<svg viewBox="0 0 100 100"><path d="${s.d}" fill="${c}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="${s.d}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" transform="translate(50 50) scale(.72) translate(-50 -50)"/></svg>`;
const GAME={
  trayLabel:'▼ 把下面的形狀拖到上面一樣的洞裡 ▼',
  winTitle:'全部放好了!',
  winText:l=>'第 '+(l+1)+' 關完成,你認識好多形狀',
  build(l){
    const n=Math.min(3+l,6),pick=shuffle(SHAPES.slice()).slice(0,n),SZ=n<=4?96:88;
    const rows=n<=3?[n]:n===4?[2,2]:n===5?[3,2]:[3,3];
    const cells=[];rows.forEach((c,r)=>{const cy=rows.length===1?128:(r===0?72:192);for(let i=0;i<c;i++)cells.push([400/(c+1)*(i+1)+(c===2?0:0),cy])});
    shuffle(cells);
    pick.forEach((s,i)=>{const [cx,cy]=cells[i];addSlot({key:s.k,name:s.n,svg:holeSVG(s),x:cx-SZ/2,y:cy-SZ/2,w:SZ,h:SZ})});
    const PS=SZ-10,trow=n<=3?[n]:[Math.ceil(n/2),Math.floor(n/2)];const homes=[];
    trow.forEach((c,r)=>{const cy=trow.length===1?400:(r===0?352:448);for(let i=0;i<c;i++)homes.push([400/(c+1)*(i+1),cy])});
    shuffle(homes);const cols=shuffle(COLORS.slice());
    pick.forEach((s,i)=>{const [cx,cy]=homes[i];addPiece({key:s.k,svg:pieceSVG(s,cols[i%cols.length]),x:cx-PS/2+(Math.random()-.5)*14,y:cy-PS/2+(Math.random()-.5)*8,w:PS,h:PS,rot:(Math.random()-.5)*40})});
    banner('形狀要回家!把每個形狀放進一樣的洞');
  },
  fitInSlot:(p,s)=>({x:s.x,y:s.y,w:s.w,h:s.h}),
  right(p,s){s.el.appendChild(el('tag',s.name));banner('對了!這是「'+s.name+'」');},
  wrong(p,s){banner('形狀不一樣喔,再找找看!')}
};


fit();start();
</script>
</body>
</html>
